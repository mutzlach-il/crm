<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap">
<style>
/* Layout: right sidebar (desktop) / bottom bar (phone); summary cards first, then tables that fold into cards on narrow screens */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface2:#EEF1F6; --line:#DCE2EB; --ink:#152033; --ink2:#4A5870; --mute:#7A879C;
  --navy:#1E3A5F; --navy-ink:#FFFFFF; --brass:#9C7419; --brass-soft:#F6EED9;
  --good:#23794A; --good-soft:#E3F3EA; --warn:#B4530A; --warn-soft:#FCEEDD; --bad:#B42318; --bad-soft:#FBE7E5; --info:#1F5FA8; --info-soft:#E4EEFA;
  --demo:#7A4DB3; --demo-soft:#F0E9FA;
  --shadow:0 1px 2px rgba(21,32,51,.06),0 4px 14px rgba(21,32,51,.05);
  --f-display:"Frank Ruhl Libre","David Libre",Georgia,serif;
  --f-body:"IBM Plex Sans Hebrew","Assistant","Segoe UI",Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1520; --surface:#171F2D; --surface2:#1E2838; --line:#2A3649; --ink:#E7ECF4; --ink2:#AEB9CB; --mute:#7F8BA0;
  --navy:#3C6496; --navy-ink:#FFFFFF; --brass:#D6AE52; --brass-soft:#2E2715;
  --good:#5CC48A; --good-soft:#15301F; --warn:#F0A35A; --warn-soft:#352414; --bad:#F2877D; --bad-soft:#3A1A18; --info:#7EB3F0; --info-soft:#16263B;
  --demo:#B79AE6; --demo-soft:#2A2138; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1520; --surface:#171F2D; --surface2:#1E2838; --line:#2A3649; --ink:#E7ECF4; --ink2:#AEB9CB; --mute:#7F8BA0;
  --navy:#3C6496; --navy-ink:#FFFFFF; --brass:#D6AE52; --brass-soft:#2E2715;
  --good:#5CC48A; --good-soft:#15301F; --warn:#F0A35A; --warn-soft:#352414; --bad:#F2877D; --bad-soft:#3A1A18; --info:#7EB3F0; --info-soft:#16263B;
  --demo:#B79AE6; --demo-soft:#2A2138; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;direction:rtl}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.app{display:flex;min-height:100%}
/* sidebar */
.side{width:232px;flex:0 0 232px;background:var(--navy);color:var(--navy-ink);position:sticky;top:0;height:100vh;overflow-y:auto;padding-block:18px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;padding:0 18px 16px}
.brand b{font-family:var(--f-display);font-size:26px;letter-spacing:.04em}
.brand i{width:30px;height:30px;border-radius:8px;background:var(--brass);display:grid;place-items:center;font-style:normal;font-weight:700;color:#fff;font-size:13px}
.side h6{margin:14px 18px 4px;font-size:11px;font-weight:600;letter-spacing:.08em;opacity:.6}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 18px;color:inherit;text-decoration:none;opacity:.86;cursor:pointer;border-inline-start:3px solid transparent}
.nav a:hover{opacity:1;background:rgba(255,255,255,.07)}
.nav a.on{opacity:1;background:rgba(255,255,255,.12);border-inline-start-color:var(--brass);font-weight:600}
.nav .cnt{background:var(--brass);color:#fff;border-radius:20px;font-size:11px;padding:0 7px;line-height:18px}
.main-wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top .crumb{font-family:var(--f-display);font-size:22px;font-weight:700;flex:1;min-width:0;text-wrap:balance}
.top .today{font-size:13px;color:var(--ink2)}
main{padding-block:18px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;width:100%}
.bottom{display:none}
@media (max-width:860px){
  .side{position:fixed;inset-block:0;right:0;z-index:60;transform:translateX(100%);transition:transform .2s;height:100%;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-right:env(safe-area-inset-right,0px)}
  .side.open{transform:none;box-shadow:-8px 0 30px rgba(0,0,0,.3)}
  .bottom{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .bottom a{flex:1;text-align:center;padding:9px 2px 8px;font-size:12px;color:var(--ink2);text-decoration:none;cursor:pointer}
  .bottom a.on{color:var(--brass);font-weight:700}
  .bottom svg{display:block;margin:0 auto 2px;width:20px;height:20px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55}
}
@media (min-width:861px){.only-m{display:none!important}}
/* building blocks */
h2{font-family:var(--f-display);font-size:20px;margin:0;text-wrap:balance}
h3{font-size:15px;margin:0;font-weight:700}
.muted{color:var(--mute)} .small{font-size:12.5px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.card.pad0{padding:0}
.card>.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--ink2)}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.kpi .s{font-size:12px;color:var(--mute)}
.kpi.good .v{color:var(--good)} .kpi.bad .v{color:var(--bad)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.btn.gold{background:var(--brass);color:#fff;border-color:var(--brass)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:3px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{border:0;background:transparent;cursor:pointer;padding:6px;border-radius:8px;color:var(--ink2)}
.pill{display:inline-block;border-radius:20px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface2);color:var(--ink2)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.gold{background:var(--brass-soft);color:var(--brass)}
.pill.demo{background:var(--demo-soft);color:var(--demo)}
.d{display:inline-flex;flex-direction:column;line-height:1.2;font-variant-numeric:tabular-nums}
.d small{font-size:11px;color:var(--mute)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:14px}
.tabs a{padding:8px 12px;cursor:pointer;white-space:nowrap;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;text-decoration:none}
.tabs a.on{color:var(--ink);border-bottom-color:var(--brass);font-weight:600}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar .grow{flex:1 1 200px;min-width:0}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=email],input[type=tel],input[type=url],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
textarea{min-height:84px;resize:vertical;line-height:1.5}
.toolbar select{width:auto;max-width:180px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2);min-width:0}
label.f.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
label.f.chk input{width:auto}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.form .wide{grid-column:1/-1}
.req::after{content:" *";color:var(--bad)}
/* tables */
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:right;font-weight:600;font-size:12.5px;color:var(--ink2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tbody tr{cursor:pointer}
table.t tbody tr:hover{background:var(--surface2)}
table.t tr.static{cursor:default}
table.t tfoot td{font-weight:700;border-bottom:0}
@media (max-width:700px){
  table.t.fold thead{display:none}
  table.t.fold tbody tr{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;padding:10px 12px;border-bottom:1px solid var(--line)}
  table.t.fold td{border:0;padding:2px 0;min-width:0}
  table.t.fold td::before{content:attr(data-label);display:block;font-size:11px;color:var(--mute)}
  table.t.fold td:first-child{grid-column:1/-1;font-weight:600}
  table.t.fold td:first-child::before{display:none}
}
.empty{text-align:center;padding:30px 16px;color:var(--ink2)}
.empty b{display:block;font-size:16px;color:var(--ink);margin-bottom:4px}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .t{min-width:0;overflow-wrap:anywhere}
.li.click{cursor:pointer}
.alert{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;background:var(--surface2);font-size:14px;cursor:pointer}
.alert.bad{background:var(--bad-soft)} .alert.warn{background:var(--warn-soft)} .alert.info{background:var(--info-soft)}
.alert .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:0 0 8px;background:var(--mute)}
.alert.bad .dot{background:var(--bad)} .alert.warn .dot{background:var(--warn)} .alert.info .dot{background:var(--info)}
.bar{height:8px;border-radius:8px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brass);border-radius:8px}
.banner{border-radius:var(--r);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.banner.demo{background:var(--demo-soft);color:var(--demo)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.info{background:var(--info-soft);color:var(--info)}
.stepper{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}
.stepper span{flex:1 0 auto;font-size:12px;padding:5px 10px;border-radius:6px;background:var(--surface2);color:var(--mute);white-space:nowrap;cursor:pointer}
.stepper span.done{background:var(--brass-soft);color:var(--brass)}
.stepper span.cur{background:var(--navy);color:var(--navy-ink);font-weight:600}
.dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:14px}
.dl dt{color:var(--ink2)} .dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
/* kanban */
.kan{display:grid;gap:12px;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--surface2);border-radius:var(--r);padding:10px;min-height:120px}
.kcol h3{display:flex;justify-content:space-between;margin-bottom:8px;font-size:13.5px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:8px;cursor:grab;font-size:14px}
.kcol.over{outline:2px dashed var(--brass)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:12px;color:var(--ink2);text-align:center;padding:4px}
.cal .c{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:92px;padding:5px;font-size:12px;min-width:0;overflow:hidden}
.cal .c.out{opacity:.45}
.cal .c.today{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}
.cal .c.hol{background:var(--brass-soft)}
.cal .c.sh{background:var(--surface2)}
.cal .dn{display:flex;justify-content:space-between;gap:4px;color:var(--ink2)}
.cal .dn b{color:var(--ink)}
.cal .ev{display:block;margin-top:3px;padding:1px 5px;border-radius:4px;background:var(--info-soft);color:var(--info);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.cal .ev.due{background:var(--bad-soft);color:var(--bad)}
.cal .hl{display:block;color:var(--brass);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:700px){.cal .c{min-height:64px}.cal .ev{font-size:10.5px}}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,15,25,.5);z-index:80;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) 12px 24px}
.modal{background:var(--surface);border-radius:12px;width:min(640px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;max-width:100%}
.modal.wide{width:min(960px,100%)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal .mb{padding:16px 18px;min-width:0}
.modal .mf{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line)}
.toasts{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:14px;box-shadow:var(--shadow)}
.toast.bad{background:var(--bad);color:#fff} .toast.good{background:var(--good);color:#fff}
/* timer */
.timer{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:3px 4px 3px 10px;font-size:13px}
.timer.run{border-color:var(--good);background:var(--good-soft)}
.timer .tm{font-variant-numeric:tabular-nums;font-weight:700}
/* chat */
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:min(760px,100%);padding:10px 14px;border-radius:12px;line-height:1.65;overflow-wrap:anywhere}
.msg.u{align-self:flex-start;background:var(--navy);color:var(--navy-ink)}
.msg.a{align-self:flex-end;background:var(--surface);border:1px solid var(--line)}
.msg.a ul{margin:4px 0;padding-inline-start:20px}
.msg.a h4{margin:8px 0 2px;font-size:14.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--brass)}
.loading{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--brass);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.loading{animation-duration:3s}.side{transition:none}}
.skeleton{height:14px;border-radius:6px;background:var(--surface2);margin:8px 0}
.link-url{font-size:13px;direction:ltr;unicode-bidi:plaintext;overflow-wrap:anywhere}
.funnel{display:flex;flex-direction:column;gap:6px}
.funnel .st{display:flex;align-items:center;gap:10px}
.funnel .st b{width:120px;flex:0 0 120px;font-weight:500;font-size:13.5px}
.funnel .st .bar{flex:1;height:22px}
.funnel .st .bar>i{background:var(--navy)}
.funnel .st span{width:70px;text-align:left;font-variant-numeric:tabular-nums;font-weight:700}
.chart{display:flex;gap:10px;align-items:flex-end;height:150px;padding-top:10px}
.chart .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%;justify-content:flex-end}
.chart .bars{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.chart .bars i{width:min(18px,40%);border-radius:4px 4px 0 0;background:var(--navy);min-height:2px}
.chart .bars i.x{background:var(--brass)}
.chart small{font-size:11px;color:var(--mute);white-space:nowrap}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;vertical-align:-1px}
hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0}
.items-tbl input{padding:5px 7px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--surface2);padding:8px 10px;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere;direction:rtl}
</style>

<div class="app" id="app">
  <aside class="side" id="side" aria-label="תפריט ראשי"></aside>
  <div class="main-wrap">
    <header class="top">
      <button class="icon-btn only-m" data-act="nav" aria-label="פתיחת תפריט"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="crumb" id="crumb">CRM</div>
      <div id="timerBox"></div>
      <div class="today" id="todayBox"></div>
    </header>
    <main id="main">
      <div class="card"><div class="skeleton" style="width:40%"></div><div class="skeleton"></div><div class="skeleton" style="width:70%"></div><p class="muted small">טוען את הנתונים…</p></div>
    </main>
  </div>
  <nav class="bottom" id="bottom" aria-label="ניווט מהיר"></nav>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
'use strict';
/* ========== utilities ========== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO=()=>iso(new Date());
const parseD=s=>{if(!s)return null;const[y,m,d]=String(s).slice(0,10).split('-').map(Number);if(!y)return null;return new Date(y,m-1,d,12);};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return iso(d);};
const addMonths=(s,n)=>{const d=parseD(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d);};
const daysBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n;};

function gem(n){const L=[[400,'ת'],[300,'ש'],[200,'ר'],[100,'ק'],[90,'צ'],[80,'פ'],[70,'ע'],[60,'ס'],[50,'נ'],[40,'מ'],[30,'ל'],[20,'כ'],[10,'י'],[9,'ט'],[8,'ח'],[7,'ז'],[6,'ו'],[5,'ה'],[4,'ד'],[3,'ג'],[2,'ב'],[1,'א']];
  let s='';n=n%1000;while(n>0){if(n===15){s+='טו';break;}if(n===16){s+='טז';break;}for(const[v,c]of L){if(n>=v){s+=c;n-=v;break;}}}
  return s.length>1?s.slice(0,-1)+'״'+s.slice(-1):s+'׳';}
const HCACHE=new Map();
function hparts(s){if(HCACHE.has(s))return HCACHE.get(s);let r=null;try{const p=HEN.formatToParts(parseD(s));r={day:+p.find(x=>x.type==='day').value,month:p.find(x=>x.type==='month').value,year:+p.find(x=>x.type==='year').value};}catch(e){}HCACHE.set(s,r);return r;}
function hebDate(s,withYear=false){const p=hparts(s);if(!p)return'';return `${gem(p.day)} ${HMONTH[p.month]||p.month}${withYear?' '+gem(p.year):''}`;}
function dayInfo(s){const p=hparts(s);const d=parseD(s);const r={shabbat:d.getDay()===6,friday:d.getDay()===5,yt:'',chol:'',label:'',bein:false};if(!p)return r;const m=p.month,dd=p.day;
  const YT={Tishri:{1:'ראש השנה',2:'ראש השנה',10:'יום הכיפורים',15:'סוכות',22:'שמיני עצרת'},Nisan:{15:'פסח',21:'שביעי של פסח'},Sivan:{6:'שבועות'}};
  if(YT[m]&&YT[m][dd])r.yt=YT[m][dd];
  if(m==='Tishri'&&dd>=16&&dd<=21)r.chol=dd===21?'הושענא רבה':'חול המועד סוכות';
  if(m==='Nisan'&&dd>=16&&dd<=20)r.chol='חול המועד פסח';
  const LBL={Elul:{29:'ערב ראש השנה'},Tishri:{9:'ערב יום הכיפורים',14:'ערב סוכות'},Nisan:{14:'ערב פסח'},Sivan:{5:'ערב שבועות'},Av:{9:'תשעה באב'},Kislev:{25:'חנוכה',26:'חנוכה',27:'חנוכה',28:'חנוכה',29:'חנוכה',30:'חנוכה'},Tevet:{1:'חנוכה',2:'חנוכה'}};
  if(LBL[m]&&LBL[m][dd])r.label=LBL[m][dd];

  if((m==='Tishri'&&dd>=11)||m==='Nisan'||(m==='Av'&&dd>=9))r.bein=true;

function addWorkDays(s,n){let d=s,c=0;while(c<n){d=addDays(d,1);if(isWorkDay(d))c++;}return d;}
function workDaysBetween(a,b){if(!a||!b)return 0;let c=0,d=a;const sign=b>=a?1:-1;if(sign<0)return -workDaysBetween(b,a);while(d<b){d=addDays(d,1);if(isWorkDay(d))c++;}return c;}

const chains={};

function errMsg(e){const c=e&&e.code;return({quota_exceeded:'המאגר מלא. מחק רשומות ישנות ונסה שוב.',resource_exhausted:'יותר מדי פעולות בבת אחת. המתן רגע ונסה שוב.',invalid_argument:'השמירה נדחתה. ייתכן שאין לך הרשאת כתיבה למערכת הזו.',revoked:'הגישה למאגר הופסקה. רענן את הדף.',unavailable:'אין חיבור כרגע. נסה שוב בעוד רגע.'})[c]||'השמירה נכשלה. נסה שוב.';}

async function put(col,obj){
  const now=new Date().toISOString();const o=clean({...obj});
  if(!o.id){o.id=uid();o.createdAt=now;}
  o.updatedAt=now;
  const prev=S[col].get(o.id);S[col].set(o.id,o);scheduleRender();
  if(db){try{await chain(col+'/'+o.id,()=>withRetry(()=>db.collection(col).doc(o.id).set(o)));}
    catch(e){if(prev)S[col].set(o.id,prev);else S[col].delete(o.id);scheduleRender();toast(errMsg(e),'bad');throw e;}}
  else lsSave();
  return o;
}

function projFin(p){
  const adds=all('additions').filter(a=>a.project===p.id);
  const approvedAdds=sum(adds.filter(a=>a.status==='אושר'),'price');
  const pendingAdds=sum(adds.filter(a=>a.status==='ממתין לאישור'),'price');
  const agreed=num(p.price)+approvedAdds;
  const pays=all('payments').filter(x=>x.project===p.id);
  const paid=sum(pays,'amount');
  const exp=sum(all('expenses').filter(x=>x.project===p.id&&x.assign!=='קמפיין'),'amount');
  const minutes=sum(all('timelogs').filter(x=>x.project===p.id),'minutes');
  const hours=minutes/60;
  return{agreed,approvedAdds,pendingAdds,paid,balance:isApproved(p)?Math.max(0,agreed-paid):0,exp,hours,profitExp:agreed-exp,profitAct:paid-exp,perHour:hours?(agreed-exp)/hours:0};
}
function periodRange(p){const t=new Date();const y=t.getFullYear(),m=t.getMonth();

  if(p==='quarter')return{from:iso(new Date(y,m-2,1)),to:iso(new Date(y,m+1,0)),label:'3 חודשים אחרונים'};

function fixedInRange(r){let tot=0;const start=r.from<'2000'?null:r.from;
  for(const f of all('fixed')){let a=f.startDate||'2000-01-01';const fromM=start&&start>a?start:a;let cur=fromM.slice(0,7)+'-01';const endD=[r.to,f.endDate||'2999-12-31',todayISO()].sort()[0];
    let guard=0;while(cur<=endD&&guard++<600){tot+=num(f.monthly);cur=addMonths(cur,1);} }
  return tot;}
function finance(r){const income=sum(all('payments').filter(x=>inRange(x.date,r)),'amount');
  const oneOff=sum(all('expenses').filter(x=>inRange(x.date,r)),'amount');const fx=fixedInRange(r);
  return{income,oneOff,fixed:fx,expenses:oneOff+fx,profit:income-oneOff-fx};}
const mrr=()=>sum(all('subscriptions').filter(s=>s.status==='פעיל'),'monthly');
function campaignStats(c){const leads=all('leads').filter(l=>l.campaign===c.id);
  const clientIds=new Set([...all('clients').filter(x=>x.campaign===c.id).map(x=>x.id),...leads.map(l=>l.convertedClient).filter(Boolean)]);
  const projs=all('projects').filter(p=>clientIds.has(p.client)||p.campaign===c.id);const pids=new Set(projs.map(p=>p.id));
  const income=sum(all('payments').filter(x=>pids.has(x.project)),'amount');
  const spend=sum(all('expenses').filter(x=>x.campaign===c.id),'amount');
  return{leads:leads.length,clients:clientIds.size,projects:projs.length,income,spend,cpl:leads.length?spend/leads.length:NaN,cpa:clientIds.size?spend/clientIds.size:NaN,conv:leads.length?clientIds.size/leads.length:NaN};}
function channelStats(ch){const leads=all('leads').filter(l=>l.channel===ch);
  const clientIds=new Set([...all('clients').filter(x=>x.channel===ch).map(x=>x.id),...leads.map(l=>l.convertedClient).filter(Boolean)]);
  const projs=all('projects').filter(p=>clientIds.has(p.client));const pids=new Set(projs.map(p=>p.id));
  const payingClients=new Set(all('payments').filter(x=>pids.has(x.project)).map(x=>get('projects',x.project)?.client));
  const income=sum(all('payments').filter(x=>pids.has(x.project)),'amount');
  const camps=all('campaigns').filter(c=>c.channel===ch).map(c=>c.id);
  const spend=sum(all('expenses').filter(x=>camps.includes(x.campaign)),'amount');
  return{leads:leads.length,clients:clientIds.size,paying:payingClients.size,projects:projs.length,income,spend,cpl:leads.length&&spend?spend/leads.length:NaN,cpa:clientIds.size&&spend?spend/clientIds.size:NaN,conv:leads.length?clientIds.size/leads.length:NaN};}
const clientsOfCommunity=cid=>all('clients').filter(c=>c.community===cid);
const systemsOfClient=cid=>all('systems').filter(s=>s.client===cid);

function computeAlerts(){const A=[];const t=todayISO();
  for(const p of all('projects')){if(isClosedStage(p.stage))continue;
    if(p.dueDate){const wd=workDaysBetween(t,p.dueDate);const open=all('tasks').filter(x=>x.project===p.id&&x.status!=='הושלם').length;
      if(p.dueDate<t)A.push({lvl:'bad',text:`מועד המסירה של "${p.name}" עבר${open?` – ${open} משימות פתוחות`:''}`,page:'project',id:p.id});
      else if(wd<=5)A.push({lvl:'warn',text:`"${p.name}" נמסר בעוד ${wd} ימי עבודה${open?` – ${open} משימות פתוחות`:''}`,page:'project',id:p.id});}
    const f=projFin(p);if(f.exp>0&&f.agreed>0&&f.exp>f.agreed*0.5)A.push({lvl:'warn',text:`ההוצאות על "${p.name}" עברו חצי מהמחיר שסוכם`,page:'project',id:p.id});}
  for(const a of all('additions').filter(a=>a.status==='ממתין לאישור'))A.push({lvl:'info',text:`תוספת ממתינה לאישור הלקוח: ${a.description?.slice(0,50)} (${money(a.price)})`,page:'project',id:a.project,tab:'quotes'});
  for(const q of all('quotes').filter(q=>q.status==='נשלחה'&&q.followUp&&q.followUp<=t))A.push({lvl:'warn',text:`לעקוב אחרי הצעת מחיר ${q.number||''} ל${refName('clients',q.client)||refName('leads',q.lead)}`,page:'quotes'});
  for(const c of all('campaigns').filter(c=>c.status==='פעיל'&&num(c.budget)>0)){const s=campaignStats(c);if(s.spend>num(c.budget))A.push({lvl:'bad',text:`הקמפיין "${c.name}" חרג מהתקציב (${money(s.spend)} מתוך ${money(c.budget)})`,page:'marketing',tab:'campaigns'});}
  for(const i of all('installments').filter(i=>i.status!=='שולם'&&i.dueDate<=t))A.push({lvl:'bad',text:`תשלום בפריסה לא התקבל: ${money(i.amount)} – ${refName('projects',i.project)} (${plainDate(i.dueDate)})`,page:'finance',tab:'installments'});
  for(const s of all('subscriptions').filter(s=>s.status==='פעיל'&&s.nextCharge&&s.nextCharge<=t))A.push({lvl:'warn',text:`חיוב מנוי לגבייה: ${s.name} – ${refName('clients',s.client)} (${money(s.monthly)})`,page:'finance',tab:'subs'});
  for(const r of all('renewals').filter(r=>r.date&&daysBetween(t,r.date)<=30))A.push({lvl:r.date<t?'bad':'warn',text:`חידוש: ${r.item}${r.system?' – '+refName('systems',r.system):''} (${plainDate(r.date)})`,page:'systems',tab:'renewals'});
  for(const s of all('systems')){if(s.netfree==='נשלח'&&s.netfreeDate&&daysBetween(s.netfreeDate,t)>7)A.push({lvl:'warn',text:`NetFree עדיין לא אישרו את "${s.name}" (נשלח לפני ${daysBetween(s.netfreeDate,t)} ימים)`,page:'systems',tab:'netfree'});
    if(s.uptime==='לא עובד'&&s.active==='פעיל')A.push({lvl:'bad',text:`המערכת "${s.name}" סומנה כלא עובדת`,page:'systems',tab:'systems'});
    if(num(s.quotaLimit)>0&&num(s.quotaUsed)>=num(s.quotaLimit)*0.8)A.push({lvl:'warn',text:`"${s.name}" ניצלה ${pct(num(s.quotaUsed)/num(s.quotaLimit))} מהמכסה (${esc(s.quotaName||'')})`,page:'systems',tab:'quota'});}
  if(!SET.prospectingFrozen){const fu=all('prospects').filter(x=>x.status==='נשלח'&&x.sentAt&&addWorkDays(x.sentAt,5)<=t);if(fu.length)A.push({lvl:'warn',text:`${fu.length} מוסדות לא ענו כבר 5 ימי עבודה – הגיע הזמן לתזכורת`,page:'prospects',tab:'sent'});}
  for(const s of all('subscriptions').filter(s=>s.contractSent&&!s.contractSigned&&daysBetween(s.contractSent,t)>=7))A.push({lvl:'warn',text:`החוזה של ${refName('clients',s.client)} עוד לא חזר חתום (נשלח לפני ${daysBetween(s.contractSent,t)} ימים)`,page:'client',id:s.client});
  for(const s of all('subscriptions').filter(s=>s.status==='פעיל'&&num(s.includedHours)>0&&s.usageMonth===todayISO().slice(0,7))){const u=num(s.usedHours),inc=subInc(s);
    const ap=s.overageApprovedMonth===todayISO().slice(0,7);
    if(u>=inc&&!ap)A.push({lvl:'bad',text:`${refName('clients',s.client)} הגיע ל-100% מהחבילה – ההעלאות עצורות. הצעת השדרוג עם ${num(SET.upgradeBonusHours)} שעות מתנה בתוקף רק היום – כדאי להתקשר`,page:'client',id:s.client,tab:'systems'});
    else if(u>inc)A.push({lvl:'warn',text:`${refName('clients',s.client)} בחריגה מאושרת: ${u.toFixed(1)} מתוך ${inc} שעות – ${money((u-inc)*num(s.overage))} לחיוב`,page:'client',id:s.client,tab:'systems'});
    else if(u>=inc*0.8)A.push({lvl:'info',text:`${refName('clients',s.client)} ניצל ${pct(u/inc)} מהשעות החודש (${u.toFixed(1)} מתוך ${inc})`,page:'client',id:s.client,tab:'systems'});}
  for(const k of all('tickets').filter(k=>k.status!=='טופלה'&&k.priority==='גבוהה'))A.push({lvl:'bad',text:`תקלה דחופה: ${k.title}`,page:'systems',tab:'tickets'});
  for(const l of all('leads').filter(l=>isNewLead(l)&&l.date&&daysBetween(l.date,t)>=2))A.push({lvl:'warn',text:`הפנייה של ${l.name} מחכה כבר ${daysBetween(l.date,t)} ימים`,page:'lead',id:l.id});
  if(MODE==='db'&&(!SET.lastBackup||daysBetween(SET.lastBackup.slice(0,10),t)>7))A.push({lvl:'info',text:SET.lastBackup?`הגיבוי האחרון נעשה לפני ${daysBetween(SET.lastBackup.slice(0,10),t)} ימים`:'עוד לא נעשה גיבוי של המערכת',page:'settings',tab:'backup'});
  const ord={bad:0,warn:1,info:2};return A.sort((a,b)=>ord[a.lvl]-ord[b.lvl]);}
/* ========== UI primitives ========== */
function toast(msg,kind=''){const el=document.createElement('div');el.className='toast '+kind;el.textContent=msg;$('#toasts').appendChild(el);setTimeout(()=>el.remove(),kind==='bad'?6000:3200);}
let modalStack=[];
function modal(title,body,{wide=false,foot=''}={}){
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="mh"><h2>${esc(title)}</h2><button class="icon-btn" data-close aria-label="סגירה"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="mb">${body}</div>${foot?`<div class="mf">${foot}</div>`:''}</div>`;
  document.body.appendChild(bg);modalStack.push(bg);
  const close=()=>{bg.remove();modalStack=modalStack.filter(x=>x!==bg);};
  bg.addEventListener('mousedown',e=>{if(e.target===bg)bg._down=true;});
  bg.addEventListener('click',e=>{if((e.target===bg&&bg._down)||e.target.closest('[data-close]'))close();bg._down=false;});
  bg.close=close;setTimeout(()=>{const f=bg.querySelector('input:not([type=checkbox]),textarea,select');f&&f.focus();},30);
  return bg;}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalStack.length)modalStack[modalStack.length-1].close();});
function ask(text,{ok='אישור',danger=false,title='אישור פעולה'}={}){return new Promise(res=>{
  const m=modal(title,`<p style="margin:0">${text}</p>`,{foot:`<span></span><span class="row"><button class="btn" data-close>ביטול</button><button class="btn ${danger?'danger':'pri'}" id="askOk">${esc(ok)}</button></span>`});
  const done=v=>{m.close();res(v);};m.querySelector('#askOk').onclick=()=>done(true);
  const obs=new MutationObserver(()=>{if(!document.body.contains(m)){obs.disconnect();res(false);}});obs.observe(document.body,{childList:true});});}
async function copyText(text,btn){try{await navigator.clipboard.writeText(text);toast('הועתק');}catch(e){toast('לא הצלחתי להעתיק אוטומטית – סמן את הטקסט והעתק ידנית','bad');}}
function textModal(title,text,{note=''}={}){const m=modal(title,`${note?`<p class="muted small" style="margin-top:0">${note}</p>`:''}<textarea id="tmText" style="min-height:260px">${esc(text)}</textarea>`,{wide:true,foot:`<span></span><span class="row"><button class="btn" data-close>סגירה</button><button class="btn pri" id="tmCopy">העתקה</button></span>`});
  m.querySelector('#tmCopy').onclick=()=>copyText(m.querySelector('#tmText').value);return m;}
async function saveFile(filename,data,mime='text/html'){
  if(!downloadsApi&&!window.claude?.use){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:mime+';charset=utf-8'}));a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);toast('הקובץ ירד למחשב');return true;}catch(e){}}
  if(downloadsApi){try{await downloadsApi.save({filename,data:new Blob([data],{type:mime+';charset=utf-8'})});toast('הקובץ נשמר');return true;}
    catch(e){if(e&&(e.code==='cancelled'||e.code==='declined'||e.code==='user_cancelled'))return false;toast('השמירה לא הצליחה. אפשר להעתיק את התוכן במקום.','bad');}}
  textModal('העתקת הקובץ',data,{note:'שמירת קבצים לא זמינה בתצוגה הזו. אפשר להעתיק את התוכן, להדביק בקובץ חדש ולשמור אותו בשם '+filename});return false;}

/* ========== generic list ========== */
const UI={};
function uiState(key,col){return UI[key]??={q:'',f:{},sort:SCHEMA[col]?.sort||'createdAt',dir:SCHEMA[col]?.dir||'desc'};}
function cellVal(col,key,o){
  if(col==='quotes'&&key==='total')return `<span class="num">${money(quoteTotal(o))}</span>`;
  if(col==='quotes'&&key==='client')return o.client?refLink('clients',o.client):(o.lead?esc(refName('leads',o.lead))+' <span class="muted small">(פנייה)</span>':'—');
  const f=SCHEMA[col].fields.find(x=>x.key===key)||{type:key==='date'?'date':'text'};const v=o[key];
  if(f.type==='ref')return refLink(f.ref,v);
  if(f.type==='date')return fmtDate(v);
  if(f.type==='money')return v===''||v==null?'<span class="muted">—</span>':`<span class="num">${money(v)}</span>`;
  if(f.type==='bool')return v?'✓':'';
  if(f.type==='select')return pill(v);
  if(key==='minutes')return `<span class="num">${(num(v)/60).toFixed(1)} ש׳</span>`;
  if(f.type==='textarea'){const s=String(v||'');return esc(s.length>70?s.slice(0,70)+'…':s);}
  return esc(v);}
function sortVal(col,key,o){const f=SCHEMA[col].fields.find(x=>x.key===key);if(col==='quotes'&&key==='total')return quoteTotal(o);if(!f)return o[key]??'';
  if(f.type==='ref')return refName(f.ref,o[key]);if(f.type==='money'||f.type==='number')return num(o[key]);return o[key]??'';}
function searchText(col,o){return SCHEMA[col].fields.map(f=>f.type==='ref'?refName(f.ref,o[f.key]):o[f.key]).concat(o.number||'').join(' ').toLowerCase();}
function listView(col,{key=col,rows=null,cols=null,filters=null,preset={},addLabel=null,empty=null,noAdd=false,tools='',foot=null}={}){
  const sc=SCHEMA[col],st=uiState(key,col);cols=cols||sc.cols;filters=filters??sc.filters??[];
  let data=rows??all(col);
  if(st.q){const q=st.q.toLowerCase();data=data.filter(o=>searchText(col,o).includes(q));}
  for(const[k,v]of Object.entries(st.f))if(v)data=data.filter(o=>String(o[k]??'')===v);
  const dir=st.dir==='asc'?1:-1;data=[...data].sort((a,b)=>{const x=sortVal(col,st.sort,a),y=sortVal(col,st.sort,b);if(x===''&&y!=='')return 1;if(y===''&&x!=='')return -1;return(x>y?1:x<y?-1:0)*dir;});
  const fsel=filters.map(k=>{const f=sc.fields.find(x=>x.key===k);if(!f)return'';let o=[];
    if(f.type==='ref')o=all(f.ref).map(r=>[r.id,nameOf(f.ref,r)]).sort((a,b)=>a[1].localeCompare(b[1],'he'));
    else o=(typeof f.options==='function'?f.options():f.options||[]).filter(Boolean).map(x=>[x,x]);
    return `<select id="f-${key}-${k}" data-uif="${key}" data-k="${k}" aria-label="${esc(f.label)}"><option value="">${esc(f.label)}: הכול</option>${o.map(([v,l])=>`<option value="${esc(v)}" ${st.f[k]===v?'selected':''}>${esc(l)}</option>`).join('')}</select>`;}).join('');
  const total=(rows??all(col)).length;
  const head=`<div class="toolbar"><input class="grow" type="search" id="q-${key}" data-uiq="${key}" placeholder="חיפוש…" value="${esc(st.q)}" aria-label="חיפוש">${fsel}${tools}${noAdd?'':`<button class="btn pri" data-act="add" data-col="${col}" data-preset="${json(preset)}">+ ${esc(addLabel||'הוספת '+sc.one)}</button>`}</div>`;
  if(!total)return head+`<div class="card empty"><b>${esc(empty?.[0]||'עדיין אין כאן רשומות')}</b>${esc(empty?.[1]||'לחץ על הכפתור למעלה כדי להוסיף את הראשונה.')}</div>`;
  if(!data.length)return head+`<div class="card empty"><b>לא נמצאו תוצאות</b>נסה לשנות את החיפוש או את הסינון.</div>`;
  const th=cols.map(k=>`<th data-act="sort" data-key="${key}" data-f="${k}">${esc(FIELD_LABEL(col,k))}${st.sort===k?(st.dir==='asc'?' ▲':' ▼'):''}</th>`).join('');
  const tr=data.map(o=>`<tr data-act="open" data-col="${col}" data-id="${esc(o.id)}">${cols.map((k,i)=>`<td data-label="${esc(FIELD_LABEL(col,k))}">${cellVal(col,k,o)}${i===0?demoPill(o):''}</td>`).join('')}</tr>`).join('');
  return head+`<div class="card pad0 tbl-wrap"><table class="t fold"><thead><tr>${th}</tr></thead><tbody>${tr}</tbody>${foot?`<tfoot><tr class="static">${foot(data)}</tr></tfoot>`:''}</table></div><p class="muted small">${data.length} מתוך ${total}</p>`;}

/* ========== generic form ========== */
function defVal(f){return typeof f.def==='function'?f.def():f.def;}
function fieldHTML(f,v){const id='fld-'+f.key;const lab=`<span class="${f.req?'req':''}">${esc(f.label)}</span>`;const w=f.wide||f.type==='textarea'?' wide':'';
  if(f.type==='bool')return `<label class="f chk${w}"><input type="checkbox" id="${id}" ${v?'checked':''}> ${esc(f.label)}</label>`;
  let inp;
  if(f.type==='textarea')inp=`<textarea id="${id}">${esc(v)}</textarea>`;
  else if(f.type==='select'){const o=(typeof f.options==='function'?f.options():f.options)||[];const list=v&&!o.includes(v)?[...o,v]:o;inp=`<select id="${id}">${list.map(x=>`<option value="${esc(x)}" ${x===v?'selected':''}>${esc(x||'—')}</option>`).join('')}</select>`;}
  else if(f.type==='ref'){const o=all(f.ref).map(r=>[r.id,nameOf(f.ref,r)]).sort((a,b)=>a[1].localeCompare(b[1],'he'));inp=`<select id="${id}"><option value="">—</option>${o.map(([i,l])=>`<option value="${esc(i)}" ${i===v?'selected':''}>${esc(l)}</option>`).join('')}</select>`;}
  else{const t={money:'number',number:'number',date:'date',email:'email',tel:'tel',url:'url'}[f.type]||'text';inp=`<input type="${t}" id="${id}" value="${esc(v)}" ${t==='number'?'step="any" inputmode="decimal"':''} ${t==='url'||t==='email'?'dir="ltr"':''}>`;}
  return `<label class="f${w}">${lab}${inp}</label>`;}
function readField(f,root){const el=root.querySelector('#fld-'+f.key);if(!el)return undefined;if(f.type==='bool')return el.checked;if(f.type==='money'||f.type==='number')return el.value===''?'':num(el.value);return el.value.trim();}
function openForm(col,obj={},opt={}){
  const sc=SCHEMA[col];const isNew=!obj.id;const o={...obj};
  if(isNew)for(const f of sc.fields)if(o[f.key]===undefined&&f.def!==undefined)o[f.key]=defVal(f);
  const fields=sc.fields.filter(f=>!(f.hide&&f.hide(o))&&!(opt.hideFields||[]).includes(f.key));
  const m=modal((isNew?'הוספת ':'עריכת ')+sc.one,`${o.demo?'<div class="banner demo" style="margin-bottom:12px">זו רשומת הדגמה ולא נתון אמיתי.</div>':''}<form id="frm" class="form" novalidate>${fields.map(f=>fieldHTML(f,o[f.key]??'')).join('')}${opt.extra||''}</form><p id="frmErr" class="small" style="color:var(--bad)" hidden></p>`,
    {wide:fields.length>8,foot:`<span>${!isNew?`<button class="btn danger" id="frmDel" type="button">מחיקה</button>`:''}</span><span class="row"><button class="btn" data-close type="button">ביטול</button><button class="btn pri" id="frmSave" type="button">שמירה</button></span>`});
  const submit=async()=>{const vals={};for(const f of fields){const v=readField(f,m);if(v!==undefined)vals[f.key]=v;}
    const miss=fields.filter(f=>f.req&&(vals[f.key]===''||vals[f.key]==null));
    if(miss.length){const e=m.querySelector('#frmErr');e.textContent='חסר: '+miss.map(f=>f.label).join(', ');e.hidden=false;m.querySelector('#fld-'+miss[0].key)?.focus();return;}
    const btn=m.querySelector('#frmSave');btn.disabled=true;btn.innerHTML='<span class="loading"></span> שומר…';
    const prev=isNew?null:{...get(col,o.id)};
    try{const saved=await put(col,{...o,...vals});m.close();toast('נשמר','good');await onSaved(col,saved,prev,isNew);opt.after?.(saved);}
    catch(e){btn.disabled=false;btn.textContent='שמירה';}};
  m.querySelector('#frmSave').onclick=submit;m.querySelector('#frm').addEventListener('submit',e=>{e.preventDefault();submit();});
  m.querySelector('#frm').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();submit();}});
  m.querySelector('#frmDel')?.addEventListener('click',async()=>{if(await ask(`למחוק את ה${sc.one} "${esc(nameOf(col,o))}"? אי אפשר לבטל את זה.`,{ok:'מחיקה',danger:true})){try{await del(col,o.id);m.close();toast('נמחק');opt.afterDelete?.();}catch(e){}}});

function openRecord(col,id){if(DETAIL[col])return go(DETAIL[col],id);if(col==='quotes')return openQuote(get('quotes',id));if(col==='content')return openContent(get('content',id));if(col==='payments')return openPayment(get('payments',id));if(col==='notes')return openNote(get('notes',id));openForm(col,get(col,id));}

async function onSaved(col,o,prev,isNew){const t=todayISO();
  try{
  if(col==='leads'&&isNew&&SET.notifyLeads&&(o.channel==='אתר'||o.channel==='חבר מביא חבר'||o.referrer))notifyLead(o);
  if(col==='leads'&&isNew){await put('tasks',{title:`לחזור ל${o.name}`,due:t,priority:'גבוהה',status:'לעשות',lead:o.id,auto:true});toast('נוצרה משימת חזרה לפנייה');}
  if(col==='projects'){
    const was=prev?.stage,now=o.stage;
    if(now!==was&&stageIdx(now)>=3&&!o.approved)await put('projects',{...get('projects',o.id),approved:true});
    if(now!==was&&now===SET.stages[3]&&!all('tasks').some(x=>x.project===o.id)){
      if(await ask(`הפרויקט "${esc(o.name)}" עבר לתכנון. ליצור לו רשימת משימות התחלתית (${SET.starterTasks.length} משימות)?`,{ok:'כן, ליצור'})){let d=o.startDate&&o.startDate>t?o.startDate:t;
        for(const s of SET.starterTasks){d=addWorkDays(d,2);await put('tasks',{title:s,project:o.id,client:o.client,due:o.dueDate&&d>o.dueDate?o.dueDate:d,priority:'בינונית',status:'לעשות',auto:true});}toast('נוצרו משימות התחלתיות');}}
    if(now!==was&&now===SET.stages[SET.stages.length-2]){const p=get('projects',o.id);
      if(!(p.checklist||[]).length)await put('projects',{...p,checklist:SET.deliveryChecklist.map(x=>({text:x,done:false}))});
      await put('tasks',{title:`שיחת מעקב אחרי מסירה – ${o.name}`,project:o.id,client:o.client,due:addWorkDays(t,10),priority:'בינונית',status:'לעשות',auto:true});
      await put('tasks',{title:`לבקש המלצה מהלקוח – ${o.name}`,project:o.id,client:o.client,due:addWorkDays(t,5),priority:'נמוכה',status:'לעשות',auto:true});
      toast('נפתחה רשימת בדיקות מסירה ונוצרו משימות מעקב');}}
  if(col==='additions'&&o.status==='אושר'&&prev?.status!=='אושר'){const a={...o};if(!a.approvalDate){a.approvalDate=t;await put('additions',a);}
    const p=get('projects',o.project);if(p&&num(o.impactDays)>0&&p.dueDate&&await ask(`התוספת אושרה. לדחות את מועד המסירה של "${esc(p.name)}" ב-${num(o.impactDays)} ימי עבודה?`,{ok:'כן, לדחות'})){await put('projects',{...p,dueDate:addWorkDays(p.dueDate,num(o.impactDays))});toast('מועד המסירה עודכן');}}
  if(col==='quotes'&&o.status==='נשלחה'&&prev?.status!=='נשלחה'){const fu=addWorkDays(t,3);await put('quotes',{...get('quotes',o.id),followUp:fu,sentDate:t});
    await put('tasks',{title:`מעקב אחרי הצעת מחיר ${o.number||''}`,due:fu,priority:'גבוהה',status:'לעשות',client:o.client||'',lead:o.lead||'',project:o.project||'',auto:true});toast('נוצרה תזכורת מעקב בעוד 3 ימי עבודה');
    if(o.lead){const l=get('leads',o.lead);if(l&&['ליד חדש','שיחת אפיון והדגמה'].includes(lst(l)))await put('leads',{...l,status:'הצעת מחיר מותאמת'});}}
  if(col==='quotes'&&o.status==='אושרה'&&prev?.status!=='אושרה'&&o.project){const p=get('projects',o.project);
    if(p&&await ask(`ההצעה אושרה. לעדכן את הפרויקט "${esc(p.name)}" למחיר ${money(quoteTotal(o))} ולשלב "${esc(SET.stages[3])}"?`,{ok:'כן, לעדכן'})){const prevP={...p};const np={...p,price:quoteTotal(o),approved:true,stage:stageIdx(p.stage)<3?SET.stages[3]:p.stage,quote:o.id};if(!np.scope)np.scope=(o.items||[]).map(i=>'• '+i.desc).join('\n');await put('projects',np);await onSaved('projects',np,prevP,false);}}
  if(col==='tasks'&&o.status==='הושלם'&&o.lead){const l=get('leads',o.lead);if(l&&isNewLead(l))await put('leads',{...l,status:'שיחת אפיון והדגמה'});}
  }catch(e){}
}

CHG.taskDone=async(d,el)=>{const x=get('tasks',d.id);if(!x)return;try{await put('tasks',{...x,status:el.checked?'הושלם':'לעשות',doneAt:el.checked?todayISO():''});if(el.checked){toast('המשימה הושלמה','good');await onSaved('tasks',get('tasks',d.id),x,false);}}catch(e){}};
ACT.weekly=()=>{const t=todayISO();const wk=addDays(t,7);const lines=[];
  lines.push(`סיכום שבועי – ${plainDate(t)}`,'');
  const due=all('projects').filter(p=>!isClosedStage(p.stage)&&p.dueDate&&p.dueDate<=wk);lines.push('למסור השבוע:',...(due.length?due.map(p=>`• ${p.name} – ${refName('clients',p.client)} (${plainDate(p.dueDate)})`):['• אין']),'');
  const tk=all('tasks').filter(x=>x.status!=='הושלם'&&x.due&&x.due<=wk).sort((a,b)=>a.due.localeCompare(b.due));lines.push(`משימות עד סוף השבוע (${tk.length}):`,...(tk.length?tk.slice(0,20).map(x=>`• ${x.title}${x.due<t?' (באיחור)':''}`):['• אין']),'');
  const un=all('projects').map(p=>({p,f:projFin(p)})).filter(x=>x.f.balance>0);lines.push('מי חייב לי כסף:',...(un.length?un.map(({p,f})=>`• ${refName('clients',p.client)} – ${p.name}: ${money(f.balance)}`):['• אף אחד']),'');
  const inst=all('installments').filter(i=>i.status!=='שולם'&&i.dueDate<=wk);if(inst.length)lines.push('תשלומים בפריסה לגבייה:',...inst.map(i=>`• ${refName('projects',i.project)}: ${money(i.amount)} (${plainDate(i.dueDate)})`),'');
  const subs=all('subscriptions').filter(s=>s.status==='פעיל'&&s.nextCharge<=wk);if(subs.length)lines.push('מנויים לחיוב:',...subs.map(s=>`• ${s.name} – ${refName('clients',s.client)}: ${money(s.monthly)}`),'');
  const nl=all('leads').filter(isOpenLead);lines.push(`פניות שמחכות (${nl.length}):`,...(nl.length?nl.map(l=>`• ${l.name}${l.nextAction?' – '+l.nextAction:''}`):['• אין']),'');
  const pq=all('quotes').filter(q=>q.status==='נשלחה');if(pq.length)lines.push('הצעות מחיר שממתינות:',...pq.map(q=>`• ${q.number||''} ${refName('clients',q.client)||refName('leads',q.lead)}: ${money(quoteTotal(q))}`),'');
  const w=finance({from:addDays(t,-7),to:t});lines.push(`בשבוע האחרון: התקבלו ${money(w.income)}, יצאו ${money(w.oneOff)} (בלי הוצאות קבועות).`);
  textModal('סיכום שבועי',lines.join('\n'),{note:`אפשר להעתיק ולשלוח לעצמך למייל העסקי (${SET.businessEmail}). שליחה אוטומטית במייל דורשת חיבור Gmail – ראה הגדרות ← חיבורים.`});};

ACT.doImport=async()=>{const lines=$('#impText').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!lines.length){toast('הדבק קודם את הרשימה');return;}

  toast(`יובאו ${n} פניות`,'good');$('#impText').value='';};

    await put('leads',{...get('leads',l.id),status:'עסקה נסגרה',convertedClient:c.id,convertedProject:p?.id||''});
    for(const q of all('quotes').filter(q=>q.lead===l.id&&!q.client))await put('quotes',{...q,client:c.id,project:q.project||p?.id||''});
    for(const x of all('tasks').filter(x=>x.lead===l.id&&!x.client))await put('tasks',{...x,client:c.id});

function notesBlock(link,notes){return `<div class="card"><div class="hd"><h3>סיכומים, קבצים והיסטוריית תקשורת</h3><span class="row"><button class="btn sm" data-act="callSum" data-link="${json(link)}">+ סיכום שיחה מהקלטה</button><button class="btn sm" data-act="add" data-col="notes" data-preset="${json(link)}">+ הוספה</button></span></div>
  ${notes.length?`<div class="list">${notes.map(n=>`<div class="li click" data-act="open" data-col="notes" data-id="${esc(n.id)}"><div class="t">${pill(n.kind)} ${n.lead&&!link.lead?'<span class="pill">מהפנייה</span> ':''}<span style="white-space:pre-wrap">${esc((n.text||'').slice(0,220))}${(n.text||'').length>220?'…':''}</span>${n.file?` <span class="pill info">📎 ${esc(n.file.name||'קובץ')}</span>`:''}${n.link?` <a href="${esc(n.link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">קישור</a>`:''}</div><div>${fmtDate(n.date)}</div></div>`).join('')}</div>`:'<p class="muted small" style="margin:0">אין עדיין סיכומים. אחרי כל שיחה כדאי לרשום כאן מה סוכם.</p>'}</div>`;}
function openNote(n,preset={}){const o=n||{kind:'סיכום שיחה',date:todayISO(),...preset};const isNew=!o.id;
  const m=modal(isNew?'הוספת סיכום / קובץ':'עריכת סיכום',`<div class="form">${fieldHTML(SCHEMA.notes.fields[0],o.kind)}${fieldHTML(SCHEMA.notes.fields[1],o.date)}${fieldHTML(SCHEMA.notes.fields[2],o.text||'')}${fieldHTML(SCHEMA.notes.fields[3],o.link||'')}
   <label class="f wide">צירוף קובץ (עד 20MB)${o.file?`<span class="small">קובץ נוכחי: <a href="${esc(o.file.url)}" target="_blank" rel="noopener">${esc(o.file.name)}</a></span>`:''}<input type="file" id="ntFile" ${assetsApi?'':'disabled'}>${assetsApi?'':'<span class="small muted">העלאת קבצים לא זמינה בתצוגה הזו. אפשר להדביק קישור.</span>'}</label></div>`,
   {foot:`<span>${!isNew?'<button class="btn danger" id="ntDel">מחיקה</button>':''}</span><span class="row"><button class="btn" data-close>ביטול</button><button class="btn pri" id="ntSave">שמירה</button></span>`});
  m.querySelector('#ntSave').onclick=async()=>{const b=m.querySelector('#ntSave');b.disabled=true;b.innerHTML='<span class="loading"></span> שומר…';
    const v={...o};for(const f of SCHEMA.notes.fields)v[f.key]=readField(f,m);
    const file=m.querySelector('#ntFile').files[0];
    try{if(file){if(file.size>20*1024*1024){toast('הקובץ גדול מ-20MB','bad');b.disabled=false;b.textContent='שמירה';return;}const up=await assetsApi.upload(file);v.file={id:up.id,url:up.url,name:file.name,size:file.size};}
      await put('notes',v);m.close();toast('נשמר','good');}catch(e){toast(e&&e.message?'העלאת הקובץ נכשלה: '+e.message:'השמירה נכשלה','bad');b.disabled=false;b.textContent='שמירה';}};
  m.querySelector('#ntDel')?.addEventListener('click',async()=>{if(await ask('למחוק את הרשומה?',{ok:'מחיקה',danger:true})){await del('notes',o.id);m.close();}});}
ACT.callSum=d=>{const link=JSON.parse(d.link);const m=modal('סיכום שיחה מהקלטה',`<p class="muted small" style="margin-top:0">הקלט את השיחה או את הסיכום שלך, תמלל אותו במערכת התמלול שלך (ביאלה / קולמוס), והדבק כאן את הטקסט. אפשר לבקש מ-AI לקצר אותו לסיכום ולפעולה הבאה.</p>
  <label class="f">התמלול<textarea id="csRaw" style="min-height:140px"></textarea></label><div class="row" style="margin:8px 0"><button class="btn" id="csAi" ${sampleApi?'':'disabled'}>✦ סכם עם AI</button>${sampleApi?'':'<span class="small muted">AI לא זמין בתצוגה הזו</span>'}</div>
  <label class="f">הסיכום שיישמר<textarea id="csSum" style="min-height:120px"></textarea></label><label class="f" style="margin-top:8px">הפעולה הבאה (תיווצר משימה)<input type="text" id="csNext"></label>`,{wide:true,foot:`<span></span><span class="row"><button class="btn" data-close>ביטול</button><button class="btn pri" id="csSave">שמירה</button></span>`});

      m.querySelector('#csSum').value=r.summary||'';m.querySelector('#csNext').value=r.next||'';}catch(e){toast(aiErr(e),'bad');}b.disabled=false;b.textContent='✦ סכם עם AI';};

      if(nx)await put('tasks',{title:nx,due:addWorkDays(todayISO(),1),priority:'בינונית',status:'לעשות',lead:link.lead||'',client:link.client||(link.project?get('projects',link.project)?.client:'')||'',project:link.project||'',auto:true});m.close();toast('הסיכום נשמר','good');}catch(e){}};};

  if(tb==='systems'){const sys=systemsOfClient(c.id),subs=all('subscriptions').filter(s=>s.client===c.id);body=`<div class="stack">${subs.filter(s=>num(s.includedHours)).map(s=>{const cur=s.usageMonth===todayISO().slice(0,7);const u=cur?num(s.usedHours):0,inc=subInc(s);return `<div class="card"><div class="row between"><b>שעות החודש – ${esc(s.name)}</b><span class="num">${u.toFixed(1)} / ${inc}</span></div><div class="bar" style="margin-top:6px"><i style="width:${Math.min(100,u/inc*100)}%;background:${u>inc?'var(--bad)':u>=inc*0.8?'var(--warn)':'var(--brass)'}"></i></div><p class="small muted" style="margin:6px 0 0">${cur?(u>=inc&&s.overageApprovedMonth!==todayISO().slice(0,7)?'החבילה נוצלה במלואה – ממתין להחלטת הלקוח':u>inc?`חריגה מאושרת: ${(u-inc).toFixed(1)} שעות × ${money(s.overage)} = <b>${money((u-inc)*num(s.overage))}</b> לחיוב בחודש הבא`:`נשארו ${(inc-u).toFixed(1)} שעות`):'עוד אין נתוני שימוש לחודש הזה (מתעדכן כל בוקר מביאלה)'}</p>${cur?overageBox(s,u,inc):''}</div>`;}).join('')}${listView('systems',{key:'cs-'+c.id,rows:sys,preset:{client:c.id,community:c.community||''},filters:[],cols:['name','product','active','netfree','uptime']})}<h3>מנויים</h3>${listView('subscriptions',{key:'csub-'+c.id,rows:subs,preset:{client:c.id},filters:[],cols:['name','monthly','nextCharge','status']})}</div>`;}

/* ---- sales: tiers, calculator, script, closing ---- */
function tierFor(h){const T=SET.tiers||[];if(!T.length)return null;return T.find(t=>h<=num(t.hours))||T[T.length-1];}
function calcDeal(h,tierName,monthly,useOffer){const T=SET.tiers||[];const t=T.find(x=>x.name===tierName)||tierFor(h);if(!t)return null;const m=num(t.monthly);
  const over=Math.max(0,h-num(t.hours));const overCost=over*num(t.overage);const setup=useOffer?0:num(t.setup);
  const saveHours=h*num(SET.manualHoursPerHour);const saveMoney=saveHours*num(SET.editorHourCost);
  const cost=h*num(SET.costPerHour);return{t,monthly:m,minOk:true,over,overCost,setup,listSetup:num(t.setup),saveHours,saveMoney,totalMonthly:m+overCost,cost,profit:m+overCost-cost};}

   <label class="f"><span>תחילת המנוי</span><input type="date" id="cd-d" value="${todayISO()}"></label><label class="f chk"><input type="checkbox" id="cd-split"> לפרוס את דמי ההקמה ל-3 תשלומים</label></div><p id="cd-err" class="small" style="color:var(--bad)" hidden></p>`,{wide:true,foot:`<span></span><span class="row"><button class="btn" data-close>ביטול</button><button class="btn gold" id="cd-go">סגירת העסקה</button></span>`});

  m.querySelector('#cd-go').onclick=async()=>{const g=id=>m.querySelector(id).value.trim();const org=g('#cd-org'),ed=g('#cd-ed'),hrs=g('#cd-h'),tier=g('#cd-t'),setup=g('#cd-s'),mon=g('#cd-m'),start=g('#cd-d')||todayISO();

      if(m.querySelector('#cd-split')?.checked&&num(setup)>0){const each=Math.round(num(setup)/3);for(let i=0;i<3;i++)await put('installments',{project:pr.id,dueDate:addMonths(start,i),amount:i===2?num(setup)-each*2:each,status:'ממתין',notes:'דמי הקמה'});}

function contractDoc(s){if(!s)return;const c=get('clients',s.client)||{};const t=SET.tiers.find(x=>s.name.includes(x.name))||{};const ed=s.editor||all('contacts').find(x=>x.client===c.id&&x.role==='עורך ראשי')?.name||'';

   `<div class="sig"><div>חתימת נותן השירות<br><br>${esc(SET.businessName||SET.ownerName||'')}</div><div>חתימת הלקוח וחותמת<br><br>${esc(c.name||'')}</div></div><p class="m">תאריך: ____________</p><p class="m" style="margin-top:30px">נוסח לדוגמה – מומלץ שעורך דין יעבור עליו לפני שימוש.</p>`;

function tierOfSub(s){const i=SET.tiers.findIndex(t=>num(t.hours)===num(s.includedHours));return i;}
function overageBox(s,u,inc){const mon=todayISO().slice(0,7),ap=s.overageApprovedMonth===mon;const i=tierOfSub(s),nx=i>=0?SET.tiers[i+1]:null;
  if(u<inc*0.8)return '';
  if(u<inc)return `<div class="note" style="margin-top:8px;border-inline-start:3px solid var(--warn);padding:6px 10px">⚠️ ניצל ${pct(u/inc)} – הלקוח רואה התראה במערכת. זה הרגע לרמוז על השדרוג: "כשתגיעו ל-100%, מי שמשדרג באותו יום מקבל ${num(SET.upgradeBonusHours)} שעות מתנה."</div>`;
  if(ap)return `<div class="note" style="margin-top:8px;padding:6px 10px">✅ הלקוח בחר להמשיך בתשלום של ${money(s.overage)} לכל שעה נוספת החודש. <a href="#" data-act="ovCancel" data-id="${s.id}">ביטול</a></div>`;
  if(s.limitHitMonth!==mon)setTimeout(()=>put('subscriptions',{...s,limitHitMonth:mon,limitHitAt:todayISO(),limitHitTs:new Date().toISOString()}),0);
  const hitDay=s.limitHitMonth===mon?s.limitHitAt:todayISO(),dl=offerDeadline(s),bonusLive=Date.now()<=dl.getTime(),B=num(SET.upgradeBonusHours);
  const head=`<div class="note" style="margin-top:8px;border-inline-start:3px solid var(--bad);padding:6px 10px">⛔ הלקוח הגיע ל-100%. ההעלאות עצורות עד שיבחר – לא מחייבים כלום בלי אישור.</div>`;
  const alt=`<p class="small muted" style="margin:6px 0 0">האפשרות השנייה (לא להציע ראשונה): להמשיך בחבילה הנוכחית ולשלם ${money(s.overage)} על כל שעה נוספת. <a href="#" data-act="ovApprove" data-id="${s.id}">הלקוח בחר בזה</a></p>`;
  if(!nx)return head+`<p class="small" style="margin:6px 0">זו החבילה הגבוהה ביותר – אפשר להציע חבילה מיוחדת בשיחה.</p>`+alt;
  const diff=num(nx.monthly)-num(s.monthly),addH=num(nx.hours)-num(s.includedHours),perH=diff/Math.max(1,addH),gift=B*num(s.overage);
  return head+`<div class="card" style="margin-top:8px;border:2px solid var(--brass)"><b>⬆️ ההצעה: לעבור עכשיו ל${esc(nx.name)}</b>
    <table class="t" style="margin-top:6px"><thead><tr><th></th><th>נשארים + משלמים לשעה</th><th>משדרגים ל${esc(nx.name)}</th></tr></thead><tbody>
    <tr class="static"><td>שעות בחודש</td><td class="num">${num(s.includedHours)}</td><td class="num"><b>${num(nx.hours)}</b></td></tr>
    <tr class="static"><td>כל שעה מעבר</td><td class="num">${money(s.overage)}</td><td class="num"><b>${money(perH)}</b> בממוצע</td></tr>
    ${bonusLive&&B?`<tr class="static"><td>מתנה בשדרוג היום</td><td class="num">—</td><td class="num"><b>${B} שעות חינם החודש</b> (שווי ${money(gift)})</td></tr>`:''}
    <tr class="static"><td>תוספת לחודש</td><td class="num">${money(s.overage)} × כל שעה</td><td class="num"><b>${money(diff)}</b> קבוע</td></tr></tbody></table>
    <p class="small" style="margin:6px 0">💬 מה לומר: "הגעתם לסוף החבילה – סימן שהמערכת עובדת אצלכם. ${bonusLive&&B?`אם אתם עוברים עכשיו ל${esc(nx.name)}, אתם מקבלים את כל ${num(nx.hours)} השעות שלה – ועוד ${B} שעות מתנה מעליהן כבר החודש – שווי ${money(gift)} – `:''}ובמקום ${money(s.overage)} לשעה, כל שעה יוצאת ${money(perH)}. ${Math.ceil(diff/Math.max(1,num(s.overage)))} שעות חריגה כבר עולות כמו כל השדרוג."</p>
    ${bonusLive&&B?`<p class="small" style="margin:0 0 6px;color:var(--bad)">⏰ המתנה בתוקף עד ${dlText(dl)}. אחר כך ההצעה נשארת – בלי המתנה.</p>`:`<p class="small muted" style="margin:0 0 6px">המתנה של ${B} השעות הייתה בתוקף ביום ההגעה ל-100% (${plainDate(hitDay)}) ופגה.</p>`}
    <div class="row"><button class="btn" data-act="ovMail" data-id="${s.id}" data-t="${i+1}">📧 מייל הצעה ללקוח</button><button class="btn pri" data-act="ovUpgrade" data-id="${s.id}" data-t="${i+1}" data-b="${bonusLive?B:0}">⬆️ הלקוח משדרג${bonusLive&&B?` + ${B} שעות מתנה`:''}</button></div></div>`+alt;}
ACT.ovApprove=async d=>{const s=get('subscriptions',d.id);await put('subscriptions',{...s,overageApprovedMonth:todayISO().slice(0,7),overageApprovedAt:todayISO()});toast('נרשם: החריגה אושרה לחודש הזה');render();};
ACT.ovCancel=async d=>{const s=get('subscriptions',d.id);await put('subscriptions',{...s,overageApprovedMonth:''});render();};
ACT.ovUpgrade=async d=>{const s=get('subscriptions',d.id),t=SET.tiers[num(d.t)];if(!t)return;
  if(!await ask(`לשדרג את ${refName('clients',s.client)} ל${t.name}? המנוי יעודכן ל-${money(t.monthly)} בחודש ו-${num(t.hours)} שעות${num(d.b)?`, ועוד ${num(d.b)} שעות מתנה לחודש הזה`:''}. (שינוי דרגה לא דורש דמי הקמה נוספים.)`))return;
  const bh=num(d.b);await put('subscriptions',{...s,name:`מנוי ${t.name}`,monthly:num(t.monthly),includedHours:num(t.hours),overage:num(t.overage),upgradedAt:todayISO(),overageApprovedMonth:'',bonusHours:bh,bonusMonth:bh?todayISO().slice(0,7):''});
  await put('notes',{client:s.client,kind:'הערה',text:`שודרג ל${t.name} (${money(t.monthly)} בחודש, ${num(t.hours)} שעות)${bh?` + ${bh} שעות מתנה לחודש הזה`:''} – ${plainDate(todayISO())}`,date:todayISO()});

function offerDeadline(s){const t=new Date(s.limitHitTs||Date.now());const d=new Date(t);if(t.getHours()>=18)d.setDate(d.getDate()+1);if(d.getDay()===5)d.setDate(d.getDate()+2);else if(d.getDay()===6)d.setDate(d.getDate()+1);d.setHours(23,59,0,0);return d;}
function dlText(d){const today=new Date();today.setHours(0,0,0,0);const x=new Date(d);x.setHours(0,0,0,0);const n=Math.round((x-today)/864e5);return (n===0?'הלילה בחצות':n===1?'מחר בלילה ('+['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'][d.getDay()]+')':'יום '+['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'][d.getDay()]+' בלילה')+' – '+plainDate(d.toISOString().slice(0,10));}

<div style="padding:26px 28px;font-size:16px;line-height:1.85;color:#1b2440">

פירוש הדבר פשוט – דברי התורה של החצר יוצאים לאור בקצב מבורך, והעורך שלכם כבר נשען על המערכת מדי שבוע.</p>

<div style="background:#fbf5e2;border:1px solid #d9bf6a;border-radius:12px;padding:20px 22px;margin:22px 0">
<div style="${C};font-size:18px;font-weight:bold;color:#1b2a55;margin-bottom:10px">ההצעה המיוחדת עבורכם: מעבר ל${esc(tn)}</div>
<div style="margin:6px 0">✦ <b>${num(nx.hours)} שעות הקלטה בכל חודש</b> – ${more}</div>

${live?`<div style="margin:6px 0">✦ <b>ולמהירי החלטה: ${B} שעות מתנה</b> מעל החבילה, כבר החודש – ${num(nx.hours)+B} שעות בסך הכול (שווי ${money(gift)})</div>`:''}

function milestonesBlock(p){const ms=p.milestones||[];return `<div class="card">${ms.length?ms.map((m,i)=>`<div class="li"><label class="row" style="gap:8px;flex-wrap:nowrap"><input type="checkbox" data-chg="msDone" data-id="${esc(p.id)}" data-i="${i}" ${m.done?'checked':''}><span>${esc(m.title)}</span></label><span class="row">${fmtDate(m.date)}<button class="btn sm ghost" data-act="msDel" data-id="${esc(p.id)}" data-i="${i}" aria-label="הסרה">✕</button></span></div>`).join(''):'<p class="muted small" style="margin:0 0 8px">אין אבני דרך.</p>'}

ACT.instPaid=async d=>{const i=get('installments',d.id);const p=get('projects',i.project);try{const pay=await put('payments',{project:i.project,client:p?.client||'',date:todayISO(),amount:i.amount,method:'מזומן',notes:'תשלום בפריסה',installment:i.id});await put('installments',{...i,status:'שולם',payment:pay.id});toast('התשלום נרשם','good');if(SET.receiptsOn)offerReceipt(pay);}catch(e){}};
ACT.splitPay=d=>{const p=get('projects',d.id);const f=projFin(p);const m=modal('חלוקה לתשלומים',`<div class="form"><label class="f">סכום לחלוקה<input type="number" id="spAmt" value="${f.balance||f.agreed}"></label><label class="f">מספר תשלומים<input type="number" id="spN" value="3" min="1" max="36"></label><label class="f">תשלום ראשון בתאריך<input type="date" id="spD" value="${todayISO()}"></label><label class="f">כל כמה זמן<select id="spEvery"><option value="1">כל חודש</option><option value="0.5">כל שבועיים</option><option value="2">כל חודשיים</option></select></label></div>`,{foot:`<span></span><span class="row"><button class="btn" data-close>ביטול</button><button class="btn pri" id="spGo">יצירה</button></span>`});
  m.querySelector('#spGo').onclick=async()=>{const amt=num(m.querySelector('#spAmt').value),n=Math.max(1,Math.min(36,num(m.querySelector('#spN').value)|0)),ev=m.querySelector('#spEvery').value;let dd=m.querySelector('#spD').value||todayISO();const each=Math.round(amt/n);

ACT.remind=d=>{const p=get('projects',d.id);const c=get('clients',p?.client);const ct=all('contacts').find(x=>x.client===c?.id&&x.decider)||all('contacts').find(x=>x.client===c?.id);
  const fill=s=>s.replaceAll('{שם}',ct?.name||c?.name||'').replaceAll('{סכום}',money(d.amount)).replaceAll('{פרויקט}',p?.name||'').replaceAll('{תאריך}',hebDate(addWorkDays(todayISO(),5),true));
  const m=modal('נוסח תזכורת תשלום',`<label class="f">נוסח<select id="rmSel">${SET.reminders.map((r,i)=>`<option value="${i}">${esc(r.name)}</option>`).join('')}</select></label><textarea id="rmText" style="margin-top:10px;min-height:150px">${esc(fill(SET.reminders[0]?.text||''))}</textarea><p class="muted small">שלח בצ׳אט או במייל ל${esc(ct?.email||c?.email||'לקוח')}. את הנוסחים משנים בהגדרות.</p>`,{foot:`<span></span><span class="row"><button class="btn" data-close>סגירה</button><button class="btn pri" id="rmCopy">העתקה</button></span>`});
  m.querySelector('#rmSel').onchange=e=>{m.querySelector('#rmText').value=fill(SET.reminders[+e.target.value].text);};m.querySelector('#rmCopy').onclick=()=>copyText(m.querySelector('#rmText').value);};

PAGES.tasks=()=>{const tb=R.tab||'list';const head=tabs([['list','רשימה'],['board','לוח לפי סטטוס'],['cal','לוח שנה']],tb,'tasks');
  if(tb==='board'){const ts=all('tasks');return head+`<div class="toolbar"><button class="btn pri" data-act="add" data-col="tasks">+ הוספת משימה</button><span class="muted small">גרור כרטיס לעמודה אחרת כדי לשנות סטטוס</span></div><div class="kan">${['לעשות','בתהליך','הושלם'].map(s=>{const l=ts.filter(x=>(x.status||'לעשות')===s).sort((a,b)=>(a.due||'9').localeCompare(b.due||'9'));return `<div class="kcol" data-drop="tasks" data-val="${s}"><h3>${s} <span class="muted">${l.length}</span></h3>${l.slice(0,60).map(x=>`<div class="kcard" draggable="true" data-drag="${esc(x.id)}" data-act="open" data-col="tasks" data-id="${esc(x.id)}"><div>${esc(x.title)}${demoPill(x)}</div><div class="row between small muted"><span>${x.project?esc(refName('projects',x.project)):x.client?esc(refName('clients',x.client)):''}</span><span>${x.due?esc(hebDate(x.due)):''} ${x.priority==='גבוהה'?pill('גבוהה'):''}</span></div></div>`).join('')}</div>`;}).join('')}</div>`;}
  if(tb==='cal')return head+calendarView();
  return head+listView('tasks',{empty:['אין משימות','משימות נוצרות גם אוטומטית: מפניות חדשות, מהצעות מחיר שנשלחו וממסירת פרויקט.']});};
function calendarView(){const st=UI.cal??={m:todayISO().slice(0,7)};const[y,mo]=st.m.split('-').map(Number);const first=new Date(y,mo-1,1);const start=addDays(iso(first),-first.getDay());const t=todayISO();
  const ev={};const addEv=(d,html)=>{(ev[d]??=[]).push(html);};
  for(const x of all('tasks'))if(x.due&&x.status!=='הושלם')addEv(x.due,`<span class="ev" data-act="open" data-col="tasks" data-id="${esc(x.id)}" title="${esc(x.title)}">${esc(x.title)}</span>`);
  for(const p of all('projects'))if(p.dueDate&&!isClosedStage(p.stage))addEv(p.dueDate,`<span class="ev due" data-act="go" data-page="project" data-id="${esc(p.id)}" title="מסירה: ${esc(p.name)}">מסירה: ${esc(p.name)}</span>`);
  for(const i of all('installments'))if(i.status!=='שולם')addEv(i.dueDate,`<span class="ev" data-act="go" data-page="project" data-id="${esc(i.project)}" data-tab="pay">תשלום ${money(i.amount)}</span>`);
  let cells='';for(let i=0;i<42;i++){const d=addDays(start,i);const di=dayInfo(d);const out=d.slice(0,7)!==st.m;const h=hparts(d);
    cells+=`<div class="c ${out?'out':''} ${d===t?'today':''} ${di.yt?'hol':di.shabbat?'sh':''}"><div class="dn"><b>${+d.slice(8)}</b><span>${h?gem(h.day):''}</span></div>${di.yt||di.chol||di.label?`<span class="hl">${esc(di.yt||di.chol||di.label)}</span>`:di.shabbat?'<span class="hl">שבת</span>':''}${SET.showBein&&di.bein&&!di.yt&&!di.chol&&(h?.day===1||d.slice(8)==='01')?'<span class="hl" style="font-weight:400">בין הזמנים</span>':''}${(ev[d]||[]).slice(0,3).join('')}${(ev[d]||[]).length>3?`<span class="muted">+${ev[d].length-3}</span>`:''}</div>`;}
  const mid=addDays(iso(first),14);const hm=hparts(mid);
  return `<div class="toolbar"><button class="btn" data-act="calNav" data-d="-1">‹ הקודם</button><h2 style="min-width:0">${first.toLocaleDateString('he-IL',{month:'long',year:'numeric'})} <span class="muted small" style="font-family:var(--f-body)">${hm?esc(HMONTH[hm.month]||'')+' '+gem(hm.year):''}</span></h2><button class="btn" data-act="calNav" data-d="1">הבא ›</button><button class="btn" data-act="calNav" data-d="0">היום</button><button class="btn pri" data-act="add" data-col="tasks">+ משימה</button></div>
  <div class="tbl-wrap"><div class="cal" style="min-width:560px">${['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'].map(x=>`<div class="h">${x}</div>`).join('')}${cells}</div></div>
  <p class="muted small">ימי חג וחול המועד לא נספרים כימי עבודה בחישוב מועדים (אפשר לשנות בהגדרות). התאריכים העבריים מחושבים אוטומטית.</p>`;}
ACT.calNav=d=>{const st=UI.cal;if(d.d==='0')st.m=todayISO().slice(0,7);else st.m=addMonths(st.m+'-01',+d.d).slice(0,7);render();};
/* drag & drop for boards */
document.addEventListener('dragstart',e=>{const c=e.target.closest?.('[data-drag]');if(c){e.dataTransfer.setData('text/plain',c.dataset.drag);e.dataTransfer.effectAllowed='move';}});
document.addEventListener('dragover',e=>{const col=e.target.closest?.('[data-drop]');if(col){e.preventDefault();$$('.kcol.over').forEach(x=>x!==col&&x.classList.remove('over'));col.classList.add('over');}});
document.addEventListener('dragleave',e=>{const col=e.target.closest?.('[data-drop]');if(col&&!col.contains(e.relatedTarget))col.classList.remove('over');});
document.addEventListener('drop',async e=>{const col=e.target.closest?.('[data-drop]');if(!col)return;e.preventDefault();col.classList.remove('over');const id=e.dataTransfer.getData('text/plain');const kind=col.dataset.drop;const o=get(kind,id);if(!o)return;
  if(kind==='tasks'&&o.status!==col.dataset.val){const prev={...o};const n=await put('tasks',{...o,status:col.dataset.val});await onSaved('tasks',n,prev,false);}
  if(kind==='projects'&&o.stage!==col.dataset.val)ACT.setStage({id,stage:col.dataset.val});
  if(kind==='leads')ACT.leadStage({id,stage:col.dataset.val});

PAGES.quotes=()=>{const tb=R.tab||'quotes';const head=tabs([['quotes','הצעות מחיר'],['adds','תוספות ושינויי עבודה'],['comp','ספריית רכיבים']],tb,'quotes');

  if(tb==='comp')return head+`<p class="muted small" style="margin-top:0">רכיבים שחוזרים בהרבה מערכות. כשבונים הצעת מחיר, בוחרים רכיבים והמחיר מוצע לפי הבסיס ולפי מה שגבית בעבר.</p>`+listView('components',{empty:['אין רכיבים','הוסף רכיבים כמו: כניסה עם קוד במייל, תאריך עברי, גיבוי, התקנה כאפליקציה.']});

function nextQuoteNo(){const y=new Date().getFullYear();const n=all('quotes').map(q=>+(String(q.number||'').split('-')[1]||0)).reduce((a,b)=>Math.max(a,b),0)+1;return `${y}-${String(n).padStart(3,'0')}`;}
function compHistory(cid){const its=all('quotes').filter(q=>q.status==='אושרה').flatMap(q=>(q.items||[]).filter(i=>i.comp===cid));return its.length?{n:its.length,avg:sum(its,'price')/its.length}:null;}
function openQuote(q,preset={}){const o=q?{...q,items:[...(q.items||[])]}:{number:nextQuoteNo(),date:todayISO(),validUntil:addDays(todayISO(),30),status:'טיוטה',items:[],...preset};const isNew=!o.id;if(!o.items.length)o.items.push({desc:'',qty:1,price:''});
  const comps=all('components');const sel=(id,col,v)=>`<select id="${id}"><option value="">—</option>${all(col).map(r=>`<option value="${esc(r.id)}" ${r.id===v?'selected':''}>${esc(nameOf(col,r))}</option>`).join('')}</select>`;
  const m=modal(isNew?'הצעת מחיר חדשה':'הצעת מחיר '+(o.number||''),`${o.demo?'<div class="banner demo" style="margin-bottom:10px">זו הצעת הדגמה.</div>':''}<div class="form"><label class="f">מספר<input type="text" id="qNo" value="${esc(o.number)}"></label><label class="f">תאריך<input type="date" id="qDate" value="${esc(o.date)}"></label><label class="f">בתוקף עד<input type="date" id="qValid" value="${esc(o.validUntil||'')}"></label>
   <label class="f">סטטוס<select id="qStatus">${['טיוטה','נשלחה','אושרה','נדחתה','פג תוקף'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></label><label class="f">לקוח${sel('qClient','clients',o.client)}</label><label class="f">או פנייה${sel('qLead','leads',o.lead)}</label><label class="f">פרויקט${sel('qProj','projects',o.project)}</label></div>
   <h3 style="margin:16px 0 6px">פריטים</h3><div class="tbl-wrap"><table class="t items-tbl" style="min-width:560px"><thead><tr><th style="cursor:default">רכיב מהספרייה</th><th style="cursor:default">תיאור</th><th style="cursor:default;width:70px">כמות</th><th style="cursor:default;width:110px">מחיר ליחידה</th><th style="cursor:default;width:90px">סה״כ</th><th style="cursor:default;width:36px"></th></tr></thead><tbody id="qItems"></tbody></table></div>
   <div class="row between" style="margin-top:8px"><button class="btn sm" id="qAdd" type="button">+ פריט</button><b class="num" id="qTot"></b></div>
   <h3 style="margin:16px 0 6px">מנוי חודשי <span class="muted small" style="font-weight:400">· מוצג בנפרד מהתשלום החד־פעמי</span></h3><div class="form"><label class="f">חבילה<input type="text" id="qTier" value="${esc(o.tier||'')}"></label><label class="f">מנוי חודשי (₪)<input type="number" id="qMon" value="${esc(o.monthly??'')}"></label><label class="f">שעות הקלטה כלולות בחודש<input type="number" id="qInc" value="${esc(o.includedHours??'')}"></label><label class="f">מחיר לשעה נוספת (₪)<input type="number" id="qOver" value="${esc(o.overage??'')}"></label></div>
   <label class="f" style="margin-top:12px">הערות ותנאים<textarea id="qNotes">${esc(o.notes||'')}</textarea></label><p class="muted small">סימון "נשלחה" יוצר תזכורת מעקב. סימון "אושרה" מציע לעדכן את מחיר הפרויקט.</p>`,

  const draw=()=>{m.querySelector('#qItems').innerHTML=o.items.map((it,i)=>{const h=it.comp?compHistory(it.comp):null;return `<tr class="static"><td><select data-i="${i}" data-k="comp"><option value="">—</option>${comps.map(c=>`<option value="${esc(c.id)}" ${c.id===it.comp?'selected':''}>${esc(c.name)}</option>`).join('')}</select>${h?`<div class="small muted">בעבר: ${money(h.avg)} (${h.n})</div>`:''}</td><td><input type="text" data-i="${i}" data-k="desc" value="${esc(it.desc)}"></td><td><input type="number" data-i="${i}" data-k="qty" value="${esc(it.qty??1)}"></td><td><input type="number" data-i="${i}" data-k="price" value="${esc(it.price)}"></td><td class="num">${money(num(it.qty||1)*num(it.price))}</td><td><button class="btn sm ghost" type="button" data-rm="${i}" aria-label="הסרה">✕</button></td></tr>`;}).join('');

  m.querySelector('#qAdd').onclick=()=>{o.items.push({desc:'',qty:1,price:''});draw();};

  m.querySelector('#qSave').onclick=async()=>{const v=collect();if(!v.client&&!v.lead){toast('בחר לקוח או פנייה','bad');return;}const prev=isNew?null:{...get('quotes',o.id)};try{const s=await put('quotes',v);m.close();toast('ההצעה נשמרה','good');await onSaved('quotes',s,prev,isNew);}catch(e){}};
