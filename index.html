/* =====================================================================
   מרכז השליטה: חיבור ה-CRM לאפליקציה (ביאלה / tamlul-plus) ולאתר דברי קודש
   + שמירת נתוני ה-CRM בענן (Supabase) – כדי שה-CRM יעבוד בלי Claude
   ===================================================================== */
const TP={url:'https://afmxylpcwqydjgiewewc.supabase.co',key:'sb_publishable_4S8OmERqXFNnc6zI1twl8A_zJbIrxl9',app:'https://mutzlach-il.github.io/tamlul-plus/'};
TP.api=TP.url+'/functions/v1/api';
const APP={sb:null,me:null,ready:false,err:'',orgs:null,usage:null,status:null,reqs:null,users:{},site:null,cloud:'off',loading:{}};
const inClaude=()=>!!(window.claude&&window.claude.use);
function loadSbLib(){if(window.supabase?.createClient)return Promise.resolve();return new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js';s.onload=res;s.onerror=()=>rej(new Error('לא הצלחתי לטעון את ספריית החיבור – בדוק אינטרנט / נטפרי'));document.head.appendChild(s);});}
async function appInit(){if(APP.sb||inClaude())return APP.sb;try{await loadSbLib();APP.sb=window.supabase.createClient(TP.url,TP.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'crm-tplus-auth'}});
  const {data:{session}}=await APP.sb.auth.getSession();if(session)await appLoadMe();}catch(e){APP.err=e.message;}APP.ready=true;scheduleRender();return APP.sb;}
async function appLoadMe(){const {data:{user}}=await APP.sb.auth.getUser();if(!user){APP.me=null;return null;}
  const {data}=await APP.sb.from('profiles').select('id,display_name,email,is_super,cur_org,role').eq('id',user.id).maybeSingle();APP.me=data||{id:user.id,email:user.email};return APP.me;}
const appOk=()=>!!(APP.sb&&APP.me&&APP.me.is_super);
async function appApi(action,data={}){const {data:{session}}=await APP.sb.auth.getSession();const r=await fetch(TP.api,{method:'POST',headers:Object.assign({'Content-Type':'application/json',apikey:TP.key},session?{Authorization:'Bearer '+session.access_token}:{}),body:JSON.stringify({action,...data})});
  const t=await r.text();let j;try{j=JSON.parse(t);}catch(e){j={error:t.slice(0,200)};}if(!r.ok||j?.error)throw new Error(typeof j.error==='string'?j.error:(j.error?.message||'שגיאה '+r.status));return j;}
async function rpc(fn,args){const {data,error}=await APP.sb.rpc(fn,args||{});if(error)throw new Error(error.message);return data;}
/* פעולה בתוך חסידות מסוימת – ואז חזרה לחסידות שהייתה */
async function withOrg(org,fn){const orig=(await appLoadMe())?.cur_org;if(orig!==org)await rpc('switch_org',{p_org:org});try{return await fn();}finally{if(orig&&orig!==org){try{await rpc('switch_org',{p_org:orig});}catch(e){}}}}
const orgUrl=id=>id==='biala'?TP.app:TP.app+'?org='+encodeURIComponent(id);
const fmtH=s=>{s=num(s);return s>=3600?(s/3600).toFixed(1)+' שעות':Math.round(s/60)+' דק׳';};

/* ---------- כניסה (פעם אחת – אחר כך נשאר מחובר) ---------- */
ACT.appSendCode=async()=>{const em=$('#apEmail').value.trim().toLowerCase();if(!em.includes('@')){toast('כתוב מייל','bad');return;}
  try{await appApi('send-code',{email:em,purpose:'login'});UI.apEmail=em;UI.apStep='code';toast('נשלח קוד בן 4 ספרות למייל','good');render();}catch(e){toast(e.message,'bad');}};
ACT.appVerify=async()=>{const code=$('#apCode').value.trim();if(code.length!==4){toast('4 ספרות','bad');return;}
  try{const r=await appApi('verify-code',{email:UI.apEmail,code,purpose:'login'});const {error}=await APP.sb.auth.verifyOtp({token_hash:r.token_hash,type:'magiclink'});if(error)throw error;
    await appLoadMe();UI.apStep='';if(!APP.me?.is_super){toast('המשתמש הזה אינו מנהל-העל','bad');}else{toast('מחובר ✓ – מעכשיו לא צריך קוד במחשב הזה','good');appAfterLogin();}render();}catch(e){toast(e.message||'הקוד לא נכון','bad');}};
ACT.appPass=async()=>{const em=$('#apEmail').value.trim().toLowerCase(),p=$('#apPass').value;try{const {error}=await APP.sb.auth.signInWithPassword({email:em,password:p});if(error)throw error;await appLoadMe();toast('מחובר ✓','good');appAfterLogin();render();}catch(e){toast('המייל או הסיסמה לא נכונים','bad');}};
ACT.appLogout=async()=>{if(!await ask('להתנתק מהאפליקציה במחשב הזה?',{ok:'התנתקות'}))return;await APP.sb.auth.signOut();APP.me=null;APP.orgs=null;render();};
function appLoginCard(){const st=UI.apStep;return `<div class="card stack" style="max-width:520px"><h3 style="margin:0">כניסת מנהל לאפליקציה – פעם אחת</h3>
  <p class="muted small" style="margin:0">נכנסים פעם אחת עם קוד למייל. אחר כך ה-CRM נשאר מחובר במחשב הזה, ולא צריך קוד בכל כניסה.</p>
  ${st==='code'?`<label class="f">הקוד שהגיע אל ${esc(UI.apEmail)}<input type="text" id="apCode" inputmode="numeric" maxlength="4" dir="ltr" style="font-size:22px;letter-spacing:.4em;text-align:center"></label><div class="row"><button class="btn pri" data-act="appVerify">כניסה</button><button class="btn ghost" data-act="appBack">שליחה מחדש</button></div>`
  :`<label class="f">המייל שלך באפליקציה<input type="email" id="apEmail" dir="ltr" value="${esc(UI.apEmail||SET.personalEmail||'')}"></label><div class="row"><button class="btn pri" data-act="appSendCode">שליחת קוד למייל</button></div>
   <details><summary class="small muted">או כניסה עם סיסמה</summary><label class="f">סיסמה<input type="password" id="apPass" dir="ltr"></label><button class="btn" data-act="appPass">כניסה עם סיסמה</button></details>`}</div>`;}
ACT.appBack=()=>{UI.apStep='';render();};

/* ---------- טעינת נתונים ---------- */
async function appLoad(what,force){if(!appOk())return;if(APP.loading[what])return;if(!force&&APP[what]&&what!=='users')return;APP.loading[what]=true;
  try{if(what==='orgs'){APP.orgs=await rpc('super_orgs');syncOrgsToCrm();}
    if(what==='usage'){APP.usage=await appApi('admin-usage').catch(()=>null);APP.status=await appApi('admin-status').catch(()=>null);}
    if(what==='reqs'){const {data,error}=await APP.sb.from('access_requests').select('*').order('created_at',{ascending:false}).limit(200);if(error)throw error;APP.reqs=data||[];reqsToLeads();}
    if(what==='msgs'){const {data,error}=await APP.sb.from('messages').select('*').order('created_at',{ascending:true}).limit(500);if(error)throw error;APP.msgs=data||[];const prev=APP.unread||0;APP.unread=APP.msgs.filter(m=>!m.read_at&&m.from_user!==APP.me.id).length;if(APP.unread>prev&&prev!==undefined&&APP._msgInit)toast('✉️ הודעה חדשה מהאפליקציה','good');APP._msgInit=true;const ids=[...new Set(APP.msgs.flatMap(m=>[m.from_user,m.to_user]).filter(x=>x&&x!==APP.me.id))];if(ids.length){const {data:pp}=await APP.sb.from('profiles').select('id,display_name,email').in('id',ids);APP.people=Object.fromEntries((pp||[]).map(x=>[x.id,x.display_name||x.email]));}}
    if(what==='logins'){const {data,error}=await APP.sb.from('login_log').select('*').order('created_at',{ascending:false}).limit(200);if(error)throw error;APP.logins=data||[];}
    if(what==='site'&&SET.siteCode){const r=await fetch(TP.url+'/rest/v1/rpc/site_stats',{method:'POST',headers:{'Content-Type':'application/json',apikey:TP.key},body:JSON.stringify({k:SET.siteCode})});if(!r.ok)throw new Error('קוד האתר לא נכון');APP.site=await r.json();}
  }catch(e){toast(`${({orgs:'החסידויות',usage:'מצב המערכת',reqs:'בקשות ההצטרפות',site:'נתוני האתר',msgs:'ההודעות',logins:'יומן הכניסות'})[what]||what}: ${e.message}`,'bad');}
  finally{APP.loading[what]=false;scheduleRender();}}
async function appLoadUsers(org){APP.users[org]={loading:true};scheduleRender();
  try{const r=await withOrg(org,async()=>{const [{data:profs,error},{data:stats}]=await Promise.all([APP.sb.from('profiles').select('*').order('created_at'),APP.sb.rpc('admin_user_stats')]);if(error)throw error;return {profs:profs||[],stats:Object.fromEntries((stats||[]).map(s=>[s.user_id,s]))};});
    APP.users[org]=r;}catch(e){APP.users[org]={err:e.message};}scheduleRender();}
function appAfterLogin(){['orgs','usage','reqs','site','msgs'].forEach(w=>appLoad(w,true));}

/* ---------- חיבור לרשומות ה-CRM: חסידות ↔ מערכת ↔ לקוח, ושימוש החודש למנוי ---------- */
function orgOfSystem(s){const u=String(s?.url||'');if(!u.includes('tamlul-plus'))return null;const m=u.match(/[?&]org=([^&#]+)/);return m?decodeURIComponent(m[1]):'biala';}
const sysOfOrg=id=>all('systems').find(s=>orgOfSystem(s)===id);
async function syncOrgsToCrm(){const mon=todayISO().slice(0,7);
  for(const o of APP.orgs||[]){const sys=sysOfOrg(o.id);if(!sys?.client)continue;
    const hrs=Math.round(num(o.seconds_month)/360)/10;
    for(const s of all('subscriptions').filter(x=>x.client===sys.client&&x.status==='פעיל'&&num(x.includedHours)>0)){
      if(s.usageMonth===mon&&num(s.usedHours)===hrs)continue;await put('subscriptions',{...s,usedHours:hrs,usageMonth:mon,usageSyncedAt:new Date().toISOString()});}
    if(sys.active!==(o.active?'פעיל':'מושבת'))await put('systems',{...sys,active:o.active?'פעיל':'מושבת'});}}
ACT.orgToCrm=async d=>{const o=(APP.orgs||[]).find(x=>x.id===d.id);if(!o)return;
  const com=await put('communities',{name:o.name,url:orgUrl(o.id),status:'משתמשים'});
  const cl=await put('clients',{name:'חסידות '+o.name,kind:'חסידות / מוסד',community:com.id,channel:'חסידויות',status:'פעיל'});
  await put('systems',{name:'ביאלה – '+o.name,client:cl.id,community:com.id,url:orgUrl(o.id),active:o.active?'פעיל':'מושבת',uptime:'לא נבדק',netfree:'לא נשלח'});
  toast('נוסף ל-CRM: לקוח, חסידות ומערכת','good');};
async function reqsToLeads(){const have=new Set(all('leads').map(l=>String(l.email||'').toLowerCase()));const mine=[SET.personalEmail,SET.businessEmail].map(x=>String(x||'').toLowerCase());let n=0;
  const seenReq=new Set(all('leads').map(l=>l.appRequest).filter(Boolean).map(String));
  for(const r of (APP.reqs||[]).filter(r=>r.status==='new')){const em=String(r.email||'').toLowerCase();if(!em||seenReq.has(String(r.id))||have.has(em)||mine.includes(em))continue;have.add(em);
    const note=String(r.note||'');const g=k=>{const m=note.match(new RegExp(k+'\\s*:\\s*([^|]+)'));return m?clean1(m[1]):'';};
    const lead=await put('leads',{name:r.name||g('שם')||em,email:/@keter\.site$/.test(em)?'':em,phone:g('טלפון').replace(/^\+972/,'0'),org:g('חצר / מוסד')||g('חסידות / מוסד'),date:String(r.created_at||'').slice(0,10)||todayISO(),channel:'אתר',status:'ליד חדש',need:note.replace(/^ליד מהאתר · /,'').slice(0,400),nextAction:'לחזור אליו ולתאם שיחת אפיון והדגמה',nextDate:todayISO(),notes:'נקלט אוטומטית מבקשות ההצטרפות באפליקציה.',appRequest:r.id});
    await put('tasks',{title:`לחזור לליד מהאתר: ${lead.name}${lead.org?` (${lead.org})`:''}`,lead:lead.id,due:todayISO(),priority:'גבוהה',status:'לעשות'});n++;}
  if(n)toast(`📥 ${n} לידים חדשים נקלטו מהאתר`,'good');}

ACT.uDisable=async d=>{const org=UI.appOrg,u=(APP.users[org]?.profs||[]).find(x=>x.id===d.id);if(!u)return;const to=!u.disabled;

ACT.uRemove=async d=>{const org=UI.appOrg,u=(APP.users[org]?.profs||[]).find(x=>x.id===d.id);if(!u)return;

async function appInvite(org,name,email,role){email=email.trim().toLowerCase();return withOrg(org,async()=>{const id=await rpc('org_add_existing',{p_email:email,p_role:role||'user'});if(id)return {existing:true};
  await APP.sb.from('pending_invites').upsert({email,created_at:new Date().toISOString()});await appApi('admin-invite',{name:name||email.split('@')[0],email,role:role||'user',sendInvite:true});return {invited:true};});}
ACT.uAdd=()=>{const org=UI.appOrg;const o=(APP.orgs||[]).find(x=>x.id===org);const m=modal(`משתמש חדש – ${o?.name||org}`,`<div class="form"><label class="f">שם<input type="text" id="uaName"></label><label class="f">מייל<input type="email" id="uaEmail" dir="ltr"></label>
   <label class="f">תפקיד<select id="uaRole"><option value="user">משתמש</option><option value="editor">עורך</option><option value="admin">מנהל החסידות</option></select></label></div><p class="muted small">יישלח אליו מייל הזמנה עם הקישור של החסידות. מי שכבר רשום באפליקציה – פשוט מצורף לחסידות.</p>`,{foot:`<span></span><span class="row"><button class="btn" data-close>ביטול</button><button class="btn gold" id="uaGo">הוספה</button></span>`});

ACT.reqOk=async d=>{const r=(APP.reqs||[]).find(x=>String(x.id)===d.id);if(!r)return;const orgs=APP.orgs||[];

PAGES.app=()=>{
  if(inClaude())return `<div class="card stack" style="max-width:720px"><h3 style="margin:0">🏛️ מרכז השליטה עובד בעותק שבמחשב</h3><p style="margin:0">Claude חוסם לדפים שבתוכו חיבור לשרתים חיצוניים, ולכן הניהול של האפליקציה והאתר פועל ב-<b>CRM-במחשב.html</b> (פותחים אותו בכרום). שם: כל החסידויות, הוספה והסרה של משתמשים, בקשות הצטרפות, שימוש החודש, נתוני האתר – ושמירת כל ה-CRM בענן.</p></div>`;

function tile(label,val,sub,cls){return `<div class="card"><div class="muted small">${label}</div><b style="font-size:24px;font-variant-numeric:tabular-nums" class="${cls||''}">${val}</b>${sub?`<div class="muted small">${sub}</div>`:''}</div>`;}
function appOverview(){const o=APP.orgs||[],u=APP.usage||{},s=APP.status||{},site=APP.site;const tot=o.reduce((a,x)=>({m:a.m+num(x.members),r:a.r+num(x.recordings),t:a.t+num(x.seconds_today),mo:a.mo+num(x.seconds_month)}),{m:0,r:0,t:0,mo:0});
  const newReq=(APP.reqs||[]).filter(r=>r.status==='new').length;
  const b=(l,used,lim,f)=>{const p=lim?Math.min(100,Math.round(used/lim*100)):0;return `<div style="margin:8px 0"><div class="row between small"><span>${l}</span><span class="num">${f(used)} מתוך ${f(lim)}</span></div><div class="bar"><i style="width:${Math.max(2,p)}%;background:${p>85?'var(--bad)':p>60?'var(--warn)':'var(--good)'}"></i></div></div>`;};
  return `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px">${tile('חסידויות',o.length,o.filter(x=>!x.active).length?o.filter(x=>!x.active).length+' מושבתות':'כולן פעילות')}${tile('משתמשים',tot.m)}${tile('הקלטות',tot.r)}${tile('תמלול היום',fmtH(tot.t))}${tile('תמלול החודש',fmtH(tot.mo))}${tile('בקשות הצטרפות חדשות',newReq,'',newReq?'warn':'')}${site?tile('כניסות לאתר היום',num(site.today),num(site.week)+' השבוע'):''}</div>
   <div class="grid2" style="margin-top:12px"><div class="card"><h3 style="margin-top:0">מצב המשאבים</h3>${APP.usage?b('אחסון קבצי שמע',num(u.storage),1024**3,v=>v>=1024**3?(v/1024**3).toFixed(2)+' GB':Math.round(v/1048576)+' MB')+b('תמלול היום (Groq)',num(u.transcribeToday),8*3600,fmtH)+b('מיילים החודש (EmailJS)',num(u.emailsMonth),200,v=>Math.round(v)):'<p class="muted small">טוען…</p>'}</div>
   <div class="card"><h3 style="margin-top:0">מצב השרת</h3>${APP.status?`<dl class="dl"><dt>Groq</dt><dd>${s.groqOk?'✅ עובד':'❌ לא עונה'} <span class="muted small">${num(s.groqMs)}ms</span></dd><dt>Gemini</dt><dd>${s.gemOk?'✅ עובד':'❌ לא עונה'} <span class="muted small">${num(s.gemMs)}ms</span></dd><dt>דו"ח שבועי אחרון</dt><dd>${s.lastWeekly?plainDate(String(s.lastWeekly).slice(0,10)):'—'}</dd></dl>`:'<p class="muted small">טוען…</p>'}</div></div>
   <div class="card" style="margin-top:12px"><h3 style="margin-top:0">החסידויות – שימוש החודש מול החבילה</h3>${appOrgUsageList()}</div>`;}
function appOrgUsageList(){return (APP.orgs||[]).map(o=>{const sys=sysOfOrg(o.id),sub=sys?.client?all('subscriptions').find(s=>s.client===sys.client&&s.status==='פעיל'&&num(s.includedHours)>0):null,h=num(o.seconds_month)/3600,inc=sub?subInc(sub):0,p=inc?h/inc:0;
  return `<div style="margin:10px 0"><div class="row between"><span><b>${esc(o.name)}</b> ${o.active?'':'<span class="pill bad">מושבתת</span>'} ${sys?.client?refLink('clients',sys.client):'<span class="muted small">לא מקושר ללקוח</span>'}</span><span class="small num">${h.toFixed(1)} שעות${inc?` מתוך ${inc}`:''}</span></div>${inc?`<div class="bar"><i style="width:${Math.min(100,p*100)}%;background:${p>=1?'var(--bad)':p>=.8?'var(--warn)':'var(--brass)'}"></i></div>`:''}</div>`;}).join('')||'<p class="muted small">טוען…</p>';}
function appOrgs(){const o=APP.orgs;if(!o)return '<div class="card"><span class="loading"></span> טוען…</div>';

   <td data-label="חסידות"><b>${esc(x.name)}</b> <span class="muted small" dir="ltr">${esc(x.id)}</span></td><td data-label="משתמשים" class="num">${num(x.members)}</td><td data-label="הקלטות" class="num">${num(x.recordings)}</td><td data-label="היום">${fmtH(x.seconds_today)}</td><td data-label="החודש">${fmtH(x.seconds_month)}</td>

   <td style="white-space:nowrap"><button class="btn sm" data-act="orgUsers" data-id="${esc(x.id)}">👥 משתמשים</button> <a class="btn sm" href="${esc(orgUrl(x.id))}" target="_blank" rel="noopener">פתיחה ↗</a> <button class="btn sm ghost" data-act="copyLink" data-url="${esc(orgUrl(x.id))}">העתקת קישור</button> ${x.id==='biala'?'':`<button class="btn sm ${x.active?'danger ghost':''}" data-act="orgActive" data-id="${esc(x.id)}" data-name="${esc(x.name)}" data-on="${x.active?'0':'1'}">${x.active?'השבתה':'הפעלה'}</button>`}</td></tr>`;}).join('')}</tbody></table></div>
  <p class="muted small">"מסלול" (חינם / בתשלום), לוגו, שמות האדמו"רים והחומר ללימוד – נקבעים באפליקציה עצמה.</p>`;}
function appUsers(){const orgs=APP.orgs||[];const org=UI.appOrg||orgs[0]?.id;if(org&&!UI.appOrg)UI.appOrg=org;const st=APP.users[org];if(org&&!st)appLoadUsers(org);

   <td data-label="הקלטות" class="num">${num(s.recordings)}</td><td data-label="תמלול">${fmtH(s.seconds)}</td><td data-label="נראה">${u.last_seen?plainDate(String(u.last_seen).slice(0,10)):'—'}</td>
   <td style="white-space:nowrap">${me?'':`<button class="btn sm" data-act="uDisable" data-id="${esc(u.id)}">${u.disabled?'הפעלה':'השבתה'}</button> <button class="btn sm danger ghost" data-act="uRemove" data-id="${esc(u.id)}">הוצאה מהחסידות</button>`}</td></tr>`;}).join('')}</tbody></table></div>`;}
document.addEventListener('change',e=>{const t=e.target;if(t.dataset?.chg==='appOrgSel'){UI.appOrg=t.value;appLoadUsers(t.value);}if(t.dataset?.chg==='uRoleSel')ACT.uRole({id:t.dataset.id,role:t.value});});

/* ---------- שמירת ה-CRM בענן (Supabase) ---------- */
const CLOUD_SQL=`-- טבלת ה-CRM בענן. רק מנהל-העל (אתה) יכול לקרוא ולכתוב.
create table if not exists public.crm_docs(
  col text not null,
  id text not null,
  data jsonb not null,
  updated_at timestamptz not null default now(),
  primary key (col, id));
alter table public.crm_docs enable row level security;
create or replace function public.crm_is_owner() returns boolean
  language sql stable security definer set search_path = public as
  $$ select coalesce((select is_super from public.profiles where id = auth.uid()), false) $$;
drop policy if exists crm_owner_all on public.crm_docs;
create policy crm_owner_all on public.crm_docs for all to authenticated
  using (public.crm_is_owner()) with check (public.crm_is_owner());
revoke all on public.crm_docs from anon;`;
const cloudDb={collection:c=>({doc:id=>({set:o=>cloudSet(c,id,o),delete:()=>cloudDel(c,id),update:p=>cloudSet(c,id,{...(c==='meta'&&id==='offer'?OFFER:{}),...p})})}),doc:p=>{const [c,id]=p.split('/');return cloudDb.collection(c).doc(id);}};
async function cloudSet(c,id,o){const {error}=await APP.sb.from('crm_docs').upsert({col:c,id,data:o,updated_at:new Date().toISOString()});if(error)throw new Error(error.message);try{lsSave();}catch(e){}}
async function cloudDel(c,id){const {error}=await APP.sb.from('crm_docs').delete().eq('col',c).eq('id',id);if(error)throw new Error(error.message);try{lsSave();}catch(e){}}
async function cloudLoadAll(){let from=0,rows=[];for(;;){const {data,error}=await APP.sb.from('crm_docs').select('col,id,data').range(from,from+999);if(error)throw error;rows=rows.concat(data||[]);if(!data||data.length<1000)break;from+=1000;}return rows;}
async function cloudStart(){if(inClaude()||MODE==='db')return;try{await appInit();if(!appOk())return;
    const rows=await cloudLoadAll();APP.cloud='on';
    if(!rows.length){APP.cloud='empty';scheduleRender();return;}
    for(const c of COLS)S[c]=new Map();for(const r of rows){if(r.col==='settings'&&r.id==='main')SET={...DEFAULT_SETTINGS,...r.data};else if(r.col==='settings'&&r.id==='timer')TIMER=r.data?.start?r.data:null;else if(r.col==='meta'&&r.id==='offer')OFFER=r.data;else if(S[r.col])S[r.col].set(r.id,{...r.data,id:r.id});}
    db=cloudDb;MODE='cloud';try{lsSave();}catch(e){}scheduleRender();}
  catch(e){APP.cloud=/crm_docs|relation|does not exist|schema cache/i.test(e.message||'')?'missing':'err';APP.cloudErr=e.message;scheduleRender();}}
ACT.cloudUpload=async()=>{if(!await ask('להעלות לענן את כל הנתונים שיש כרגע ב-CRM הזה? אחרי זה הענן הוא המקור, וכל מחשב שתיכנס ממנו יראה את אותם נתונים.',{ok:'העלאה'}))return;
  try{const items=[];for(const c of COLS)for(const o of all(c))items.push({col:c,id:o.id,data:o,updated_at:new Date().toISOString()});items.push({col:'settings',id:'main',data:SET,updated_at:new Date().toISOString()});if(OFFER)items.push({col:'meta',id:'offer',data:OFFER,updated_at:new Date().toISOString()});
    for(let i=0;i<items.length;i+=200){const {error}=await APP.sb.from('crm_docs').upsert(items.slice(i,i+200));if(error)throw error;}
    db=cloudDb;MODE='cloud';APP.cloud='on';toast(`הועלו ${items.length} רשומות – ה-CRM שמור עכשיו בענן`,'good');render();}catch(e){toast('ההעלאה נכשלה: '+e.message,'bad');}};
ACT.copySql=()=>{copyText(CLOUD_SQL);toast('הקוד הועתק','good');};
ACT.cloudRetry=()=>{APP.cloud='off';cloudStart();};

  const head=st==='on'?'<div class="banner good"><span>✅ ה-CRM שמור בענן. כל שינוי נשמר מיד, ואפשר לפתוח את הקובץ מכל מחשב – הנתונים יהיו שם.</span></div>':st==='empty'?'<div class="banner info"><span>הטבלה בענן מוכנה וריקה. לחץ "העלאת כל הנתונים לענן" כדי להעביר אליה את מה שיש כאן.</span></div>':st==='missing'?'<div class="banner warn"><span>עוד לא הוקמה הטבלה בענן – בצע את שלב 1 למטה (פעם אחת).</span></div>':'';

   <h3 style="margin:8px 0 0">שלב 2 – העברת הנתונים</h3><p style="margin:0">אם הנתונים שלך נמצאים ב-CRM שבתוך Claude: שם ← הגדרות ← גיבוי ושחזור ← <b>הורדת גיבוי</b>. כאן ← הגדרות ← גיבוי ושחזור ← <b>שחזור</b> מהקובץ. ואז:</p>
   <div><button class="btn pri" data-act="cloudUpload" ${st==='missing'?'disabled':''}>העלאת כל הנתונים לענן</button></div>
   ${APP.cloudErr&&st!=='on'?`<p class="muted small">פרטי השגיאה: ${esc(APP.cloudErr)}</p>`:''}</div>`;}

    for(const u of users){const r=await fetch(`https://api.github.com/users/${encodeURIComponent(u)}/repos?per_page=100&sort=pushed`,{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw new Error('GitHub '+r.status);repos.push(...await r.json());}
    const seen=new Set(SET.ghSeen||[]);let added=[],upd=0;
    for(const r of repos){if(!r.has_pages||r.fork||r.archived)continue;const own=r.owner.login.toLowerCase();
      const pages=r.name.toLowerCase()===own+'.github.io'?`https://${own}.github.io/`:`https://${own}.github.io/${r.name}/`;

      let s=kn||sys.find(x=>x.repo===r.full_name)||sys.find(x=>normU(x.url)===normU(pages));
      if(s){const p={};if(!s.repo)p.repo=r.full_name;if(!s.url)p.url=pages;if(s.ghUpdated!==r.pushed_at)p.ghUpdated=r.pushed_at;
        if(Object.keys(p).length){await put('systems',{...s,...p});upd++;}seen.add(r.full_name);continue;}
      if(seen.has(r.full_name))continue;
      const com=GH_COMM[r.name]&&get('communities',GH_COMM[r.name])?GH_COMM[r.name]:'';
      const o={name:GH_NAMES[r.name]||r.description||r.name,mine:!com,community:com,url:pages,repo:r.full_name,ghUpdated:r.pushed_at,active:'פעיל',netfree:'לא נשלח',createdAt:new Date().toISOString(),auto:true};
      await put('systems',o);added.push(o.name);seen.add(r.full_name);}

  catch(e){if(manual)toast('לא הצלחתי להתחבר ל-GitHub: '+(e?.message||''),'bad');}
  finally{GH_BUSY=false;scheduleRender();}}

/* ---------- קוד הקמה (פעם אחת) לאוטומציה ולגיבויים ---------- */
const CRM_SQL2=`-- CRM: גיבויים יומיים + אוטומציה שעובדת גם כשהמחשב כבוי. מריצים פעם אחת.
create table if not exists public.crm_backups(
  id bigserial primary key,
  created_at timestamptz not null default now(),
  rows int not null default 0,
  data jsonb not null);
alter table public.crm_backups enable row level security;
drop policy if exists crm_backups_owner on public.crm_backups;
create policy crm_backups_owner on public.crm_backups for all to authenticated
  using (public.crm_is_owner()) with check (public.crm_is_owner());
revoke all on public.crm_backups from anon;

create or replace function public.crm_key_ok(p_key text) returns boolean
  language sql stable security definer set search_path = public as
  $$ select coalesce(length(p_key) >= 16 and p_key = (select data->>'key' from public.crm_docs where col = 'sys' and id = 'ingest'), false) $$;
revoke all on function public.crm_key_ok(text) from public, anon, authenticated;

create or replace function public.crm_ingest(p_key text, p_col text, p_id text, p_data jsonb, p_merge boolean default true, p_must_exist boolean default false)
  returns jsonb language plpgsql security definer set search_path = public as $$
declare cur jsonb;
begin
  if not (public.crm_key_ok(p_key) or public.crm_is_owner()) then raise exception 'מפתח שגוי'; end if;
  if p_col = 'sys' and p_id = 'ingest' then raise exception 'אסור'; end if;
  select data into cur from public.crm_docs where col = p_col and id = p_id;
  if cur is null and p_must_exist then return jsonb_build_object('ok', false, 'missing', true); end if;
  insert into public.crm_docs(col, id, data, updated_at)
    values (p_col, p_id, (case when p_merge and cur is not null then cur || p_data else p_data end) || jsonb_build_object('id', p_id), now())
  on conflict (col, id) do update set data = excluded.data, updated_at = now();
  return jsonb_build_object('ok', true, 'existed', cur is not null);
end $$;

create or replace function public.crm_list(p_key text, p_col text) returns jsonb
  language plpgsql stable security definer set search_path = public as $$
begin
  if not (public.crm_key_ok(p_key) or public.crm_is_owner()) then raise exception 'מפתח שגוי'; end if;
  if p_col = 'sys' then raise exception 'אסור'; end if;
  return (select coalesce(jsonb_agg(data || jsonb_build_object('id', id)), '[]'::jsonb) from public.crm_docs where col = p_col);
end $$;

create or replace function public.crm_backup(p_key text default null) returns jsonb
  language plpgsql security definer set search_path = public as $$
declare n int; snap jsonb;
begin
  if not (public.crm_is_owner() or public.crm_key_ok(p_key)) then raise exception 'אין הרשאה'; end if;
  select count(*), coalesce(jsonb_agg(jsonb_build_object('col', col, 'id', id, 'data', data)), '[]'::jsonb)
    into n, snap from public.crm_docs where col <> 'sys';
  insert into public.crm_backups(rows, data) values (n, snap);
  delete from public.crm_backups where created_at < now() - interval '45 days';
  return jsonb_build_object('ok', true, 'rows', n);
end $$;

grant execute on function public.crm_ingest(text, text, text, jsonb, boolean, boolean) to anon, authenticated;
grant execute on function public.crm_list(text, text) to anon, authenticated;
grant execute on function public.crm_backup(text) to anon, authenticated;

-- ליד חדש מהאתר נכנס ל-CRM מיד – גם כשה-CRM סגור. אף פעם לא מפריע להרשמה עצמה.
create or replace function public.crm_on_request() returns trigger
  language plpgsql security definer set search_path = public as $$
declare r jsonb := to_jsonb(new); em text; note text; nm text; ph text; org text; lid text; today text;
begin
  begin
    em := lower(trim(coalesce(r->>'email', '')));
    if em = '' or em ~ '@keter[.]site$' then return new; end if;
    if exists (select 1 from public.crm_docs where col = 'leads' and (lower(data->>'email') = em or data->>'appRequest' = r->>'id')) then return new; end if;
    if exists (select 1 from public.crm_docs where col = 'settings' and id = 'main' and em in (lower(coalesce(data->>'personalEmail', '')), lower(coalesce(data->>'businessEmail', '')))) then return new; end if;
    note := coalesce(r->>'note', '');
    nm := coalesce(nullif(trim(r->>'name'), ''), nullif(trim(substring(note from 'שם\\s*:\\s*([^|]+)')), ''), em);
    ph := regexp_replace(trim(coalesce(substring(note from 'טלפון\\s*:\\s*([^|]+)'), '')), '^[+]972', '0');
    org := trim(coalesce(substring(note from 'חצר / מוסד\\s*:\\s*([^|]+)'), substring(note from 'חסידות / מוסד\\s*:\\s*([^|]+)'), ''));
    lid := 'req-' || (r->>'id');
    today := to_char(now() at time zone 'Asia/Jerusalem', 'YYYY-MM-DD');
    insert into public.crm_docs(col, id, data) values ('leads', lid, jsonb_build_object(
      'id', lid, 'name', nm, 'email', em, 'phone', ph, 'org', org, 'date', today, 'channel', 'אתר', 'status', 'ליד חדש',
      'need', left(regexp_replace(note, '^ליד מהאתר · ', ''), 400), 'nextAction', 'לחזור אליו ולתאם שיחת אפיון והדגמה',
      'nextDate', today, 'notes', 'נקלט אוטומטית מהאתר (גם כשה-CRM סגור).', 'appRequest', r->>'id', 'createdAt', now()))
      on conflict do nothing;
    insert into public.crm_docs(col, id, data) values ('tasks', 'task-' || lid, jsonb_build_object(
      'id', 'task-' || lid, 'title', 'לחזור לליד מהאתר: ' || nm || case when org <> '' then ' (' || org || ')' else '' end,
      'lead', lid, 'due', today, 'priority', 'גבוהה', 'status', 'לעשות', 'createdAt', now()))
      on conflict do nothing;
  exception when others then null;
  end;
  return new;
end $$;

async function geminiUploadFile(file){const base='https://generativelanguage.googleapis.com/upload/v1beta/files';

  const j=await up.json();let f=j.file;if(!f?.uri)throw new Error('העלאת הקובץ לג׳מיני נכשלה');
  for(let k=0;k<60&&f.state==='PROCESSING';k++){await new Promise(r=>setTimeout(r,2000));const r=await fetch('https://generativelanguage.googleapis.com/v1beta/'+f.name,{headers:{'x-goog-api-key':SET.geminiKey}});f=await r.json();}

async function analyzeCall(job,link){const prompt=callPrompt(link);let out='';
  if(job.file){const model=SET.geminiModel||'gemini-2.5-flash',mime=(job.file.type||'audio/mpeg').split(';')[0];let part;
    if(job.file.size<14*1024*1024)part={inlineData:{mimeType:mime,data:await blobB64(job.file)}};else{const f=await geminiUploadFile(job.file);part={fileData:{mimeType:f.mimeType||mime,fileUri:f.uri}};}
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':SET.geminiKey},body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt},part]}],generationConfig:{responseMimeType:'application/json',temperature:0.3}})});
    if(!res.ok){let t='';try{t=(await res.json())?.error?.message||'';}catch(e){}throw new Error(res.status===429?'ג׳מיני עמוס או שהמכסה החינמית נגמרה – נסה שוב מאוחר יותר':(t||'שגיאה '+res.status));}

    try{toast('מעלה קבלה…');const up=await assetsApi.upload(f);const o=get(d.col,d.id);await put(d.col,{...o,receipt:{id:up.id,url:up.url,name:f.name}});toast('הקבלה נשמרה','good');}catch(e){toast('ההעלאה נכשלה: '+(e?.message||''),'bad');}};inp.click();};

/* ---- pull website leads straight from the business Gmail whenever the CRM is open ---- */
const MAILSYNC={busy:false,last:''};
const clean1=s=>String(s||'').replace(/[‎‏‪-‮⁦-⁩]/g,'').trim();
function parseLeadMail(body,subject){const g=k=>{const m=String(body||'').match(new RegExp('^\\s*'+k+'\\s*:\\s*(.+)$','m'));return m?clean1(m[1]):'';};
  let name=g('שם'),org=g('חצר / מוסד')||g('חסידות / מוסד');if(!name){const m=clean1(subject).match(/ליד חדש מהאתר\s*[–-]\s*([^(]+)(?:\((.+)\))?/);if(m){name=clean1(m[1]);org=org||clean1(m[2]||'');}}
  return {name,org,email:g('מייל').toLowerCase(),phone:g('טלפון').replace(/^\+972/,'0'),vol:g('נפח הקלטות'),note:g('הערה'),src:g('מקור')};}
async function mailSync(manual){if(MAILSYNC.busy||!mcpApi||MODE!=='db')return;MAILSYNC.busy=true;let added=0;
  try{const r=await mcpApi.callTool('Gmail','search_threads',{query:'in:anywhere newer_than:14d subject:"ליד חדש מהאתר"',pageSize:50},{cache:false});
    const threads=(r?.payload?.threads)||[];const seen=new Set(SET.mailSeen||[]);const mine=[SET.personalEmail,SET.businessEmail].map(s=>String(s||'').toLowerCase());
    const have=new Set(all('leads').map(l=>String(l.email||'').toLowerCase()).filter(Boolean));const newSeen=[];
    for(const t of threads){if(seen.has(t.id))continue;newSeen.push(t.id);
      const tr=await mcpApi.callTool('Gmail','get_thread',{threadId:t.id,messageFormat:'PLAIN_TEXT'},{cache:false});const msg=(tr?.payload?.messages||[])[0];if(!msg)continue;
      const L=parseLeadMail(msg.plaintextBody||msg.snippet,msg.subject);if(!L.email||!L.name||have.has(L.email)||mine.includes(L.email))continue;have.add(L.email);
      const d=msg.date?new Date(msg.date):new Date();const day=new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
      const lead=await put('leads',{name:L.name,org:L.org,email:L.email,phone:L.phone,date:day,channel:'אתר',status:'ליד חדש',need:['מילא טופס באתר.',L.vol&&`נפח הקלטות: ${L.vol}.`,L.note&&`הערה: ${L.note}`].filter(Boolean).join(' '),nextAction:'לחזור אליו ולתאם שיחת אפיון והדגמה',nextDate:todayISO(),notes:`נקלט אוטומטית מהמייל (${L.src||'טופס באתר'}).`});
      await put('tasks',{title:`לחזור לליד מהאתר: ${L.name}${L.org?` (${L.org})`:''}`,lead:lead.id,due:todayISO(),priority:'גבוהה',status:'לעשות'});added++;}
    if(newSeen.length)await saveSettings({mailSeen:[...newSeen,...(SET.mailSeen||[])].slice(0,500)});
    MAILSYNC.last=new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
    if(added)toast(`📥 ${added} ${added===1?'ליד חדש נקלט':'לידים חדשים נקלטו'} מהמייל`,'good');else if(manual)toast('אין לידים חדשים במייל');}
  catch(e){if(manual)toast(e&&e.code==='consent_required'?'צריך לאשר פעם אחת שה-CRM יקרא את המייל (בהודעה שנפתחה)':'לא הצלחתי לקרוא את המייל: '+(e?.message||e?.code||''),'bad');}
  finally{MAILSYNC.busy=false;scheduleRender();}}
ACT.mailSync=()=>mailSync(true);
/* ---- receipts in the business Gmail (incl. ones forwarded from the personal Gmail) become expenses automatically ---- */
const RCPT={busy:false,last:''};
const RCPT_Q='in:anywhere newer_than:120d -subject:"ליד חדש" -subject:"בקשת הצטרפות" (from:anthropic.com OR from:mail.anthropic.com OR from:payments-noreply@google.com OR from:googleplay-noreply@google.com OR from:stripe.com OR subject:receipt OR subject:invoice OR subject:קבלה OR subject:חשבונית OR subject:"your receipt" OR subject:"payment received")';
async function receiptSync(manual){if(RCPT.busy||!mcpApi||MODE!=='db'||!aiReady())return;RCPT.busy=true;let added=0;
  try{const r=await mcpApi.callTool('Gmail','search_threads',{query:RCPT_Q,pageSize:30},{cache:false});const threads=r?.payload?.threads||[];
    const seen=new Set(SET.rcptSeen||[]);const newSeen=[];
    for(const t of threads){const tr=await mcpApi.callTool('Gmail','get_thread',{threadId:t.id,messageFormat:'PLAIN_TEXT'},{cache:false});
      for(const m of (tr?.payload?.messages||[])){if(!m.id||seen.has(m.id))continue;newSeen.push(m.id);
        const txt=`נושא: ${m.subject||''}\nשולח: ${m.sender||''}\nתאריך: ${m.date||''}\n\n${String(m.plaintextBody||m.snippet||'').slice(0,6000)}`;
        let x;try{const a=await aiCall([{role:'user',content:`זה מייל. אם הוא קבלה / חשבונית / אישור תשלום על קנייה או מנוי ששולם (לא הצעת מחיר, לא פרסומת, לא תזכורת לתשלום עתידי) – החזר JSON: {"isReceipt":true,"vendor":"שם הספק","item":"מה נקנה","amount":מספר,"currency":"ILS או USD או EUR","date":"YYYY-MM-DD","recurring":true אם זה מנוי שמתחדש באופן קבוע אחרת false,"category":"אחד מ: ${SET.expenseCats.join(' / ')}"}. אם זה לא קבלה – החזר {"isReceipt":false}. רק JSON.\n\n${txt}`}]);const s=a.text||'';x=JSON.parse(s.slice(s.indexOf('{'),s.lastIndexOf('}')+1));}catch(e){continue;}
        if(!x?.isReceipt||!(num(x.amount)>0))continue;
        const rate=x.currency==='USD'?num(SET.usdRate||3.11):x.currency==='EUR'?num(SET.eurRate||3.6):1,ils=Math.round(num(x.amount)*rate),cur=x.currency&&x.currency!=='ILS'?` (${x.amount} ${x.currency==='USD'?'$':x.currency} לפי שער ${rate})`:'';
        const receipt={url:m.viewUrl||t.viewUrl||'',name:'המייל עם הקבלה',mailId:m.id},vendor=clean1(x.vendor)||'ספק',cat=SET.expenseCats.includes(x.category)?x.category:'אחר',date=/^\d{4}-\d{2}-\d{2}$/.test(x.date||'')?x.date:todayISO();
        if(x.recurring){const ex=all('fixed').find(f=>(f.vendor||f.name||'').toLowerCase().includes(vendor.toLowerCase().split(' ')[0])&&(!f.endDate||f.endDate>=todayISO()));
          if(ex){await put('fixed',{...ex,lastReceipt:receipt,lastPaid:date,receipt:ex.receipt||receipt,notes:`${ex.notes||''}\nחיוב ${date}: ${money(ils)}${cur} – נקלט מהמייל.`.trim()});}
          else{await put('fixed',{name:`${vendor}${x.item?' – '+clean1(x.item):''}`,vendor,category:cat,monthly:ils,startDate:date,receipt,notes:`נקלט אוטומטית מקבלה במייל${cur}.`});added++;}}
        else{await put('expenses',{date,vendor:`${vendor}${x.item?' – '+clean1(x.item):''}`,category:cat,amount:ils,assign:'כללי',receipt,notes:`נקלט אוטומטית מקבלה במייל${cur}.`});added++;}}}
    if(newSeen.length)await saveSettings({rcptSeen:[...newSeen,...(SET.rcptSeen||[])].slice(0,800)});
    RCPT.last=new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
    if(added)toast(`🧾 ${added} ${added===1?'הוצאה חדשה נרשמה':'הוצאות חדשות נרשמו'} מקבלות במייל`,'good');else if(manual)toast('אין קבלות חדשות במייל');}
  catch(e){if(manual)toast('לא הצלחתי לקרוא קבלות מהמייל: '+(e?.message||e?.code||''),'bad');}
  finally{RCPT.busy=false;scheduleRender();}}
ACT.rcptSync=()=>receiptSync(true);
(async()=>{await boot();if(MODE!=='db'||!mcpApi)return;const wait=()=>new Promise(r=>setTimeout(r,1500));for(let k=0;k<20&&!loaded.has('leads');k++)await wait();await wait();await mailSync(false);receiptSync(false);setInterval(()=>{mailSync(false).then(()=>receiptSync(false));},10*60*1000);})();
</script>
