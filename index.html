/* ---- finance ---- */
PAGES.finance=()=>{const tb=R.tab||'sum';const T=[['sum','סיכום'],['pay','תשלומים שהתקבלו'],['installments','פריסות תשלום'],['subs','מנויים חודשיים'],['exp','הוצאות'],['fixed','הוצאות קבועות'],['cash','קופת מזומן']];if(SET.receiptsOn)T.push(['rcpt','קבלות']);
  const head=tabs(T,tb,'finance');
  if(tb==='pay')return head+listView('payments',{foot:d=>`<td>סה״כ</td><td></td><td></td><td class="num">${money(sum(d,'amount'))}</td><td></td><td></td>`,addLabel:'רישום תשלום'});
  if(tb==='installments')return head+listView('installments',{empty:['אין תשלומים בפריסה','מחלקים יתרה לתשלומים מתוך מסך הפרויקט ← תשלומים.']});
  if(tb==='subs'){const subs=all('subscriptions');return head+`<div class="kpis" style="margin-bottom:14px">${kpi('הכנסה חודשית קבועה',money(mrr()))}${kpi('מנויים פעילים',subs.filter(s=>s.status==='פעיל').length)}${kpi('לחיוב עכשיו',subs.filter(s=>s.status==='פעיל'&&s.nextCharge<=todayISO()).length)}</div>`+
    `${subs.filter(s=>s.status==='פעיל'&&s.nextCharge<=todayISO()).map(s=>`<div class="alert warn" style="margin-bottom:6px;cursor:default"><span class="dot"></span><span style="flex:1">${esc(s.name)} – ${esc(refName('clients',s.client))}: ${money(s.monthly)} (${esc(plainDate(s.nextCharge))})</span><button class="btn sm gold" data-act="subPaid" data-id="${esc(s.id)}">התקבל</button></div>`).join('')}`+listView('subscriptions',{empty:['אין מנויים','מנוי מתאים לתמיכה חודשית, לשימוש במוצר כמו ביאלה, או לאחסון.']});}
  if(tb==='exp')return head+expAllView();
  if(tb==='fixed')return head+`<p class="muted small" style="margin-top:0">הוצאות שחוזרות כל חודש (תוכנות, שירותי ענן). הן נכנסות אוטומטית לחישוב הרווח לכל חודש מתאריך ההתחלה.</p>`+listView('fixed',{foot:d=>`<td>סה״כ לחודש</td><td></td><td></td><td class="num">${money(sum(d.filter(f=>!f.endDate||f.endDate>=todayISO()),'monthly'))}</td><td></td><td></td>`});
  if(tb==='cash'){const cashIn=sum(all('payments').filter(p=>p.method==='מזומן'),'amount'),out=sum(all('deposits'),'amount');return head+`<div class="kpis" style="margin-bottom:14px">${kpi('מזומן שהתקבל',money(cashIn))}${kpi('הופקד',money(out))}${kpi('מזומן אצלך עכשיו',money(cashIn-out),'לפי הרישומים',cashIn-out<0?'bad':'')}</div>`+listView('deposits',{addLabel:'רישום הפקדה',empty:['אין הפקדות','כשאתה מפקיד מזומן בבנק, רשום כאן כדי לדעת כמה נשאר אצלך.']});}
  if(tb==='rcpt'){const r=all('payments').filter(p=>p.receiptNo).sort((a,b)=>String(b.receiptNo).localeCompare(String(a.receiptNo),undefined,{numeric:true}));return head+`<p class="muted small" style="margin-top:0">המספר הבא: ${esc(SET.receiptPrefix)}${SET.nextReceipt}. המערכת מפיקה מסמך קבלה לפי הפרטים שהזנת בהגדרות. כדאי לוודא מול רואה חשבון שהמסמך מתאים לסוג העוסק שלך.</p>${r.length?`<div class="card pad0 tbl-wrap"><table class="t fold"><thead><tr><th>מספר</th><th>תאריך</th><th>לקוח</th><th>סכום</th><th>אמצעי</th><th></th></tr></thead><tbody>${r.map(p=>`<tr class="static"><td>${esc(p.receiptNo)}</td><td data-label="תאריך">${fmtDate(p.date)}</td><td data-label="לקוח">${esc(refName('clients',p.client||get('projects',p.project)?.client))}</td><td data-label="סכום" class="num">${money(p.amount)}</td><td data-label="אמצעי">${esc(p.method)}</td><td><button class="btn sm" data-act="receiptDoc" data-id="${esc(p.id)}">שמירת המסמך</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="card empty"><b>עוד לא הופקו קבלות</b>בעת רישום תשלום אפשר לסמן "להפיק קבלה".</div>'}`;}
  /* summary */
  const st=UI.fin??={period:'year'};const r=periodRange(st.period);const f=finance(r);
  const projs=all('projects').filter(isApproved);const fins=projs.map(p=>({p,f:projFin(p)}));
  const agreed=sum(fins,x=>x.f.agreed),paidAll=sum(fins,x=>x.f.paid),bal=sum(fins,x=>x.f.balance),expP=sum(fins,x=>x.f.exp);
  const mk=sum(all('expenses').filter(x=>x.assign==='קמפיין'&&inRange(x.date,r)),'amount');
  const months=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);const from=iso(d);const to=iso(new Date(d.getFullYear(),d.getMonth()+1,0));const x=finance({from,to});months.push({l:d.toLocaleDateString('he-IL',{month:'short'}),...x});}
  const mx=Math.max(1,...months.map(m=>Math.max(m.income,m.expenses)));
  return head+`<div class="stack"><div class="row between"><h2>כספים</h2><select id="finPer" data-uisel="fin.period" style="width:auto" aria-label="תקופה">${[['month','החודש'],['prev','החודש הקודם'],['quarter','3 חודשים'],['year','השנה'],['all','הכול']].map(([k,l])=>`<option value="${k}" ${st.period===k?'selected':''}>${l}</option>`).join('')}</select></div>
   <div class="kpis">${kpi('התקבל ('+r.label+')',money(f.income))}${kpi('הוצאות ('+r.label+')',money(f.expenses),`מתוכן שיווק ${money(mk)}`)}${kpi('רווח בפועל לפני מס',money(f.profit),'',f.profit>=0?'good':'bad')}</div>
   <div class="kpis">${kpi('הכנסה שסוכמה',money(agreed),'כל הפרויקטים המאושרים')}${kpi('התקבל מהם',money(paidAll))}${kpi('יתרה שטרם התקבלה',money(bal),'',bal?'bad':'')}${kpi('רווח צפוי',money(agreed-expP),'סוכם פחות הוצאות ישירות')}</div>
   <div class="card"><div class="hd"><h3>הכנסות והוצאות – 6 חודשים</h3><div class="legend"><span><i style="background:var(--navy)"></i>הכנסות</span><span><i style="background:var(--brass)"></i>הוצאות</span></div></div>
    <div class="chart">${months.map(m=>`<div class="m"><div class="bars"><i style="height:${m.income/mx*100}%" title="הכנסות ${money(m.income)}"></i><i class="x" style="height:${m.expenses/mx*100}%" title="הוצאות ${money(m.expenses)}"></i></div><small>${esc(m.l)}</small></div>`).join('')}</div></div>
   <div class="card pad0"><div class="hd" style="padding:14px 16px 0"><h3>רווחיות לפי פרויקט</h3></div>${fins.length?`<div class="tbl-wrap"><table class="t fold"><thead><tr><th>פרויקט</th><th>סוכם</th><th>התקבל</th><th>יתרה</th><th>הוצאות</th><th>שעות</th><th>רווח צפוי</th><th>לשעה</th></tr></thead><tbody>${fins.sort((a,b)=>b.f.agreed-a.f.agreed).map(({p,f})=>`<tr data-act="go" data-page="project" data-id="${esc(p.id)}"><td>${esc(p.name)}${demoPill(p)}</td><td data-label="סוכם" class="num">${money(f.agreed)}</td><td data-label="התקבל" class="num">${money(f.paid)}</td><td data-label="יתרה" class="num">${money(f.balance)}</td><td data-label="הוצאות" class="num">${money(f.exp)}</td><td data-label="שעות" class="num">${f.hours.toFixed(1)}</td><td data-label="רווח צפוי" class="num"><b>${money(f.profitExp)}</b></td><td data-label="לשעה" class="num">${f.hours?money(f.perHour):'—'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted small" style="padding:0 16px 14px">אין עדיין פרויקטים מאושרים.</p>'}</div>
   <p class="muted small">כל הסכומים לפני מס. המערכת לא מחשבת מס, כי אין לה את כל הנתונים הדרושים לכך.</p></div>`;};
ACT.subPaid=async d=>{const s=get('subscriptions',d.id);try{const pay=await put('payments',{client:s.client,subscription:s.id,date:todayISO(),amount:s.monthly,method:s.method||'מזומן',notes:'חיוב מנוי: '+s.name});await put('subscriptions',{...s,nextCharge:addMonths(s.nextCharge||todayISO(),1)});toast('החיוב נרשם והמועד הבא עודכן','good');if(SET.receiptsOn)offerReceipt(pay);}catch(e){}};
function openPayment(pmt,preset={}){const o=pmt?{...pmt}:{date:todayISO(),method:'מזומן',...preset};if(!pmt&&o.project&&!o.client)o.client=get('projects',o.project)?.client||'';const isNew=!o.id;
  const flds=SCHEMA.payments.fields.filter(f=>f.key!=='receiptNo');
  const m=modal(isNew?'רישום תשלום שהתקבל':'עריכת תשלום',`<div class="form">${flds.map(f=>fieldHTML(f,o[f.key]??'')).join('')}${SET.receiptsOn?(o.receiptNo?`<p class="wide small">קבלה מספר <b>${esc(o.receiptNo)}</b></p>`:`<label class="f chk wide"><input type="checkbox" id="pRcpt" ${isNew?'checked':''}> להפיק קבלה (מספר ${esc(SET.receiptPrefix)}${SET.nextReceipt})</label>`):''}</div><p id="pErr" class="small" style="color:var(--bad)" hidden></p>`,
   {foot:`<span class="row">${!isNew?'<button class="btn danger" id="pDel">מחיקה</button>':''}${o.receiptNo?'<button class="btn" id="pDoc">מסמך הקבלה</button>':''}</span><span class="row"><button class="btn" data-close>ביטול</button><button class="btn pri" id="pSave">שמירה</button></span>`});
  m.querySelector('#fld-project').addEventListener('change',e=>{const p=get('projects',e.target.value);if(p&&!m.querySelector('#fld-client').value)m.querySelector('#fld-client').value=p.client;});
  m.querySelector('#pSave').onclick=async()=>{const v={...o};for(const f of flds)v[f.key]=readField(f,m);if(!v.amount||!v.date){const e=m.querySelector('#pErr');e.textContent='חסר סכום או תאריך';e.hidden=false;return;}
    if(!v.client&&v.project)v.client=get('projects',v.project)?.client||'';const mkR=m.querySelector('#pRcpt')?.checked;
    try{if(mkR&&!v.receiptNo){v.receiptNo=SET.receiptPrefix+SET.nextReceipt;await saveSettings({nextReceipt:num(SET.nextReceipt)+1});}const s=await put('payments',v);m.close();toast('התשלום נרשם','good');if(mkR)receiptDoc(s);}catch(e){}};
  m.querySelector('#pDel')?.addEventListener('click',async()=>{if(await ask(o.receiptNo?'לתשלום הזה הופקה קבלה. למחוק בכל זאת?':'למחוק את התשלום?',{ok:'מחיקה',danger:true})){await del('payments',o.id);m.close();}});
  m.querySelector('#pDoc')?.addEventListener('click',()=>receiptDoc(o));}
async function offerReceipt(pay){if(await ask(`להפיק קבלה מספר ${esc(SET.receiptPrefix)}${SET.nextReceipt} על ${money(pay.amount)}?`,{ok:'הפקת קבלה'})){const no=SET.receiptPrefix+SET.nextReceipt;await saveSettings({nextReceipt:num(SET.nextReceipt)+1});const s=await put('payments',{...get('payments',pay.id),receiptNo:no});receiptDoc(s);}}

PAGES.marketing=()=>{const tb=R.tab||'over';const head=tabs([['over','סקירה ומסלול'],['campaigns','קמפיינים'],['ref','חבר מביא חבר'],['map','מפת חסידויות'],['testi','המלצות'],['links','קישורי מעקב']],tb,'marketing');
  if(tb==='campaigns'){const cs=all('campaigns');return head+(cs.length?`<div class="card pad0 tbl-wrap" style="margin-bottom:14px"><table class="t fold"><thead><tr><th>קמפיין</th><th>ערוץ</th><th>תקציב</th><th>הוצאה</th><th>פניות</th><th>לקוחות</th><th>הכנסה</th><th>לפנייה</th><th>ללקוח</th><th>המרה</th></tr></thead><tbody>${cs.map(c=>{const s=campaignStats(c);return `<tr data-act="open" data-col="campaigns" data-id="${esc(c.id)}"><td>${esc(c.name)} ${pill(c.status)}${demoPill(c)}</td><td data-label="ערוץ">${esc(c.channel||'')}</td><td data-label="תקציב" class="num">${money(c.budget)}</td><td data-label="הוצאה" class="num" style="${s.spend>num(c.budget)&&num(c.budget)?'color:var(--bad)':''}">${money(s.spend)}</td><td data-label="פניות" class="num">${s.leads}</td><td data-label="לקוחות" class="num">${s.clients}</td><td data-label="הכנסה" class="num">${money(s.income)}</td><td data-label="עלות לפנייה" class="num">${isNaN(s.cpl)?'—':money(s.cpl)}</td><td data-label="עלות ללקוח" class="num">${isNaN(s.cpa)?'—':money(s.cpa)}</td><td data-label="המרה" class="num">${pct(s.conv)}</td></tr>`;}).join('')}</tbody></table></div><p class="muted small">ההוצאה של קמפיין = הוצאות ששויכו אליו בכספים ← הוצאות.</p>`:'')+listView('campaigns',{empty:['אין קמפיינים','קמפיין יכול להיות סדרת סטטוסים, פרסום בחסידות מסוימת או מבצע לחברים.']});}
  if(tb==='ref'){const map=new Map();for(const l of all('leads').filter(l=>l.referrer)){const e=map.get(l.referrer)||{leads:0,clients:new Set()};e.leads++;if(l.convertedClient)e.clients.add(l.convertedClient);map.set(l.referrer,e);}
    for(const c of all('clients').filter(c=>c.referrer)){const e=map.get(c.referrer)||{leads:0,clients:new Set()};e.clients.add(c.id);map.set(c.referrer,e);}
    const rows=[...map.entries()].map(([rid,e])=>{const pids=all('projects').filter(p=>e.clients.has(p.client)).map(p=>p.id);const inc=sum(all('payments').filter(x=>pids.includes(x.project)),'amount');const rw=[...e.clients].map(id=>get('clients',id)).filter(Boolean);return{rid,leads:e.leads,clients:e.clients.size,inc,owed:rw.filter(c=>c.rewardStatus==='מגיע').length,given:rw.filter(c=>c.rewardStatus==='ניתן').length,rw};}).sort((a,b)=>b.inc-a.inc);
    return head+`<p class="muted small" style="margin-top:0">מי הביא לך לקוחות, כמה הכנסה הגיעה מהם, והאם מגיע להם תגמול. מסמנים "הומלץ על ידי" בפנייה או בכרטיס הלקוח.</p>`+(rows.length?`<div class="card pad0 tbl-wrap"><table class="t fold"><thead><tr><th>ממליץ</th><th>פניות</th><th>לקוחות</th><th>הכנסה מהם</th><th>תגמול מגיע</th><th>תגמול ניתן</th></tr></thead><tbody>${rows.map(r=>`<tr data-act="go" data-page="client" data-id="${esc(r.rid)}"><td>${esc(refName('clients',r.rid))}</td><td data-label="פניות" class="num">${r.leads}</td><td data-label="לקוחות" class="num">${r.clients}</td><td data-label="הכנסה" class="num">${money(r.inc)}</td><td data-label="מגיע">${r.owed?`<span class="pill warn">${r.owed}</span>`:'—'}</td><td data-label="ניתן">${r.given||'—'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="card empty"><b>עוד אין המלצות רשומות</b>כשלקוח מביא חבר, בחר אותו בשדה "הומלץ על ידי".</div>');}
  if(tb==='map'){const cs=all('communities');return head+`<div class="toolbar"><button class="btn pri" data-act="add" data-col="communities">+ הוספת חסידות / קהילה</button><span class="muted small">לקוח אחד מוביל לאחרים – כאן רואים מי כבר משתמש, מי בתהליך ומי היעד הבא.</span></div>`+
    (cs.length?`<div class="grid">${['משתמשים','בתהליך','יעד','לא רלוונטי'].flatMap(s=>cs.filter(c=>(c.status||'יעד')===s)).map(c=>{const cl=clientsOfCommunity(c.id),ct=all('contacts').filter(x=>x.community===c.id),sys=all('systems').filter(s=>s.community===c.id||cl.some(k=>k.id===s.client));return `<div class="card"><div class="hd"><h3>${esc(c.name)}${demoPill(c)}</h3>${pill(c.status)}</div><p class="muted small" style="margin:0 0 6px">${esc(c.city||'')}${c.url?` · <a href="${esc(c.url)}" target="_blank" rel="noopener">הקישור של החסידות</a>`:''}</p>
      ${ct.length?ct.map(x=>`<div class="small">${x.decider?'<span class="pill gold">מחליט</span> ':''}<b>${esc(x.name)}</b> ${esc(x.role||'')}</div>`).join(''):'<div class="small muted">אין אנשי קשר</div>'}
      <hr class="sep"><div class="small">${cl.length?'לקוחות: '+cl.map(k=>refLink('clients',k.id)).join(', '):'אין לקוחות עדיין'}</div><div class="small">${sys.length?'מערכות: '+sys.map(s=>esc(s.name)).join(', '):''}</div>
      <div class="row" style="margin-top:8px"><button class="btn sm" data-act="open" data-col="communities" data-id="${esc(c.id)}">עריכה</button><button class="btn sm" data-act="add" data-col="contacts" data-preset="${json({community:c.id})}">+ איש קשר</button><button class="btn sm" data-act="add" data-col="leads" data-preset="${json({community:c.id,channel:'חסידויות'})}">+ פנייה</button></div></div>`;}).join('')}</div>`:'<div class="card empty"><b>אין עדיין חסידויות במפה</b>הוסף את החסידויות שכבר משתמשות במערכות שלך, ואת אלה שאתה רוצה להגיע אליהן.</div>');}
  if(tb==='testi')return head+`<p class="muted small" style="margin-top:0">המלצות שהלקוח אישר לפרסם אפשר להעתיק לאתר השיווק. אחרי מסירת פרויקט נוצרת משימה לבקש המלצה.</p>`+listView('testimonials',{empty:['אין המלצות','בקש מלקוחות מרוצים כמה מילים, ושמור כאן רק מה שהם אישרו לפרסם.']});
  if(tb==='links'){const st=UI.lk??={base:'',cmp:''};return head+`<div class="card stack"><h3>יצירת קישור מעקב</h3><p class="muted small" style="margin:0">קישור עם קוד מקור וקמפיין. אם טופס הפנייה באתר שלך שולח את הכתובת המלאה, תדע מאיפה הגיע הפונה. כרגע הפניות מהאתר מגיעות למייל, ומזינים אותן כאן ידנית – חיבור אוטומטי עוד לא קיים.</p>
    <div class="form"><label class="f">כתובת האתר<input type="url" id="lkBase" data-ui="lk.base" data-live dir="ltr" value="${esc(st.base)}" placeholder="https://..."></label><label class="f">קמפיין<select id="lkCmp" data-uisel="lk.cmp"><option value="">—</option>${all('campaigns').map(c=>`<option value="${esc(c.id)}" ${st.cmp===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label></div>
    ${st.base?(()=>{const c=get('campaigns',st.cmp);const src=c?.channel?({'אתר':'site','צ׳אט':'chat','חבר מביא חבר':'referral','חסידויות':'community','סטטוס':'status','קולמוס':'kulmus'}[c.channel]||'other'):'';let u;try{u=new URL(st.base);if(src)u.searchParams.set('src',src);if(c)u.searchParams.set('cmp',c.code||c.id);}catch(e){return '<p class="small" style="color:var(--bad)">הכתובת לא תקינה. היא צריכה להתחיל ב-https://</p>';}return `<div class="code link-url" style="direction:ltr">${esc(u.toString())}</div><div><button class="btn" data-act="copyLink" data-u="${esc(u.toString())}">העתקת הקישור</button></div>`;})():''}</div>`;}
  /* overview */
  const st=UI.mk??={ch:''};const chans=SET.channels;const rows=chans.map(ch=>({ch,...channelStats(ch)}));
  const L=st.ch?all('leads').filter(l=>l.channel===st.ch):all('leads');const cl=new Set([...L.map(l=>l.convertedClient).filter(Boolean),...all('clients').filter(c=>!st.ch||c.channel===st.ch).map(c=>c.id)]);const pr=all('projects').filter(p=>cl.has(p.client));const pids=new Set(pr.map(p=>p.id));const paysF=all('payments').filter(x=>pids.has(x.project));const paying=new Set(paysF.map(x=>get('projects',x.project)?.client)).size;const inc=sum(paysF,'amount');
  const mx=Math.max(1,L.length,cl.size);const stp=(l,v)=>`<div class="st"><b>${l}</b><div class="bar"><i style="width:${v/mx*100}%"></i></div><span>${v}</span></div>`;
  return head+`<div class="stack"><div class="card"><div class="hd"><h3>המסלול: ערוץ ← פנייה ← לקוח ← פרויקט ← תשלום</h3><select id="mkCh" data-uisel="mk.ch" style="width:auto" aria-label="ערוץ"><option value="">כל הערוצים</option>${chans.map(c=>`<option ${st.ch===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
   <div class="funnel">${stp('פניות',L.length)}${stp('לקוחות',cl.size)}${stp('פרויקטים',pr.length)}${stp('לקוחות משלמים',paying)}</div><p style="margin:10px 0 0">הכנסה שהגיעה מהמסלול: <b class="num">${money(inc)}</b></p>${anyDemo()?'<p class="small" style="margin:6px 0 0;color:var(--demo)">המספרים כוללים כרגע נתוני הדגמה. אחרי מחיקתם יוצגו רק הנתונים האמיתיים שלך.</p>':''}</div>
   <div class="card pad0"><div class="hd" style="padding:14px 16px 0"><h3>לפי ערוץ</h3></div><div class="tbl-wrap"><table class="t fold"><thead><tr><th>ערוץ</th><th>פניות</th><th>לקוחות</th><th>משלמים</th><th>הכנסה</th><th>הוצאות שיווק</th><th>עלות לפנייה</th><th>עלות ללקוח</th><th>המרה</th></tr></thead><tbody>${rows.map(r=>`<tr class="static"><td>${esc(r.ch)}</td><td data-label="פניות" class="num">${r.leads}</td><td data-label="לקוחות" class="num">${r.clients}</td><td data-label="משלמים" class="num">${r.paying}</td><td data-label="הכנסה" class="num">${money(r.income)}</td><td data-label="הוצאות" class="num">${money(r.spend)}</td><td data-label="לפנייה" class="num">${isNaN(r.cpl)?'—':money(r.cpl)}</td><td data-label="ללקוח" class="num">${isNaN(r.cpa)?'—':money(r.cpa)}</td><td data-label="המרה" class="num">${pct(r.conv)}</td></tr>`).join('')}</tbody></table></div></div>
   <p class="muted small">ערכים שחסרים להם נתונים מוצגים כ"—". הערוצים נקבעים בהגדרות.</p></div>`;};

const okProspect=x=>num(x.score)>=7&&!!String(x.email||'').includes('@');
PAGES.prospects=()=>{const tb=R.tab||'new';const P=all('prospects').filter(okProspect);const t=todayISO();
  const nwAll=P.filter(x=>x.status==='חדש').sort((a,b)=>num(b.score)-num(a.score));const nw=nwAll.filter(x=>(x.foundAt||'')>=t);const older=nwAll.filter(x=>(x.foundAt||'')<t);
  const sent=P.filter(x=>x.status==='נשלח'||x.status==='תזכורת נשלחה').sort((a,b)=>(a.sentAt||'').localeCompare(b.sentAt||''));
  const done=P.filter(x=>['ענה','לא מעוניין','לא מתאים'].includes(x.status));
  const replied=P.filter(x=>x.status==='ענה').length,sentAll=P.filter(x=>x.sentAt).length;
  const head=`<div class="kpis" style="margin-bottom:12px">${kpi('לשליחה היום',nw.length)}${kpi('נשלחו',sentAll)}${kpi('ענו',replied)}${kpi('אחוז תגובה',sentAll?pct(replied/sentAll):'—')}</div>
   <div class="banner info" style="margin-bottom:12px"><span>כל בוקר החיפוש מוסיף כאן עד 7 מוסדות חדשים, רק עם ציון 7 ומעלה ורק כאלה שיש להם מייל. שום מייל לא נשלח בלי שתלחץ. עד שהמייל העסקי יחובר: מעתיקים, שולחים מהמייל העסקי ומסמנים "שלחתי".</span></div>`+
   tabs([['new',`של היום (${nw.length})`],['old',`מימים קודמים (${older.length})`],['sent',`נשלחו (${sent.length})`],['done','ענו / סגורים']],tb,'prospects');
  const card=(x,mode)=>{const fuDue=x.sentAt?addWorkDays(x.sentAt,5):'';const showFu=mode==='sent'&&x.status==='נשלח';
    return `<div class="card stack" style="gap:8px"><div class="row between"><h3 style="min-width:0">${esc(x.name)}${demoPill(x)}</h3><span class="row"><span class="pill ${num(x.score)>=9?'good':'gold'}">ציון ${num(x.score)}</span>${pill(x.status)}</span></div>
     ${x.why?`<p class="small" style="margin:0">${esc(x.why)}</p>`:''}
     <div class="row small"><span class="link-url">${esc(x.email)}</span><button class="btn sm ghost" data-act="copyLink" data-u="${esc(x.email)}">העתקת המייל</button>${x.source?`<a href="${esc(x.source)}" target="_blank" rel="noopener">המקור</a>`:''}${x.sentAt?`<span class="muted">נשלח ${esc(hebDate(x.sentAt))}</span>`:''}</div>
     ${mode==='new'||mode==='old'?`<label class="f">נושא<input type="text" id="ps-s-${esc(x.id)}" value="${esc(x.subject||'')}"></label><label class="f">נוסח<textarea id="ps-b-${esc(x.id)}" style="min-height:170px">${esc(x.body||'')}</textarea></label>
       <div class="row"><button class="btn" data-act="psCopy" data-id="${esc(x.id)}" data-k="s">העתקת הנושא</button><button class="btn" data-act="psCopy" data-id="${esc(x.id)}" data-k="b">העתקת הנוסח</button><button class="btn gold" data-act="psSent" data-id="${esc(x.id)}">שלחתי ✓</button><button class="btn ghost danger" data-act="psSet" data-id="${esc(x.id)}" data-v="לא מתאים">לא מתאים</button></div>`:''}
     ${showFu?`<p class="small" style="margin:0">${fuDue<=t?'<b style="color:var(--warn)">הגיע הזמן לתזכורת.</b>':`תזכורת ב-${esc(hebDate(fuDue))}`}</p>${fuDue<=t?`<textarea id="ps-f-${esc(x.id)}" style="min-height:110px">${esc(x.followup||'')}</textarea>`:''}`:''}
     ${mode==='sent'?`<div class="row">${showFu&&fuDue<=t?`<button class="btn" data-act="psCopy" data-id="${esc(x.id)}" data-k="f">העתקת התזכורת</button><button class="btn" data-act="psSet" data-id="${esc(x.id)}" data-v="תזכורת נשלחה">שלחתי תזכורת</button>`:''}<button class="btn gold" data-act="psReplied" data-id="${esc(x.id)}">ענו לי – פתיחת פנייה</button><button class="btn ghost" data-act="psSet" data-id="${esc(x.id)}" data-v="לא מעוניין">לא מעוניינים</button></div>`:''}
     ${mode==='done'&&x.lead?`<button class="btn sm" data-act="go" data-page="lead" data-id="${esc(x.lead)}">לפנייה</button>`:''}</div>`;};
  const list=tb==='sent'?sent:tb==='done'?done:tb==='old'?older:nw;
  return head+(list.length?`<div class="grid2">${list.map(x=>card(x,tb)).join('')}</div>`:`<div class="card empty"><b>${tb==='new'?'סיימת את המיילים של היום':'אין כאן עדיין'}</b>${tb==='new'?'מחר בבוקר יגיעו מוסדות חדשים.':''}</div>`);};
ACT.psCopy=d=>{const x=get('prospects',d.id);const el=document.getElementById(`ps-${d.k}-${d.id}`);copyText(el?el.value:(d.k==='s'?x.subject:d.k==='b'?x.body:x.followup)||'');};
ACT.psSent=async d=>{const x=get('prospects',d.id);const s=$('#ps-s-'+d.id)?.value??x.subject,b=$('#ps-b-'+d.id)?.value??x.body;await put('prospects',{...x,subject:s,body:b,status:'נשלח',sentAt:todayISO()});toast('סומן כנשלח. תזכורת בעוד 5 ימי עבודה.','good');};
ACT.psSet=async d=>{const x=get('prospects',d.id);await put('prospects',{...x,status:d.v,...(d.v==='תזכורת נשלחה'?{followupAt:todayISO()}:{})});toast('עודכן');};
ACT.psReplied=async d=>{const x=get('prospects',d.id);const l=await put('leads',{name:x.name,email:x.email,channel:'פנייה יזומה במייל',date:todayISO(),need:x.why||'',org:x.name,status:'ליד חדש',notes:'הגיע מאיתור לקוחות. המייל שנשלח:\n'+(x.body||'')});
  await put('tasks',{title:`לחזור ל${x.name} – ענו למייל`,due:todayISO(),priority:'גבוהה',status:'לעשות',lead:l.id,auto:true});await put('prospects',{...x,status:'ענה',lead:l.id});toast('נפתחה פנייה','good');go('lead',l.id);};

PAGES.content=()=>{const st=UI.cv??={v:'board'};const tools=`<select id="cvV" data-uisel="cv.v" aria-label="תצוגה"><option value="board" ${st.v==='board'?'selected':''}>לוח</option><option value="list" ${st.v==='list'?'selected':''}>רשימה</option></select><button class="btn gold" data-act="go" data-page="creator">✦ יוצר התוכן שלי</button>`;
  if(st.v==='list')return listView('content',{tools,empty:['אין תכנים','רשום רעיונות לסטטוסים ולתכנים, או צור טיוטה עם יוצר התוכן.']});
  const cs=all('content');return `<div class="toolbar">${tools}<button class="btn pri" data-act="add" data-col="content">+ הוספת תוכן</button></div><div class="kan">${['רעיון','טיוטה','מוכן','פורסם'].map(s=>{const l=cs.filter(c=>(c.status||'רעיון')===s).sort((a,b)=>(a.publishDate||'9').localeCompare(b.publishDate||'9'));return `<div class="kcol" data-drop="content" data-val="${s}"><h3>${s} <span class="muted">${l.length}</span></h3>${l.map(c=>`<div class="kcard" draggable="true" data-drag="${esc(c.id)}" data-act="open" data-col="content" data-id="${esc(c.id)}"><b>${esc(c.title)}</b>${demoPill(c)}<div class="row between small muted"><span>${esc(c.channel||'')}</span><span>${c.publishDate?esc(hebDate(c.publishDate)):''}</span></div>${(c.versions||[]).length?`<div class="small muted">${c.versions.length} גרסאות</div>`:''}</div>`).join('')}</div>`;}).join('')}</div>`;};
function openContent(c,preset={}){const o=c?{...c,versions:[...(c.versions||[])]}:{status:'רעיון',...preset};const isNew=!o.id;const flds=SCHEMA.content.fields;
  const m=modal(isNew?'תוכן חדש':'עריכת תוכן',`<div class="form">${flds.map(f=>fieldHTML(f,o[f.key]??'')).join('')}
   ${o.points?`<label class="f wide">נקודות עיקריות<textarea id="ctPoints">${esc(o.points)}</textarea></label>`:''}${o.subtitles?`<label class="f wide">כתוביות<textarea id="ctSubs">${esc(o.subtitles)}</textarea></label>`:''}${o.shots?`<label class="f wide">רעיונות לצילום<textarea id="ctShots">${esc(o.shots)}</textarea></label>`:''}</div>
   ${o.versions.length?`<h3 style="margin-top:14px">גרסאות קודמות</h3>${o.versions.map((v,i)=>`<details style="margin-top:6px"><summary class="small">${esc(plainDate(v.date))} – גרסה ${i+1}</summary><div class="code">${esc(v.text)}</div></details>`).join('')}`:''}`,
   {wide:true,foot:`<span class="row">${!isNew?'<button class="btn danger" id="ctDel">מחיקה</button>':''}<button class="btn" id="ctVer">שמירה כגרסה</button></span><span class="row"><button class="btn" data-close>ביטול</button><button class="btn pri" id="ctSave">שמירה</button></span>`});
  const collect=()=>{const v={...o};for(const f of flds)v[f.key]=readField(f,m);if(m.querySelector('#ctPoints'))v.points=m.querySelector('#ctPoints').value;if(m.querySelector('#ctSubs'))v.subtitles=m.querySelector('#ctSubs').value;if(m.querySelector('#ctShots'))v.shots=m.querySelector('#ctShots').value;return v;};
  const save=async(ver)=>{const v=collect();if(!v.title){toast('חסרה כותרת','bad');return;}if(ver)v.versions=[...(v.versions||[]),{date:todayISO(),text:[v.hook,v.script,v.caption].filter(Boolean).join('\n\n')}];try{await put('content',v);m.close();toast(ver?'נשמרה גרסה':'נשמר','good');}catch(e){}};
  m.querySelector('#ctSave').onclick=()=>save(false);m.querySelector('#ctVer').onclick=()=>save(true);
  m.querySelector('#ctDel')?.addEventListener('click',async()=>{if(await ask('למחוק את התוכן?',{ok:'מחיקה',danger:true})){await del('content',o.id);m.close();}});}

PAGES.packages=()=>{const T=SET.tiers||[];const inc=(SET.tierIncludes||'').split('\n').map(s=>s.trim()).filter(Boolean);const st=UI.pk??={h:''};const h=num(st.h);const rec=h?tierFor(h):null;
  const card=t=>`<div class="card stack" style="gap:8px;${rec&&rec.name===t.name?'border-color:var(--brass);box-shadow:inset 0 0 0 2px var(--brass)':''}"><div class="row between"><h2 style="font-size:19px">${esc(t.name)}</h2>${rec&&rec.name===t.name?pill('מתאים לפי השעות','gold'):''}</div>

    ${t.extra?`<p style="margin:0"><b>בנוסף בחבילה הזו:</b> ${esc(t.extra)}</p>`:''}</div>`;
  return `<div class="stack"><div class="banner info"><span>דף לשיחה עם לקוח. <b>פנימי בלבד</b> – לא מופיע באתר. את כל הנוסחים והמחירים משנים בהגדרות ← מחירון ועלויות.</span><button class="btn sm" data-act="go" data-page="settings" data-tab="price">עריכת החבילות</button></div>
   <div class="card"><div class="row" style="align-items:flex-end"><label class="f" style="flex:1;min-width:200px">כמה שעות הם מקליטים בחודש?<input type="number" id="pk-h" data-ui="pk.h" data-live value="${esc(st.h)}" placeholder="למשל 20"></label>${rec?`<div style="flex:2;min-width:240px"><b>מתאים להם: ${esc(rec.name)}</b><div class="small">${money(rec.setup)} הקמה + ${money(rec.monthly)} לחודש${h>num(rec.hours)?` + חריגה של ${h-num(rec.hours)} שעות × ${money(rec.overage)} = <b>${money(num(rec.monthly)+(h-num(rec.hours))*num(rec.overage))}</b> לחודש`:''}</div><div class="small muted">חיסכון משוער לעורך: כ-${Math.round(h*num(SET.manualHoursPerHour))} שעות עבודה בחודש</div></div>`:''}</div></div>
   <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))">${T.map(card).join('')}</div>
   <div class="grid2"><div class="card"><h3 style="margin-bottom:8px">מה כלול בכל החבילות</h3><ul style="margin:0;padding-inline-start:20px;line-height:1.9">${inc.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    <div class="card"><h3 style="margin-bottom:8px">תשובות מוכנות לשאלות בשיחה</h3><dl class="dl" style="grid-template-columns:1fr">
     <dt><b>מה נחשב "שעה"?</b></dt><dd>האורך של ההקלטות שמעלים למערכת. הקלטה של 40 דקות = 40 דקות מהחבילה.</dd>
     <dt><b>ומה אם נשארו שעות?</b></dt><dd>הן לא עוברות לחודש הבא. לכן כדאי לבחור חבילה לפי החודש הרגיל, לא לפי החודש העמוס.</dd>
     <dt><b>ומה אם עברנו את החבילה?</b></dt><dd>ב-80% מקבלים התראה במערכת. ב-100% ההעלאות נעצרות, ושום דבר לא מחויב בלי אישור שלכם. אפשר לעבור לחבילה הבאה – ומי שמשדרג באותו יום מקבל ${num(SET.upgradeBonusHours)} שעות מתנה לאותו חודש – או להמשיך בחבילה ולשלם לפי שעה נוספת (לפי דקות, בחשבון החודש הבא).</dd>
     <dt><b>מה עושים דמי ההקמה?</b></dt><dd>תשלום חד־פעמי: התקנה, קישור ולוגו משלכם, והתאמה לסגנון הגליון שלכם לפי דוגמאות. נפרד לגמרי מהמנוי החודשי.</dd>
     <dt><b>החומר שלנו פרטי?</b></dt><dd>כן. כל מוסד נפרד לגמרי ואף אחד אחר לא רואה את החומר.</dd>
     <dt><b>אפשר לבטל?</b></dt><dd>המנוי מתחדש מחודש לחודש, ביטול בהודעה ${num(SET.cancelDays)||30} יום מראש. דמי ההקמה לא מוחזרים.</dd>
     <dt><b>זה מחליף את העורך?</b></dt><dd>לא. המערכת מכינה טיוטה, והעורך שלכם בודק ומאשר. הוא חוסך את רוב שעות הכתיבה.</dd></dl></div></div>
   <div class="card"><div class="hd"><h3>הפרטים שלי (מופיעים בהצעות, בחוזים ובקבלות)</h3><button class="btn sm" data-act="editBiz">עריכה</button></div><dl class="dl"><dt>שם העסק</dt><dd>${esc(SET.businessName||'—')}</dd><dt>השם שלי</dt><dd>${esc(SET.ownerName||'—')}</dd><dt>מספר עוסק</dt><dd>${esc(SET.businessId||'—')}</dd><dt>מייל</dt><dd class="link-url">${esc(SET.businessEmail||'—')}</dd><dt>טלפון</dt><dd>${esc(SET.phone||'—')}</dd></dl></div></div>`;};
ACT.editBiz=()=>{const f=[['businessName','שם העסק'],['ownerName','השם שלי'],['businessId','מספר עוסק'],['businessEmail','מייל'],['phone','טלפון']];
  const m=modal('עריכת הפרטים שלי',`<div class="form">${f.map(([k,l])=>`<label class="f">${l}<input type="${k==='businessEmail'?'email':k==='phone'?'tel':'text'}" id="eb-${k}" value="${esc(SET[k]||'')}" ${k==='businessEmail'?'dir="ltr"':''}></label>`).join('')}</div>`,{foot:`<span></span><span class="row"><button class="btn" data-close>ביטול</button><button class="btn pri" id="eb-go">שמירה</button></span>`});
  m.querySelector('#eb-go').onclick=async()=>{const p={};for(const[k]of f)p[k]=m.querySelector('#eb-'+k).value.trim();await saveSettings(p);m.close();toast('נשמר','good');};};

function linksGroups(){const sys=all('systems');const groups=[];
  const mine=sys.filter(s=>s.mine||(!s.client&&!s.community));if(mine.length)groups.push({title:'המערכות שלי',sub:'',items:mine});
  for(const c of all('communities').sort((a,b)=>a.name.localeCompare(b.name,'he'))){const cl=clientsOfCommunity(c.id).map(x=>x.id);const it=sys.filter(s=>!s.mine&&(s.community===c.id||(cl.includes(s.client)&&!s.community)));if(it.length||c.url)groups.push({title:c.name,sub:'חסידות / קהילה',items:it,url:c.url,cid:c.id});}
  const used=new Set(groups.flatMap(g=>g.items.map(s=>s.id)));
  const byClient=new Map();for(const s of sys.filter(s=>!used.has(s.id))){const k=s.client||'';(byClient.get(k)||byClient.set(k,[]).get(k)).push(s);}
  for(const[k,it]of byClient)groups.push({title:k?refName('clients',k):'ללא שיוך',sub:k?'לקוח':'',items:it});
  return groups;}
PAGES.links=()=>{const st=UI.links??={q:''};const q=st.q.toLowerCase();let groups=linksGroups();
  if(q)groups=groups.map(g=>({...g,items:g.items.filter(s=>[g.title,s.name,s.url,s.adminUrl,s.localPath,s.links,s.repo,refName('products',s.product),refName('clients',s.client)].join(' ').toLowerCase().includes(q))})).filter(g=>g.items.length);
  const prods=all('products').filter(p=>p.url);
  return `<div class="stack"><div class="toolbar"><input class="grow" type="search" id="lnkQ" data-ui="links.q" data-live placeholder="חיפוש חסידות, לקוח או מערכת…" value="${esc(st.q)}" aria-label="חיפוש"><button class="btn gold" data-act="orgImport">הוספת חסידות מקוד של ביאלה</button><button class="btn" data-act="ghSync">🔄 סנכרון מ-GitHub</button><button class="btn" data-act="linksFile">הורדת כל הקישורים כקובץ אחד</button><button class="btn pri" data-act="add" data-col="systems">+ הוספת מערכת</button></div>
   ${prods.length?`<div class="card"><h3 style="margin-bottom:6px">המוצרים שלי</h3>${prods.map(p=>`<div class="li"><span><b>${esc(p.name)}</b>${demoPill(p)} ${pill(p.status)}</span><a class="link-url" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.url)}</a></div>`).join('')}</div>`:''}
   ${groups.length?groups.map(g=>`<div class="card"><div class="hd"><h3>${esc(g.title)} ${g.sub?`<span class="muted small" style="font-weight:400">· ${esc(g.sub)}</span>`:''}</h3><span class="muted small">${g.items.length} מערכות</span></div>${g.cid?`<div class="li" style="background:var(--brass-soft);border-radius:8px;padding:8px 10px;border:0;margin-bottom:4px"><b>הקישור של החסידות</b><span class="row">${g.url?`<a class="link-url" href="${esc(g.url)}" target="_blank" rel="noopener">${esc(g.url.replace(/^https?:\/\//,''))}</a><button class="btn sm ghost" data-act="copyLink" data-u="${esc(g.url)}" aria-label="העתקה">⧉</button>`:'<span class="muted small">עוד לא הוזן</span>'}<button class="btn sm ghost" data-act="open" data-col="communities" data-id="${esc(g.cid)}" aria-label="עריכה">✎</button></span></div>`:''}${g.items.map(s=>`<div class="li"><div class="t"><b>${esc(s.name)}</b>${demoPill(s)} ${s.active==='מושבת'?pill('מושבת'):''}<div class="muted small">${[s.product?'מוצר: '+refName('products',s.product):'',s.client&&g.sub!=='לקוח'?'לקוח: '+refName('clients',s.client):'',s.adminEmail?'מנהל: '+s.adminEmail:''].filter(Boolean).map(esc).join(' · ')}</div></div>
     <div class="row" style="justify-content:flex-end;flex-wrap:wrap;gap:6px">${sysLinksHtml(s)}<button class="btn sm ghost" data-act="open" data-col="systems" data-id="${esc(s.id)}" aria-label="עריכה">✎</button></div></div>`).join('')}</div>`).join(''):`<div class="card empty"><b>${q?'לא נמצאו קישורים':'עוד אין כאן קישורים'}</b>${q?'נסה חיפוש אחר.':'כל מערכת שתוסיף (עם החסידות או הלקוח שלה והקישור) תופיע כאן, מסודרת לפי חסידות ולקוח. מערכת שסימנת "שלי" תופיע בראש.'}</div>`}</div>`;};
ACT.linksFile=()=>{const groups=linksGroups();const prods=all('products').filter(p=>p.url);

   ${groups.map(g=>`<h2>${esc(g.title)}</h2>${g.url?`<p>הקישור של החסידות: <a href="${esc(g.url)}">${esc(g.url)}</a></p>`:''}<ul>${g.items.map(s=>`<li><b>${esc(s.name)}</b>${s.product?' ('+esc(refName('products',s.product))+')':''}${s.url?` – <a href="${esc(s.url)}">${esc(s.url)}</a>`:''}${s.adminUrl?` · <a href="${esc(s.adminUrl)}">קישור נוסף</a>`:''}${s.localPath?` · במחשב: ${esc(s.localPath)}`:''}${s.active==='מושבת'?' – <i>מושבת</i>':''}</li>`).join('')}</ul>`).join('')}`;

ACT.orgImport=()=>{const m=modal('הוספת חסידות מקוד של ביאלה',`<p class="muted small" style="margin-top:0">בביאלה, אחרי שפותחים חסידות חדשה, לוחצים על "העתקה ל-CRM" ומדביקים כאן. אפשר להדביק כמה קודים בבת אחת, אחד בכל שורה.</p><textarea id="oiText" style="min-height:140px;direction:ltr" placeholder="CRM-ORG:{...}"></textarea><p id="oiMsg" class="small" hidden></p>`,{foot:`<span></span><span class="row"><button class="btn" data-close>ביטול</button><button class="btn pri" id="oiGo">הוספה</button></span>`});
  m.querySelector('#oiGo').onclick=async()=>{const lines=m.querySelector('#oiText').value.split('\n').map(s=>s.trim()).filter(Boolean);const msg=m.querySelector('#oiMsg');const orgs=[];
    for(const ln of lines){const i=ln.indexOf('{');if(!ln.startsWith('CRM-ORG:')||i<0)continue;try{const o=JSON.parse(ln.slice(i));if(o&&o.name)orgs.push(o);}catch(e){}}
    if(!orgs.length){msg.hidden=false;msg.style.color='var(--bad)';msg.textContent='לא נמצא קוד תקין. הקוד צריך להתחיל ב-CRM-ORG:';return;}
    const b=m.querySelector('#oiGo');b.disabled=true;let added=0,updated=0;
    try{let prod=all('products').find(p=>p.name.startsWith('ביאלה'));
      for(const o of orgs){const nm=String(o.name).trim();const url=String(o.url||'').trim();
        let c=all('communities').find(x=>x.name.trim()===nm);
        if(c){c=await put('communities',{...c,url:url||c.url||'',city:c.city||o.city||'',status:c.status==='יעד'||c.status==='בתהליך'?'משתמשים':c.status});updated++;}
        else{c=await put('communities',{name:nm,city:o.city||'',url,status:'משתמשים',fromCode:true});added++;}
        let cl=all('clients').find(x=>x.community===c.id);
        if(!cl)cl=await put('clients',{name:'חסידות '+nm,kind:'חסידות / מוסד',community:c.id,channel:'חסידויות',status:'פעיל',rewardStatus:'אין',email:o.adminEmail||''});
        const sname=(o.product||'ביאלה')+' – '+nm;let s=all('systems').find(x=>x.community===c.id&&(x.product===prod?.id||x.name===sname));
        const sd={name:sname,community:c.id,client:cl.id,product:prod?.id||'',url,adminEmail:o.adminEmail||'',active:o.active===false?'מושבת':'פעיל'};
        if(s)await put('systems',{...s,...sd,notes:s.notes==='להשלים קישור'&&url?'':s.notes});else await put('systems',{...sd,netfree:'לא נשלח',uptime:'לא נבדק'});}
      m.close();toast(`נוספו ${added} חסידויות${updated?`, עודכנו ${updated}`:''}`,'good');}catch(e){b.disabled=false;}};};

PAGES.systems=()=>{const tb=R.tab||'systems';const head=tabs([['systems','מערכות (כרטיס טכני)'],['products','מוצרים'],['netfree','אישורי NetFree'],['renewals','מועדי חידוש'],['changelog','יומן גרסאות'],['tickets','תקלות ובקשות'],['quota','מכסות'],['uptime','בדיקת זמינות']],tb,'systems');

    <div class="kpis" style="margin-bottom:12px">${['לא נשלח','נשלח','אושר בנטפרי','נדחה בנטפרי'].map(s=>kpi(s,sys.filter(x=>(x.netfree||'לא נשלח')===s).length)).join('')}</div>`+listView('systems',{key:'nf',cols:['name','netfree','netfreeDate','netfreeDomains','client'],filters:['netfree'],tools:`<button class="btn" data-act="nfText">נוסח בקשה ל-NetFree</button>`});}
  if(tb==='renewals')return head+listView('renewals',{empty:['אין מועדי חידוש','רשום כאן דומיינים, מנויים לשירותים ותוקף מפתחות – תקבל התראה חודש לפני.']});
  if(tb==='changelog')return head+listView('changelog',{tools:`<button class="btn" data-act="whatsNew">נוסח "מה חדש" ללקוח</button>`,empty:['אין עדכוני גרסה','אחרי כל עדכון למערכת של לקוח, רשום מה השתנה.']});
  if(tb==='tickets')return head+`<p class="muted small" style="margin-top:0">תקלות ובקשות שירות מכל המערכות. כפתור "דיווח על תקלה" בתוך המערכות של הלקוחות עוד לא מחובר לכאן, ולכן כרגע מזינים ידנית מה שמגיע במייל או בצ׳אט.</p>`+listView('tickets',{empty:['אין תקלות פתוחות','כל דיווח מלקוח נרשם כאן עד שמטפלים בו.']});
  if(tb==='quota'){const sys=all('systems').filter(s=>s.quotaName||num(s.quotaLimit));return head+`<p class="muted small" style="margin-top:0">מכסות כמו דקות תמלול לכל חסידות או מגבלות חינם של שירותים. מעדכנים ידנית; מעל 80% מתקבלת התראה.</p>`+(sys.length?`<div class="stack">${sys.map(s=>{const p=num(s.quotaLimit)?num(s.quotaUsed)/num(s.quotaLimit):0;return `<div class="card" style="cursor:pointer" data-act="open" data-col="systems" data-id="${esc(s.id)}"><div class="row between"><b>${esc(s.name)} – ${esc(s.quotaName||'מכסה')}</b><span class="num">${num(s.quotaUsed)} / ${num(s.quotaLimit)||'—'}</span></div><div class="bar" style="margin-top:6px"><i style="width:${Math.min(100,p*100)}%;background:${p>=0.8?'var(--bad)':'var(--brass)'}"></i></div></div>`;}).join('')}</div>`:'<div class="card empty"><b>לא מוגדרות מכסות</b>בכרטיס של מערכת אפשר למלא "מכסה למעקב", כמה נוצל ומה המגבלה.</div>');}
  if(tb==='uptime'){const sys=all('systems').filter(s=>s.url&&s.active!=='מושבת');return head+`<div class="banner info" style="margin-bottom:12px"><span>בדיקה אוטומטית יומית של כל האתרים עוד לא מופעלת: הדף הזה לא יכול לפנות בעצמו לאתרים אחרים. אפשר להגדיר משימה מתוזמנת שתבדוק כל יום ותעדכן כאן – בקש את זה ממני בשיחה. בינתיים: פתח את הקישור וסמן את התוצאה.</span></div>`+

  return head+listView('systems',{empty:['אין מערכות','לכל מערכת שמסרת: קישור, מאגר, פרויקט Firebase, מייל מנהל ואיפה שמורים המפתחות (בלי המפתחות עצמם).']});};

function aiErr(e){const c=e&&e.code;return({gemini_key:'מפתח ג׳מיני לא תקין – בדוק אותו בהגדרות ← חיבורים. ('+(e?.message||'')+')',gemini_http:'ג׳מיני לא ענה: '+(e?.message||''),no_ai:'אין חיבור לבינה מלאכותית – הכנס מפתח ג׳מיני בהגדרות ← חיבורים.',not_granted:'לא ניתנה הרשאה להשתמש ב-AI בדף הזה.',rate_limited:'יותר מדי בקשות. המתן דקה ונסה שוב.',usage_limit:'נגמרה מכסת השימוש ב-Claude כרגע.',empty_completion:'לא התקבלה תשובה. נסה לנסח אחרת.',aborted:'הבקשה בוטלה.'})[c]||('הבקשה ל-AI נכשלה'+(e?.message?': '+e.message:''));}
function bizContext(){const P=all('projects').map(p=>{const f=projFin(p);return{שם:p.name,לקוח:refName('clients',p.client),מוצר:refName('products',p.product)||'מותאם',שלב:p.stage,מחיר_שסוכם:num(p.price),תוספות_שאושרו:f.approvedAdds,תוספות_ממתינות:f.pendingAdds,התקבל:f.paid,יתרה:f.balance,הוצאות_ישירות:f.exp,שעות:+f.hours.toFixed(1),התחלה:p.startDate,מסירה:p.dueDate,תיאור:(p.description||'').slice(0,160),היקף:(p.scope||'').slice(0,200),דוגמה:!!p.demo};});
  const C=all('campaigns').map(c=>({שם:c.name,ערוץ:c.channel,תקציב:num(c.budget),סטטוס:c.status,...campaignStats(c)}));
  const CH=SET.channels.map(ch=>({ערוץ:ch,...channelStats(ch)}));
  const comps=all('components').map(c=>({שם:c.name,שעות:num(c.hours),מחיר_בסיס:num(c.price),היסטוריה:compHistory(c.id)}));
  const L=all('leads').slice(-40).map(l=>({ערוץ:l.channel,סטטוס:l.status,צורך:(l.need||'').slice(0,100)}));
  const fy=finance(periodRange('year')),fm=finance(periodRange('month'));
  return JSON.stringify({היום:todayISO(),תעריף_שעה_בהגדרות:num(SET.hourlyRate),פרויקטים:P,קמפיינים:C,ערוצים:CH,רכיבים:comps,פניות_אחרונות:L,כספים_השנה:fy,כספים_החודש:fm,הכנסה_חודשית_קבועה:mrr(),מנויים:all('subscriptions').map(s=>({שם:s.name,חודשי:num(s.monthly),סטטוס:s.status})),הוצאות_קבועות:all('fixed').map(f=>({שם:f.name,חודשי:num(f.monthly)}))}).slice(0,60000);}
const ADV_INSTR=`אתה "היועץ העסקי" במערכת CRM של בעל עסק עצמאי שבונה אפליקציות ומערכות מותאמות ללקוחות (בעיקר בציבור החרדי, כולל חסידויות), ומוכר גם מוצרים כמו מערכות תמלול. ענה בעברית בלבד, בשפה נקייה ומכובדת, קצר ומעשי.
כללים מחייבים:
1. הפרד תמיד בין "מה שמופיע בנתונים במערכת" לבין "הנחות או הערכות שלי". השתמש בכותרות קצרות: "מהנתונים במערכת:" ו"הנחות והערכות:".
2. אם אין מספיק נתונים כדי לענות – אמור זאת במפורש ושאל שאלה אחת ממוקדת שתעזור. אל תמציא מספרים.
3. אל תציג הערכה כעובדה. ציין טווחים כשאתה מעריך.
4. אתה לא יכול לשנות נתונים, לשמור או לשלוח הודעות. אם אתה מציע שינוי, הצעת מחיר או הודעה ללקוח – הצג טיוטה ואמור שהיא תיכנס למערכת רק אחרי שבעל העסק יאשר ויזין אותה בעצמו.
5. רשומות שמסומנות "דוגמה": true הן נתוני הדגמה ולא נתונים אמיתיים – ציין זאת אם הן משפיעות על התשובה.
6. כל הסכומים בשקלים, לפני מס. אל תיתן ייעוץ מס או ייעוץ משפטי.
פורמט: טקסט רגיל, אפשר נקודות עם "- " ומודגש עם **.`;
function mdLite(s){const lines=esc(s).split('\n');let out='',inUl=false;for(let ln of lines){ln=ln.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  if(/^\s*[-•*] /.test(ln)){if(!inUl){out+='<ul>';inUl=true;}out+='<li>'+ln.replace(/^\s*[-•*] /,'')+'</li>';continue;}if(inUl){out+='</ul>';inUl=false;}
  if(/^#{1,4} /.test(ln))out+='<h4>'+ln.replace(/^#{1,4} /,'')+'</h4>';else if(ln.trim())out+='<p style="margin:4px 0">'+ln+'</p>';}
  if(inUl)out+='</ul>';return out;}
const ADV={msgs:[],busy:false,ctl:null};
PAGES.advisor=()=>{if(!aiReady())return aiMissing('היועץ העסקי');
  return `<div class="stack" style="max-width:900px"><div class="banner info"><span>היועץ רואה את הנתונים שבמערכת (פרויקטים, שעות, הוצאות, קמפיינים) ומבחין בין נתונים להנחות. הוא לא משנה שום דבר במערכת ולא שולח הודעות – כל שינוי עובר דרכך.</span></div>
   <div class="chat" id="advChat">${ADV.msgs.length?ADV.msgs.map((m,i)=>`<div class="msg ${m.role==='user'?'u':'a'}">${m.role==='user'?esc(m.content):mdLite(m.content)}${m.role==='assistant'&&m.content&&!ADV.busy?`<div class="row" style="margin-top:6px"><button class="btn sm ghost" data-act="advCopy" data-i="${i}">העתקה</button><button class="btn sm ghost" data-act="advNote" data-i="${i}">שמירה כהערה בפרויקט…</button></div>`:''}</div>`).join(''):`<div class="card"><h3 style="margin-bottom:8px">אפשר לשאול למשל:</h3><div class="chips">${['כמה כדאי לי לתמחר פרויקט כזה?','כמה שעות לקח לי בממוצע פרויקט דומה?','כמה נשאר לי בכל פרויקט אחרי ההוצאות שרשמתי?','איזה ערוץ הביא לקוחות משלמים?','מה כדאי לי לברר לפני שליחת הצעת מחיר?','על מה אני מרוויח הכי טוב לשעה?'].map(q=>`<button class="chip" data-act="advAsk" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div></div>`}</div>
   <div class="card" style="position:sticky;bottom:calc(70px + env(safe-area-inset-bottom,0px))"><div class="row" style="align-items:flex-end;flex-wrap:nowrap"><textarea id="advIn" placeholder="כתוב שאלה…" style="min-height:52px;flex:1" aria-label="שאלה ליועץ"></textarea>${ADV.busy?'<button class="btn danger" data-act="advStop">עצירה</button>':'<button class="btn pri" data-act="advSend">שליחה</button>'}</div>${ADV.msgs.length&&!ADV.busy?'<button class="btn sm ghost" data-act="advClear" style="margin-top:6px">שיחה חדשה</button>':''}</div></div>`;};

ACT.advStop=()=>{ADV.ctl?.abort();};

ACT.advNote=d=>{const ps=all('projects');if(!ps.length){toast('אין פרויקטים');return;}const m=modal('שמירת התשובה כהערה',`<label class="f">לאיזה פרויקט?<select id="anP">${ps.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select></label>`,{foot:`<span></span><span class="row"><button class="btn" data-close>ביטול</button><button class="btn pri" id="anGo">שמירה</button></span>`});
  m.querySelector('#anGo').onclick=async()=>{await put('notes',{project:m.querySelector('#anP').value,kind:'הערה',date:todayISO(),text:'מהיועץ העסקי:\n'+ADV.msgs[+d.i].content});m.close();toast('נשמר','good');};};
ACT.advSend=async()=>{const q=$('#advIn')?.value.trim();if(!q||ADV.busy)return;ADV.msgs.push({role:'user',content:q},{role:'assistant',content:''});ADV.busy=true;render();
  const ctx=bizContext();const msgs=ADV.msgs.slice(0,-1).map((m,i)=>i===0?{role:'user',content:ADV_INSTR+'\n\nנתוני המערכת (JSON):\n'+ctx+'\n\nהשאלה: '+m.content}:m);
  if(msgs.length>1)msgs[msgs.length-1]={role:'user',content:'נתוני המערכת העדכניים (JSON):\n'+ctx+'\n\nהשאלה: '+q};
  const last=ADV.msgs[ADV.msgs.length-1];ADV.ctl=new AbortController();
  const paint=()=>{const nodes=$$('#advChat .msg.a');const el=nodes[nodes.length-1];if(el)el.innerHTML=last.content?mdLite(last.content):'<span class="loading"></span> חושב…';};AFTER.push(paint);
  try{const r=await aiCall(msgs,{signal:ADV.ctl.signal,onText:({text})=>{last.content=text;paint();}});last.content=r.text;}
  catch(e){last.content=(e&&e.text?e.text+'\n\n':'')+'⚠ '+aiErr(e);}
  ADV.busy=false;ADV.ctl=null;render();};

  if(SIDE.rec){const r=SIDE.rec;r.stopping=true;try{r.sr&&r.sr.stop();}catch(e){}try{r.mr.state!=='inactive'&&r.mr.stop();}catch(e){}return;}
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast('ההקלטה לא נתמכת כאן. פתח את העותק שבמחשב (CRM-במחשב.html) בכרום.','bad');return;}
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){if(window.top!==window){SIDE.micBlocked=true;renderSide();setTimeout(()=>$('#sideIn')?.focus(),30);}else toast('אין גישה למיקרופון. אשר גישה למיקרופון בדפדפן.','bad');return;}
  const chunks=[],mr=new MediaRecorder(stream),rec={mr,stream,chunks,text:'',sr:null};SIDE.rec=rec;

  if(SR){try{const sr=new SR();sr.lang='he-IL';sr.continuous=true;sr.interimResults=true;let fin='';
    sr.onresult=e=>{let inter='';for(let k=e.resultIndex;k<e.results.length;k++){const t=e.results[k][0].transcript;if(e.results[k].isFinal)fin+=t+' ';else inter+=t;}rec.text=(fin+inter).trim();const inp=$('#sideIn');if(inp)inp.value=rec.text;};
    sr.onerror=()=>{};sr.onend=()=>{if(!rec.stopping&&SIDE.rec===rec){try{sr.start();}catch(e){}}};sr.start();rec.sr=sr;}catch(e){}}
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  mr.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());SIDE.rec=null;const blob=new Blob(chunks,{type:mr.mimeType||'audio/webm'});const url=URL.createObjectURL(blob);
    renderSide();const inp=$('#sideIn');let text=(rec.text||'').trim();
    if(SET.geminiKey&&blob.size>2000){if(inp)inp.value=(text?text+' ':'')+'⏳ מתמלל…';try{const g=await geminiTranscribe(blob);if(g)text=g;}catch(e){if(!text)toast(e.message,'bad');}}
    if(inp)inp.value=text;
    if(!text){toast('לא זוהה דיבור. אפשר להקליד, או להוסיף מפתח ג׳מיני בהגדרות לתמלול מדויק יותר.','bad');SIDE.msgs.push({role:'user',content:'(הקלטה בלי טקסט)',audio:url});renderSide();return;}
    ACT.sideSend(null,url);};
  mr.start();renderSide();setTimeout(()=>$('#sideIn')?.focus(),30);};
ACT.sideSpeak=d=>{const i=+d.i;if(!('speechSynthesis' in window)){toast('השמעה לא נתמכת בדפדפן הזה','bad');return;}

  const v=speechSynthesis.getVoices().find(v=>/^he|iw/i.test(v.lang));if(v)u.voice=v;else toast('לא נמצא קול עברי במחשב – ההשמעה עלולה להישמע לא טוב','bad');

async function boot(){
  try{const p=localStorage.getItem('crm-page');if(p&&PAGES[p]&&!PARENT[p])R.page=p;}catch(e){}
  const C=window.claude;
  if(!C||!C.use){MODE='local';lsLoad();render();return;}
  render();
  const [dbx,ax,sx,dx,mx]=await Promise.all([C.use('db'),C.use('assets').catch(()=>null),C.use('sample').catch(()=>null),C.use('downloads').catch(()=>null),C.use('mcp').catch(()=>null)]);mcpApi=mx;
  assetsApi=ax;sampleApi=sx;downloadsApi=dx;
  if(!dbx){MODE='local';lsLoad();render();return;}
  db=dbx;MODE='db';
  const onErr=e=>{if(e&&e.code==='revoked'){toast('הגישה למאגר הופסקה. רענן את הדף.','bad');}else toast('בעיה בטעינת נתונים: '+errMsg(e),'bad');};
  for(const c of COLS){db.collection(c).onSnapshot(snap=>{S[c]=new Map(snap.docs.map(d=>[d.id,{...d.data(),id:d.id}]));loaded.add(c);scheduleRender();},onErr);}
  db.doc('meta/offer').onSnapshot(s=>{OFFER=s.exists?s.data():null;scheduleRender();},()=>{});
  db.collection('settings').onSnapshot(snap=>{for(const d of snap.docs){if(d.id==='main')SET={...DEFAULT_SETTINGS,...d.data()};if(d.id==='timer'){const t=d.data();TIMER=t&&t.start?t:null;}}scheduleRender();},onErr);
}

const FU={busy:false};
async function fuCheck(manual){if(FU.busy)return;const tr=fuTransport();const watch=all('leads').filter(l=>l.followSentAt&&l.followStatus!=='התקבלו חומרים');if(!tr||!watch.length){if(manual)toast(tr?'אין מיילי המשך שממתינים לתשובה':'אין חיבור לבדיקת תשובות','bad');return;}
  FU.busy=true;let n=0;
  try{if(tr==='gas'){const r=await gasCall('updates');for(const it of r.items||[]){const l=get('leads',it.leadId);if(!l||!it.replyAt)continue;if(l.replyAt===it.replyAt&&l.followStatus===it.status)continue;await fuApply(l,it.status,it.replyAt,it.snippet);n++;}}
    else{for(const l of watch){if(!l.followThreadId)continue;const tr2=await mcpApi.callTool('Gmail','get_thread',{threadId:l.followThreadId,messageFormat:'PLAIN_TEXT'},{cache:false});const em=fuClean(l.email),since=new Date(l.followSentAt).getTime();
        const rep=(tr2?.payload?.messages||[]).filter(x=>fuClean(x.sender).includes(em)&&new Date(x.date).getTime()>since);if(!rep.length)continue;const last=rep[rep.length-1];
        const mat=rep.some(x=>/jumbomail/i.test(x.plaintextBody||'')||(x.attachments||[]).length||(x.attachmentIds||[]).length);const st=mat?'התקבלו חומרים':'ענה';
        if(l.replyAt===last.date&&l.followStatus===st)continue;await fuApply(l,st,last.date,(last.plaintextBody||last.snippet||'').replace(/\s+/g,' ').slice(0,200));n++;}}
    if(n)toast(`📨 ${n===1?'לקוח ענה':n+' לקוחות ענו'} למייל ההמשך`,'good');else if(manual)toast('עוד אין תשובות חדשות');}
  catch(e){if(manual)toast('הבדיקה נכשלה: '+(e?.message||''),'bad');}finally{FU.busy=false;}}
async function fuApply(l,st,at,snip){await put('leads',{...l,followStatus:st,replyAt:at,replySnippet:snip||'',followSeen:false});
  await put('notes',{lead:l.id,kind:'הערה',date:todayISO(),text:`${st==='התקבלו חומרים'?'הלקוח שלח חומרים':'הלקוח ענה'} (${plainDate(String(at).slice(0,10))}): ${snip||''}`});}

const _leadPage=PAGES.lead;
PAGES.lead=()=>{const l=get('leads',R.id);let h=_leadPage();if(!l)return h;
  if(l.followSentAt&&l.followSeen===false)setTimeout(()=>put('leads',{...get('leads',l.id),followSeen:true}),400);
  const st=l.followStatus,cls=st==='התקבלו חומרים'?'good':st==='ענה'?'info':'warn';
  const card=`<div class="card"><div class="row between"><div><b>📞 שיחת טלפון ומייל המשך</b>${st?` <span class="pill ${cls}">${esc(st)}</span>`:''}
    <div class="muted small">${l.followSentAt?`נשלח מייל המשך ב-${plainDate(l.followSentAt.slice(0,10))}`:'אחרי שיחה – המערכת מכינה מייל המשך, ואתה מאשר לפני שליחה.'}${l.replyAt?` · הלקוח ענה ב-${plainDate(String(l.replyAt).slice(0,10))}`:''}</div>
    ${l.replySnippet?`<div class="small" style="margin-top:4px;background:var(--soft,#f6f6f6);padding:6px 8px;border-radius:8px">"${esc(l.replySnippet)}"</div>`:''}</div>
    <span class="row" style="gap:6px">${l.followSentAt&&fuTransport()?'<button class="btn sm ghost" data-act="fuCheck">בדיקת תשובה</button>':''}<button class="btn gold" data-act="fuOpen" data-id="${esc(l.id)}">📞 דיברתי איתו בטלפון</button></span></div></div>`;
  return h.replace('<div class="stack">','<div class="stack">'+card);};
const _alerts=computeAlerts;
computeAlerts=function(){const A=_alerts();for(const l of all('leads').filter(l=>l.followSentAt&&l.followSeen===false&&l.replyAt))A.unshift({lvl:'info',text:`📨 ${l.name||l.org} ${l.followStatus==='התקבלו חומרים'?'שלח חומרים':'ענה'} למייל ההמשך`,page:'lead',id:l.id});return A;};

const GAS_CODE="/**\n * דברי קודש – האוטומציה של ה-CRM. רץ בתוך Google Apps Script של המייל העסקי (bnyytmrkwt@gmail.com).\n * כל שעה: בודק אם לקוחות ענו למיילי המשך, קולט קבלות מהמייל להוצאות, ומדווח ל-CRM.\n * כל יום: שומר גיבוי של ה-CRM בענן.\n * שום מייל לא יוצא בלי בקשה מה-CRM, והסקריפט אף פעם לא עונה ללקוח לבד.\n */\n\nvar SB_URL = 'https://afmxylpcwqydjgiewewc.supabase.co';\nvar SB_KEY = 'sb_publishable_4S8OmERqXFNnc6zI1twl8A_zJbIrxl9';\n\nvar PROPS = PropertiesService.getScriptProperties();\n\n/** הפעלה ראשונה: מריצים פעם אחת מתוך העורך (כפתור \"הפעלה\"). יוצר מפתח סודי, הרצה כל שעה וגיבוי כל לילה. */\nfunction setup() {\n  if (!PROPS.getProperty('KEY')) {\n    PROPS.setProperty('KEY', Utilities.getUuid().replace(/-/g, '').slice(0, 24));\n  }\n  ScriptApp.getProjectTriggers().forEach(function (t) {\n    if (['checkReplies', 'hourly', 'daily'].indexOf(t.getHandlerFunction()) >= 0) ScriptApp.deleteTrigger(t);\n  });\n  ScriptApp.newTrigger('hourly').timeBased().everyHours(1).create();\n  ScriptApp.newTrigger('daily').timeBased().everyDays(1).atHour(3).create();\n  Logger.log('המפתח הסודי שלך (להדביק ב-CRM): ' + PROPS.getProperty('KEY'));\n}\n\n/** מציג שוב את המפתח, אם צריך. */\nfunction showKey() { Logger.log('המפתח הסודי: ' + PROPS.getProperty('KEY')); }\n\nfunction doPost(e) {\n  var req = {};\n  try { req = JSON.parse(e.postData.contents || '{}'); } catch (err) { return out({ ok: false, error: 'בקשה לא תקינה' }); }\n  if (!req.key || req.key !== PROPS.getProperty('KEY')) return out({ ok: false, error: 'מפתח שגוי' });\n  try {\n    if (req.action === 'ping') return out({ ok: true, email: Session.getActiveUser().getEmail() });\n    if (req.action === 'send') return out(sendFollowup(req));\n    if (req.action === 'updates') { checkReplies(); return out({ ok: true, items: getWatch() }); }\n    if (req.action === 'run') return out(hourly());\n    return out({ ok: false, error: 'פעולה לא מוכרת' });\n  } catch (err) {\n    return out({ ok: false, error: String(err && err.message || err) });\n  }\n}\n\nfunction doGet() { return out({ ok: true, service: 'divrei-kodesh-crm' }); }\n\nfunction out(o) {\n  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n}\n\n/** ניקוי כתובת מייל: תווים נסתרים, רווחים, אותיות גדולות. */\nfunction cleanEmail(s) {\n  return String(s || '').replace(/[​-‏‪-‮⁠-⁩﻿\\s]/g, '').toLowerCase();\n}\n\nfunction myEmail() { return cleanEmail(Session.getEffectiveUser().getEmail()); }\n\nfunction sendFollowup(req) {\n  var to = cleanEmail(req.to);\n  if (!/^[^@]+@[^@]+\\.[^@]+$/.test(to)) return { ok: false, error: 'כתובת מייל לא תקינה: ' + to };\n  var body = String(req.body || '').trim();\n  if (!body) return { ok: false, error: 'המייל ריק' };\n  var html = '<div dir=\"rtl\" style=\"font-family:Arial,sans-serif;font-size:15px;line-height:1.7;text-align:right\">' +\n    body.split(/\\n/).map(function (l) { return l ? escapeHtml(l) : '&nbsp;'; }).join('<br>') + '</div>';\n\n  var threads = GmailApp.search('from:' + to + ' OR to:' + to, 0, 1);\n  var mode, threadId;\n  if (threads.length) {\n    var thread = threads[0], msgs = thread.getMessages(), fromClient = null;\n    for (var i = msgs.length - 1; i >= 0; i--) {\n      if (cleanEmail(msgs[i].getFrom()).indexOf(to) >= 0) { fromClient = msgs[i]; break; }\n    }\n    if (fromClient) fromClient.reply(body, { htmlBody: html });\n    else msgs[msgs.length - 1].replyAll(body, { htmlBody: html });\n    mode = 'reply'; threadId = thread.getId();\n  } else {\n    var subject = String(req.subject || 'בהמשך לשיחתנו').trim();\n    GmailApp.sendEmail(to, subject, body, { htmlBody: html, name: 'דברי קודש' });\n    Utilities.sleep(1500);\n    var t = GmailApp.search('to:' + to + ' in:sent', 0, 1);\n    threadId = t.length ? t[0].getId() : '';\n    mode = 'new';\n  }\n  var w = getWatchMap();\n  w[req.leadId || to] = { leadId: req.leadId || '', email: to, threadId: threadId, sentAt: new Date().toISOString(), status: 'ממתין לחומרים', replyAt: '', snippet: '' };\n  saveWatch(w);\n  return { ok: true, mode: mode, threadId: threadId };\n}\n\n/** פעם בשעה: בודק אם הלקוח ענה בשרשרת שבה שלחנו. רק קריאה – לא שולח כלום. */\nfunction checkReplies() {\n  var w = getWatchMap(), me = myEmail(), changed = false;\n  Object.keys(w).forEach(function (k) {\n    var it = w[k];\n    if (!it.threadId) return;\n    var th;\n    try { th = GmailApp.getThreadById(it.threadId); } catch (e) { return; }\n    if (!th) return;\n    var sent = new Date(it.sentAt).getTime(), last = null, gotMaterial = false;\n    th.getMessages().forEach(function (m) {\n      var from = cleanEmail(m.getFrom());\n      if (from.indexOf(me) >= 0 || m.getDate().getTime() <= sent) return;\n      if (from.indexOf(it.email) < 0) return;\n      last = m;\n      var txt = m.getPlainBody() || '';\n      if (/jumbomail/i.test(txt) || m.getAttachments().length) gotMaterial = true;\n    });\n    if (last) {\n      var st = gotMaterial ? 'התקבלו חומרים' : 'ענה';\n      if (it.status !== st || it.replyAt !== last.getDate().toISOString()) {\n        it.status = (it.status === 'התקבלו חומרים') ? it.status : st;\n        it.replyAt = last.getDate().toISOString();\n        it.snippet = (last.getPlainBody() || '').replace(/\\s+/g, ' ').trim().slice(0, 200);\n        changed = true;\n      }\n    }\n  });\n  if (changed) saveWatch(w);\n}\n\nfunction getWatchMap() { try { return JSON.parse(PROPS.getProperty('WATCH') || '{}'); } catch (e) { return {}; } }\nfunction saveWatch(w) {\n  var keys = Object.keys(w);\n  if (keys.length > 150) {\n    keys.sort(function (a, b) { return String(w[a].sentAt).localeCompare(String(w[b].sentAt)); });\n    keys.slice(0, keys.length - 150).forEach(function (k) { delete w[k]; });\n  }\n  PROPS.setProperty('WATCH', JSON.stringify(w));\n}\nfunction getWatch() { var w = getWatchMap(); return Object.keys(w).map(function (k) { return w[k]; }); }\n\nfunction escapeHtml(s) {\n  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;');\n}\n\n/* ======================= חיבור ל-CRM בענן ======================= */\nfunction crm(fn, args) {\n  var r = UrlFetchApp.fetch(SB_URL + '/rest/v1/rpc/' + fn, {\n    method: 'post', contentType: 'application/json', muteHttpExceptions: true,\n    headers: { apikey: SB_KEY }, payload: JSON.stringify(args)\n  });\n  if (r.getResponseCode() >= 300) throw new Error(fn + ': ' + r.getContentText().slice(0, 300));\n  var t = r.getContentText();\n  return t ? JSON.parse(t) : null;\n}\nfunction crmPut(col, id, data, mustExist) {\n  return crm('crm_ingest', { p_key: PROPS.getProperty('KEY'), p_col: col, p_id: id, p_data: data, p_merge: true, p_must_exist: !!mustExist });\n}\nfunction crmList(col) { return crm('crm_list', { p_key: PROPS.getProperty('KEY'), p_col: col }) || []; }\n\n/** כל שעה. אפשר גם להריץ ידנית מהעורך. */\nfunction hourly() {\n  var rep = { at: new Date().toISOString(), receipts: 0, replies: 0, note: '' }, errs = [];\n  try { checkReplies(); rep.replies = pushReplies(); } catch (e) { errs.push('תשובות: ' + e.message); }\n  try { rep.receipts = scanReceipts(); } catch (e) { errs.push('קבלות: ' + e.message); }\n  rep.note = errs.join(' | ').slice(0, 400);\n  try { crmPut('sys', 'heartbeat', rep); } catch (e) { Logger.log('דיווח ל-CRM נכשל: ' + e.message); }\n  Logger.log(JSON.stringify(rep));\n  return { ok: !errs.length, report: rep };\n}\n\n/** כל לילה: גיבוי של כל ה-CRM בענן. */\nfunction daily() {\n  var r = crm('crm_backup', { p_key: PROPS.getProperty('KEY') });\n  Logger.log('גיבוי: ' + JSON.stringify(r));\n}\n\n/** מעדכן בכרטיס הליד ב-CRM שהלקוח ענה. */\nfunction pushReplies() {\n  var w = getWatchMap(), n = 0, changed = false;\n  Object.keys(w).forEach(function (k) {\n    var it = w[k];\n    if (!it.leadId || !it.replyAt || it.pushed === it.replyAt + it.status) return;\n    var r = crmPut('leads', it.leadId, { followStatus: it.status, replyAt: it.replyAt, replySnippet: it.snippet || '', followSeen: false }, true);\n    it.pushed = it.replyAt + it.status; changed = true;\n    if (r && r.ok) n++;\n  });\n  if (changed) saveWatch(w);\n  return n;\n}\n\n/* ---------------- קבלות מהמייל → הוצאות ב-CRM ---------------- */\nvar RCPT_Q = 'newer_than:3d -subject:\"ליד חדש\" -subject:\"בקשת הצטרפות\" (from:anthropic.com OR from:mail.anthropic.com OR from:payments-noreply@google.com OR from:googleplay-noreply@google.com OR from:stripe.com OR from:supabase.com OR from:supabase.io OR subject:receipt OR subject:invoice OR subject:קבלה OR subject:חשבונית OR subject:\"your receipt\" OR subject:\"payment received\")';\n\nfunction scanReceipts() {\n  var settings = (crmList('settings').filter(function (s) { return s.id === 'main'; })[0]) || {};\n  if (!settings.geminiKey) throw new Error('אין מפתח ג׳מיני ב-CRM (הגדרות ← חיבורים)');\n  var seen = {};\n  (settings.rcptSeen || []).forEach(function (id) { seen[id] = 1; });\n  JSON.parse(PROPS.getProperty('RCPT_SEEN') || '[]').forEach(function (id) { seen[id] = 1; });\n  var newSeen = [], added = 0, fixed = null;\n  var cats = settings.expenseCats || ['אחר'], usd = Number(settings.usdRate) || 3.11, eur = Number(settings.eurRate) || 3.6;\n  GmailApp.search(RCPT_Q, 0, 30).forEach(function (th) {\n    th.getMessages().forEach(function (m) {\n      var id = m.getId();\n      if (seen[id]) return;\n      seen[id] = 1; newSeen.push(id);\n      var txt = 'נושא: ' + m.getSubject() + '\\nשולח: ' + m.getFrom() + '\\nתאריך: ' + m.getDate().toISOString() + '\\n\\n' + String(m.getPlainBody() || '').slice(0, 6000);\n      var x = gemini(settings, 'זה מייל. אם הוא קבלה / חשבונית / אישור תשלום על קנייה או מנוי ששולם (לא הצעת מחיר, לא פרסומת, לא תזכורת לתשלום עתידי) – החזר JSON: {\"isReceipt\":true,\"vendor\":\"שם הספק\",\"item\":\"מה נקנה\",\"amount\":מספר,\"currency\":\"ILS או USD או EUR\",\"date\":\"YYYY-MM-DD\",\"recurring\":true אם זה מנוי שמתחדש באופן קבוע אחרת false,\"category\":\"אחד מ: ' + cats.join(' / ') + '\"}. אם זה לא קבלה – החזר {\"isReceipt\":false}. רק JSON.\\n\\n' + txt);\n      if (!x || !x.isReceipt || !(Number(x.amount) > 0)) return;\n      var rate = x.currency === 'USD' ? usd : x.currency === 'EUR' ? eur : 1, ils = Math.round(Number(x.amount) * rate);\n      var cur = x.currency && x.currency !== 'ILS' ? ' (' + x.amount + ' ' + (x.currency === 'USD' ? '$' : x.currency) + ' לפי שער ' + rate + ')' : '';\n      var link = 'https://mail.google.com/mail/u/0/#all/' + th.getId();\n      var receipt = { url: link, name: 'המייל עם הקבלה', mailId: id };\n      var vendor = String(x.vendor || 'ספק').trim(), item = String(x.item || '').trim();\n      var cat = cats.indexOf(x.category) >= 0 ? x.category : 'אחר';\n      var date = /^\\d{4}-\\d{2}-\\d{2}$/.test(x.date || '') ? x.date : Utilities.formatDate(new Date(), 'Asia/Jerusalem', 'yyyy-MM-dd');\n      if (x.recurring) {\n        if (!fixed) fixed = crmList('fixed');\n        var key = vendor.toLowerCase().split(' ')[0];\n        var ex = fixed.filter(function (f) { return String(f.vendor || f.name || '').toLowerCase().indexOf(key) >= 0; })[0];\n        if (ex) {\n          crmPut('fixed', ex.id, { lastReceipt: receipt, lastPaid: date, receipt: ex.receipt || receipt, notes: ((ex.notes || '') + '\\nחיוב ' + date + ': ' + ils + ' ₪' + cur + ' – נקלט מהמייל.').trim() });\n        } else {\n          crmPut('fixed', 'rc-' + id, { name: vendor + (item ? ' – ' + item : ''), vendor: vendor, category: cat, monthly: ils, startDate: date, receipt: receipt, notes: 'נקלט אוטומטית מקבלה במייל' + cur + '.', createdAt: new Date().toISOString() });\n          added++;\n        }\n      } else {\n        crmPut('expenses', 'rc-' + id, { date: date, vendor: vendor + (item ? ' – ' + item : ''), category: cat, amount: ils, assign: 'כללי', receipt: receipt, notes: 'נקלט אוטומטית מקבלה במייל' + cur + '.', createdAt: new Date().toISOString() });\n        added++;\n      }\n    });\n  });\n  if (newSeen.length) {\n    var all = newSeen.concat(JSON.parse(PROPS.getProperty('RCPT_SEEN') || '[]')).slice(0, 600);\n    PROPS.setProperty('RCPT_SEEN', JSON.stringify(all));\n  }\n  return added;\n}\n\nfunction gemini(settings, prompt) {\n  var model = settings.geminiModel || 'gemini-2.5-flash';\n  var r = UrlFetchApp.fetch('https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent?key=' + encodeURIComponent(settings.geminiKey), {\n    method: 'post', contentType: 'application/json', muteHttpExceptions: true,\n    payload: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: prompt }] }], generationConfig: { responseMimeType: 'application/json', temperature: 0 } })\n  });\n  if (r.getResponseCode() >= 300) return null;\n  try {\n    var j = JSON.parse(r.getContentText()), s = j.candidates[0].content.parts.map(function (p) { return p.text || ''; }).join('');\n    return JSON.parse(s.slice(s.indexOf('{'), s.lastIndexOf('}') + 1));\n  } catch (e) { return null; }\n}\n";

 ['📥 פניות ולידים','<p>כל ליד שממלא את הטופס באתר נקלט לבד ב<b>פניות</b> (בגרסה שבתוך Claude, כל 10 דקות כשה-CRM פתוח), עם משימה לחזור אליו. כפתור <b>"📥 משיכת לידים מהמייל"</b> בודק מיד. גוררים כרטיס בין השלבים: ליד חדש ← שיחת אפיון והדגמה ← הצעת מחיר ← משא ומתן ← עסקה נסגרה.</p>'],
 ['📞 מייל המשך אחרי שיחת טלפון','<ol><li>בכרטיס הליד לוחצים <b>"📞 דיברתי איתו בטלפון"</b>.</li><li>בוחרים תאריך שיחה (המייל יכתוב "היום" / "אתמול" / "שקיימנו"), פנייה (ר\' / הרב / בלי תואר), ואת שם המכון כפי שיופיע במייל.</li><li>מסמנים תוספות: בקשת תיקון, סמל המכון, רשימת שמות ומושגים. ב"דברים מיוחדים שסיכמנו" כותבים חופשי – הבינה המלאכותית מנסחת מחדש.</li><li><b>"הכנת המייל"</b> מציג את כל המייל – אפשר לערוך כל מילה.</li><li>רק <b>"שלח"</b> (ואישור) שולח. בלי זה לא יוצא כלום. המייל יוצא מהמייל העסקי כתשובה בשרשרת הקיימת עם הלקוח.</li><li>אחרי השליחה: נרשם "נשלח מייל המשך" והמצב "ממתין לחומרים". פעם בשעה נבדק אם הלקוח ענה – אז מופיע "הלקוח ענה" (או "התקבלו חומרים" אם שלח ג\'מבו מייל או קבצים) והתראה בראשי. המערכת אף פעם לא עונה ללקוח לבד.</li></ol>'],
 ['🎧 הקלטות ו🎙️ ניתוח שיחות','<p>בכרטיס ליד: <b>"+ הוספת הקלטה"</b> לשמירת הקלטות של הלקוח (עד 20MB לקובץ) ושמיעתן. <b>"🎙️ ניתוח שיחה"</b> נותן ציון 1–10 לשיחת מכירה, מה לשפר, הצעד הבא וטיוטת מייל – דורש מפתח ג\'מיני.</p>'],

 ['💸 הוצאות וקבלות','<p><b>כספים ← הוצאות</b>: כל ההוצאות – חד־פעמיות וחודשיות – בטבלה אחת. <b>📎 העלאת קבלה</b> בכל שורה. קבלות שמגיעות למייל העסקי (גם בהעברה מהמייל האישי) נרשמות לבד כהוצאה; מנוי קיים מתעדכן בלי כפילות. כפתור <b>"🧾 בדיקת קבלות במייל"</b> בודק מיד.</p>'],

  <li>למעלה מימין: <b>"פריסה" ← "פריסה חדשה"</b> ← גלגל השיניים ⚙ ← <b>"אפליקציית אינטרנט"</b>. "הפעלה בתור": <b>אני</b>. "למי יש גישה": <b>כל אחד</b>. ← <b>"פריסה"</b> ← העתק את <b>כתובת ה-URL</b> (מסתיימת ב-exec).</li>

 ['🏛️ מרכז שליטה – האפליקציה והאתר','<p>בתפריט ← <b>מערכות ← 🏛️ מרכז שליטה</b>. עובד בעותק שבמחשב (CRM-במחשב.html) – Claude חוסם חיבור לשרתים חיצוניים. נכנסים <b>פעם אחת</b> עם קוד למייל, ומאז ה-CRM נשאר מחובר במחשב הזה.</p><ul><li><b>סקירה</b>: חסידויות, משתמשים, הקלטות, תמלול היום והחודש, אחסון, מצב Groq ו-Gemini, ושימוש כל חסידות מול החבילה שלה.</li><li><b>חסידויות</b>: יצירת חסידות, השבתה והפעלה, פתיחה באפליקציה, העתקת הקישור, והוספה ל-CRM (לקוח + מערכת) בלחיצה.</li><li><b>משתמשים</b>: בוחרים חסידות – מוסיפים משתמש (נשלחת הזמנה), משנים תפקיד, משביתים, או מוציאים מהחסידות.</li><li><b>בקשות הצטרפות</b>: כל טופס מהאתר. בקשה חדשה נכנסת לבד ל"פניות" כליד; "אישור והזמנה" מצרף אותו לחסידות.</li><li><b>הודעות</b>: מה שמשתמשים כתבו לך באפליקציה – ותשובה מכאן.</li><li><b>כניסות</b>: מי נכנס לאפליקציה, מתי ומאיזה מכשיר.</li><li><b>סיכום חודשי</b> ו<b>האתר</b>: דקות תמלול לכל חסידות, וכניסות לאתר (צריך פעם אחת את הקוד של דף הסטטיסטיקה).</li></ul><p>שימוש החודש של כל חסידות מתעדכן לבד במנוי שלה ב-CRM, וכך עובדות ההתראות של 80% ו-100%.</p>'],
 ['☁️ שמירה בענן','<p><b>מרכז שליטה ← שמירה בענן</b>: מקימים פעם אחת טבלה ב-Supabase (העתקת קוד ← עורך ה-SQL ← Run), ואז "העלאת כל הנתונים לענן". מאותו רגע ה-CRM שבמחשב שומר הכול בענן – מגובה, ונפתח עם אותם נתונים מכל מחשב. רק אתה יכול לקרוא אותם.</p>'],

 ['💾 גיבוי','<p>בעותק שבמחשב הנתונים נשמרים רק בדפדפן – עשה גיבוי כל שבוע: <b>הגדרות ← גיבוי ושחזור</b>.</p>']];
